<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurs</title>
<style>
/* Book-to-course player styles. Light + dark, responsive, motion respects prefers-reduced-motion. */
:root {
  --bg: #f7f7fb; --surface: #ffffff; --surface-2: #f0f1f8; --text: #1d2033; --muted: #636b86;
  --border: #dfe2ee; --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #e4e9ff;
  --ok: #1f9d55; --ok-soft: #e1f6ea; --bad: #d64545; --bad-soft: #fde8e8; --warn: #c27c0e; --warn-soft: #fff3da;
  --code-bg: #14172a; --code-text: #e7e9f6; --code-head: #1e2240;
  --tok-kw: #ff7ab2; --tok-str: #8fd18f; --tok-num: #f6b26b; --tok-com: #7f87a8; --tok-fn: #7fb7ff; --tok-lit: #c79bff; --tok-bi: #6ad6d6;
  --shadow: 0 1px 2px rgba(20,24,60,.06), 0 6px 20px rgba(20,24,60,.06);
  --radius: 14px; --sidebar-w: 304px; --topbar-h: 56px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1120; --surface: #181b30; --surface-2: #20243d; --text: #e8eaf8; --muted: #9aa2c4;
  --border: #2b3052; --accent: #7c93ff; --accent-ink: #0f1120; --accent-soft: #232a55;
  --ok: #4cd08a; --ok-soft: #14301f; --bad: #ff7a7a; --bad-soft: #3a1b1f; --warn: #f0b34a; --warn-soft: #382c10;
  --code-bg: #0b0d1a; --code-head: #151932; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.65; font-size: 17px; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .12em .4em; border-radius: 6px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; text-decoration: none; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.topbar-progress { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 80px; max-width: 460px; margin-left: auto; font-size: .85rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #8a6bff); border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.save-state { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 1.1rem; }
.icon-btn:hover { background: var(--surface-2); }
#menuBtn { display: none; }

/* Layout */
.shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
.sidebar { position: sticky; top: var(--topbar-h); align-self: start; height: calc(100vh - var(--topbar-h)); overflow-y: auto; padding: 16px 12px 40px; border-right: 1px solid var(--border); background: var(--surface); }
.content { padding: 32px clamp(16px, 4vw, 56px) 96px; outline: none; }
.content > * { max-width: 820px; margin-left: auto; margin-right: auto; }
.scrim { display: none; }

/* Sidebar */
.nav-home, .nav-gloss { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--text); font-weight: 600; font-size: .95rem; }
.nav-home:hover, .nav-gloss:hover, .nav-lesson:hover { background: var(--surface-2); }
.nav-home.active, .nav-gloss.active { background: var(--accent-soft); }
.nav-ch { margin-top: 10px; }
.nav-ch > summary { cursor: pointer; list-style: none; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: .92rem; display: flex; gap: 8px; align-items: baseline; }
.nav-ch > summary::-webkit-details-marker { display: none; }
.nav-ch > summary::before { content: "▸"; color: var(--muted); transition: transform .2s; display: inline-block; }
.nav-ch[open] > summary::before { transform: rotate(90deg); }
.nav-ch .ch-pct { margin-left: auto; font-weight: 500; color: var(--muted); font-size: .8rem; }
.nav-lesson { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px 6px 26px; border-radius: 10px; text-decoration: none; color: var(--text); font-size: .9rem; line-height: 1.4; }
.nav-lesson.active { background: var(--accent-soft); font-weight: 600; }
.nav-lesson .st { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); margin-top: 2px; display: grid; place-items: center; font-size: .7rem; color: var(--accent-ink); }
.nav-lesson.done .st { background: var(--ok); border-color: var(--ok); }
.nav-lesson.started .st { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.nav-lesson.is-test .t::after { content: " 🏁"; }

/* Content typography */
h1, h2, h3, h4, h5 { line-height: 1.25; margin: 1.6em 0 .5em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); margin-top: 0; letter-spacing: -.01em; }
.crumb { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; margin-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-size: .8rem; font-weight: 600; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.lead { font-size: 1.12rem; color: var(--muted); margin-top: 6px; margin-bottom: 24px; }
.block { margin: 22px auto; }
.block > h3:first-child, .block > h4:first-child { margin-top: 0; }
.text p, .text li { margin: .6em 0; }
.text ul, .text ol { padding-left: 1.4em; }
.text blockquote, .frombook blockquote { margin: .8em 0; padding: .2em 1em; border-left: 4px solid var(--accent); color: var(--muted); }

/* Math */
math { line-height: 1.2; }
/* overflow-x alone makes overflow-y compute to auto, and tall formulas (roots, fractions) overflow by a few px */
.mathblock { overflow-x: auto; overflow-y: hidden; padding: .3em 0; margin: 1rem 0; }
.math-err { font-family: var(--mono); color: var(--bad); border-bottom: 1px dotted var(--bad); cursor: help; }
.math-raw { font-family: var(--mono); color: var(--muted); cursor: help; }
.mathml-warn { background: var(--warn-soft); color: var(--warn); text-align: center; padding: 8px 16px; font-size: .85rem; font-weight: 600; }

/* Scroll reveal */
.rv { opacity: 0; transform: translateY(16px); transition: opacity .55s ease, transform .55s ease; }
.rv.in { opacity: 1; transform: none; }

/* Callouts */
.callout { padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--border); border-left-width: 5px; background: var(--surface); box-shadow: var(--shadow); }
.callout .c-title { font-weight: 700; margin-bottom: 2px; display: flex; gap: 8px; align-items: center; }
.callout p { margin: .4em 0; }
.callout.tip { border-left-color: var(--ok); } .callout.note { border-left-color: var(--accent); }
.callout.warning { border-left-color: var(--warn); background: var(--warn-soft); } .callout.analogy { border-left-color: #a45bd8; }
.callout.key { border-left-color: var(--bad); } .callout.example { border-left-color: #1ba5b8; }

/* Code */
.code-wrap { background: var(--code-bg); color: var(--code-text); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.code-head { display: flex; justify-content: space-between; align-items: center; background: var(--code-head); padding: 6px 12px; font-family: var(--mono); font-size: .78rem; color: #aab1d6; }
.code-wrap pre { margin: 0; padding: 14px 0; overflow-x: auto; font-family: var(--mono); font-size: .9rem; line-height: 1.55; tab-size: 4; }
.code-wrap code { background: none; padding: 0; font-size: inherit; color: inherit; }
.ln { display: block; min-height: 1.55em; padding: 0 16px; white-space: pre; border-left: 3px solid transparent; transition: background .3s, border-color .3s; }
.ln.hl { background: rgba(124,147,255,.18); border-left-color: #7c93ff; }
.tk-kw { color: var(--tok-kw); } .tk-str { color: var(--tok-str); } .tk-num { color: var(--tok-num); } .tk-com { color: var(--tok-com); font-style: italic; }
.tk-fn { color: var(--tok-fn); } .tk-lit { color: var(--tok-lit); } .tk-bi { color: var(--tok-bi); }
.copy-btn { background: transparent; border: 1px solid #3a4070; color: #c6cbe9; border-radius: 8px; padding: 2px 10px; cursor: pointer; font-size: .75rem; }
.copy-btn:hover { background: #2a3060; }
.code-caption { color: var(--muted); font-size: .88rem; margin: 6px 4px 0; }
.term { background: #0b0d1a; color: #cfe8cf; font-family: var(--mono); font-size: .85rem; padding: 12px 16px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; margin: 8px 0 0; max-height: 360px; }
.out-label { font-size: .8rem; color: var(--muted); margin: 10px 0 2px; font-weight: 600; }

/* Buttons */
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: transform .1s, filter .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.08); } .btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { padding: 4px 12px; font-size: .88rem; }
.btn.ok { background: var(--ok); border-color: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Stepper */
.stepper, .derivation, .flow, .quiz, .exercise, .flash, .reveal, .summary, .svgfig, .tablewrap, .frombook { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.block-title { margin: 0 0 10px; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
.stepper-stage { min-height: 120px; }
.stepper-stage.anim-next { animation: slideNext .35s ease; } .stepper-stage.anim-prev { animation: slidePrev .35s ease; }
@keyframes slideNext { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slidePrev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.step-title { font-weight: 700; font-size: 1.05rem; margin: 0 0 6px; }
.dots { display: flex; gap: 6px; margin: 12px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .25s, transform .25s; border: 0; padding: 0; cursor: pointer; }
.dot.on { background: var(--accent); transform: scale(1.35); } .dot.past { background: color-mix(in srgb, var(--accent) 45%, var(--border)); }

/* Derivation */
.dv-rows { display: grid; gap: 8px; margin: 10px 0; }
.dv-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px 14px; padding: 8px 10px; border-radius: 10px; overflow-x: auto; transition: opacity .3s, background .3s; }
.dv-row .dv-lhs { text-align: right; } .dv-row .dv-rel { text-align: center; color: var(--muted); } .dv-row .dv-rhs { text-align: left; }
.dv-row .dv-why { grid-column: 1 / -1; font-size: .88rem; color: var(--muted); }
.dv-row.cur { background: var(--accent-soft); animation: fadeUp .4s ease; }
.dv-row.cur .dv-why { color: var(--text); font-weight: 500; margin-top: 2px; }
.dv-row.past { opacity: .6; }
.dv-row.hidden { display: none; }
.dv-result { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--ok-soft); }

/* Flow */
.flow-track { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
.flow-node { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface-2); color: var(--muted); font-weight: 600; transition: all .35s; cursor: pointer; }
.flow-node.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); transform: translateY(-2px); box-shadow: var(--shadow); }
.flow-node.cur { animation: pulse 1.2s ease 2; }
.flow-arrow { color: var(--border); font-size: 1.3rem; transition: color .35s; } .flow-arrow.on { color: var(--accent); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(59,91,219,.4); } 50% { box-shadow: 0 0 0 8px rgba(59,91,219,0); } }
.flow-detail { min-height: 3em; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); }

/* Reveal / from book / table / svg */
.reveal .prompt { font-weight: 600; } .reveal .answer { margin-top: 10px; animation: fadeUp .4s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.frombook { border-left: 5px solid #a45bd8; } .fb-label { font-size: .82rem; font-weight: 700; color: #a45bd8; text-transform: uppercase; letter-spacing: .04em; }
.tablewrap { overflow-x: auto; padding: 0; } table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; } th { background: var(--surface-2); font-weight: 700; }
.svgfig { text-align: center; } .svgfig svg { max-width: 100%; height: auto; }
.svgfig figcaption { color: var(--muted); font-size: .9rem; margin-top: 8px; }

/* Quiz */
.question { padding: 14px 0; border-top: 1px dashed var(--border); } .question:first-of-type { border-top: 0; }
.q-head { display: flex; gap: 12px; align-items: flex-start; } .q-text p { margin: 0 0 .3em; } .q-text { font-weight: 600; }
.q-num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.opts { display: grid; gap: 8px; margin: 12px 0 8px 40px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--surface); transition: border-color .2s, background .2s; }
.opt:hover { border-color: var(--accent); } .opt input { accent-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.fill-in { margin: 12px 0 8px 40px; } .fill-in input { width: min(420px, 100%); padding: 9px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-family: var(--mono); }
.fill-in input:focus { outline: none; border-color: var(--accent); } .fill-in.good input { border-color: var(--ok); } .fill-in.bad input { border-color: var(--bad); }
.order-list { list-style: none; margin: 12px 0 8px 40px; padding: 0; display: grid; gap: 8px; }
.order-list li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); transition: transform .25s, border-color .2s; }
.order-list li .txt { flex: 1; } .order-list.good li { border-color: var(--ok); } .order-list.bad li { border-color: var(--bad); }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 40px; }
.q-feedback { margin: 10px 0 0 40px; } .q-feedback .fb { padding: 10px 14px; border-radius: 10px; animation: fadeUp .35s ease; }
.fb.good { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); } .fb p { margin: .3em 0; }
.hints { margin: 8px 0 0 40px; } .hint { background: var(--warn-soft); padding: 8px 12px; border-radius: 10px; margin-top: 6px; } .pop { animation: fadeUp .3s ease; }
.scorebar { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); animation: fadeUp .4s ease; }
.scorebar.pass { background: var(--ok-soft); } .scorebar.fail { background: var(--bad-soft); }
.scorebar .big { font-size: 1.4rem; font-weight: 800; }
.quiz-foot { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Exercise */
.exercise { border-top: 5px solid var(--accent); }
.exercise h4 { margin: 14px 0 6px; font-size: .95rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.exercise details { margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; } .exercise summary { cursor: pointer; font-weight: 600; }
.exercise details > .code-wrap { margin: 10px 0; }
.cmdline { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-family: var(--mono); font-size: .88rem; overflow-x: auto; }
.cmdline code { background: none; flex: 1; white-space: pre; }
.checklist { list-style: none; padding: 0; margin: 8px 0; } .checklist li { margin: 6px 0; } .checklist label { display: flex; gap: 10px; cursor: pointer; } .checklist input { accent-color: var(--ok); width: 18px; height: 18px; margin-top: 4px; }
.run-status { margin-top: 10px; font-weight: 600; } .run-status.good { color: var(--ok); } .run-status.bad { color: var(--bad); }
.note-small { color: var(--muted); font-size: .88rem; }

/* Flashcards */
.flash-stage { perspective: 1000px; margin: 12px 0; }
.card { position: relative; height: 190px; cursor: pointer; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.card.flipped { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; backface-visibility: hidden; display: grid; place-items: center; padding: 18px; text-align: center; border-radius: 14px; border: 2px solid var(--border); background: var(--surface-2); font-size: 1.1rem; overflow: auto; }
.card .back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.flash-meta { color: var(--muted); font-size: .9rem; margin-bottom: 4px; }

/* Summary / terms */
.summary { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); }
.summary li { margin: .5em 0; list-style: none; position: relative; padding-left: 28px; opacity: 0; transform: translateX(-10px); }
.summary.in li { animation: itemIn .45s ease forwards; } .summary li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); font-weight: 800; }
@keyframes itemIn { to { opacity: 1; transform: none; } }
.summary ul { padding: 0; margin: 8px 0 0; }
.terms { border-top: 1px solid var(--border); margin-top: 36px; padding-top: 4px; } .terms dt { font-weight: 700; margin-top: 10px; } .terms dd { margin: 2px 0 0 0; color: var(--muted); }

/* Completion + nav */
.finish { margin-top: 36px; padding: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.finish h3 { margin: 0 0 8px; } .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.pager a { flex: 1 1 220px; display: block; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: var(--text); transition: border-color .2s, transform .15s; }
.pager a:hover { border-color: var(--accent); transform: translateY(-2px); } .pager small { color: var(--muted); display: block; } .pager .nx { text-align: right; }

/* Home */
.hero { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
.hero-text { flex: 1 1 320px; } .hero-text h1 { margin-bottom: 6px; }
.ring { position: relative; width: 132px; height: 132px; } .ring svg { transform: rotate(-90deg); } .ring .bg { stroke: var(--surface-2); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.6rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 18px; margin-bottom: 28px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); } .stat b { font-size: 1.5rem; display: block; } .stat span { color: var(--muted); font-size: .88rem; }
.ch-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-top: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.ch-card h3 { margin: 0 0 4px; display: flex; gap: 10px; align-items: center; } .ch-num { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 0 10px; font-size: .9rem; }
.ch-card ul { list-style: none; padding: 0; margin: 10px 0 0; } .ch-card li a { display: flex; gap: 10px; padding: 5px 0; text-decoration: none; color: var(--text); } .ch-card li a:hover { color: var(--accent); }
.ch-card .st { color: var(--ok); width: 1.2em; }
.footer-tools { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .88rem; }

/* Glossary */
.gloss-search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; margin-top: 10px; margin-bottom: 20px; }
.gloss-item { padding: 12px 0; border-bottom: 1px solid var(--border); } .gloss-item b { font-size: 1.05rem; } .gloss-item a { font-size: .82rem; margin-left: 8px; }

/* Confetti */
.confetti { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; font-size: 1.6rem; will-change: transform, opacity; }

/* Responsive */
@media (max-width: 900px) {
  .shell { display: block; } #menuBtn { display: inline-block; }
  /* align-self: auto undoes the desktop "start": newer Chrome applies it to fixed boxes, so the drawer grows to its content and cannot scroll */
  .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: min(88vw, 340px); height: auto; align-self: auto; overscroll-behavior: contain; z-index: 40; transform: translateX(-102%); transition: transform .28s ease; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; } body.nav-open .scrim { display: block; position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(10,12,30,.45); z-index: 35; }
  .save-state { display: none; } .opts, .fill-in, .order-list, .q-actions, .q-feedback, .hints { margin-left: 0; } body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .rv { opacity: 1; transform: none; } .summary li { opacity: 1; transform: none; }
}
.dlg-ov { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: var(--surface); color: var(--text); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.dlg p { margin: 0 0 16px; }
.dlg-act { display: flex; gap: 10px; justify-content: flex-end; }

.readblock { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid #1c9c6b; border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.readblock .fb-label { color: #1c9c6b; }
.read-body { margin: 8px 0 12px; }
.read-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.read-rate { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }

 "Show all", "stepByStep": "Step by step", "mathmlUnsupported": "Your browser can't display math formulas properly — update it to see equations typeset correctly."}, "chapters": [{"id": "ch01", "title": "Unit 1 · Wit and Wisdom", "summary": "A witty courtier, a garden full of stones and four wise young men.", "goals": ["Read and discuss three texts on wit and wisdom", "Use if-clauses, modals, compound words and sound words", "Practise intonation, apologies, notices and letters"], "lessons": ["ch01-01-wit-warmup", "ch01-02-wit-reflect", "ch01-03-wit-language", "ch01-04-wit-skills", "ch01-05-concrete-warmup", "ch01-06-concrete-poem", "ch01-07-concrete-language", "ch01-08-concrete-skills", "ch01-09-wisdom-warmup", "ch01-10-wisdom-reflect", "ch01-11-wisdom-language", "ch01-12-wisdom-skills", "ch01-99-test"]}, {"id": "ch02", "title": "Unit 2: Values and Dispositions", "summary": "A soldier's sacrifice, a boy's kindness and a milkman's letter to his grandson.", "goals": ["Read and discuss three texts on values", "Use subject-verb agreement, dashes, its/it's and prepositional phrases", "Practise stress, chunking, a letter of enquiry, a diary entry and a letter"], "lessons": ["ch02-01-valour-story", "ch02-02-valour-reflect", "ch02-03-valour-language", "ch02-04-valour-skills", "ch02-05-mother-poem", "ch02-06-mother-reflect", "ch02-07-mother-language", "ch02-08-mother-skills", "ch02-09-kurien-story", "ch02-10-kurien-reflect", "ch02-11-kurien-language", "ch02-12-kurien-skills", "ch02-99-test"]}, {"id": "ch03", "title": "Unit 3: Mystery and Magic", "summary": "A boy detective's coded clue, a girl with a magic brush and India's natural wonders.", "goals": ["Read and discuss three texts on mystery and magic", "Use phrasal verbs, reported questions, participles and gerunds", "Practise requests, a group discussion, a report and imaginative/descriptive essays"], "lessons": ["ch03-01-fifth-story", "ch03-02-fifth-reflect", "ch03-03-fifth-language", "ch03-04-fifth-skills", "ch03-05-brush-story", "ch03-06-brush-reflect", "ch03-07-brush-language", "ch03-08-brush-skills", "ch03-09-wonders-read", "ch03-10-wonders-reflect", "ch03-11-wonders-language", "ch03-12-wonders-skills", "ch03-99-test"]}, {"id": "ch04", "title": "Unit 4: Environment", "summary": "A boy and his cherry tree, a hymn of thanks for the harvest and a farmer who waits for rain.", "goals": ["Read and discuss three texts on the environment", "Use tenses, punctuation, determiners, homophones and archaic words", "Practise syllables, silent letters, a presentation, a role-play, an article, a slogan and a letter"], "lessons": ["ch04-01-cherry-story", "ch04-02-cherry-reflect", "ch04-03-cherry-language", "ch04-04-cherry-skills", "ch04-05-hymn-poem", "ch04-06-hymn-reflect", "ch04-07-hymn-language", "ch04-08-hymn-skills", "ch04-09-rain-story", "ch04-10-rain-reflect", "ch04-11-rain-language", "ch04-12-rain-skills", "ch04-99-test"]}, {"id": "ch05", "title": "Unit 5 · Science and Curiosity", "summary": "A canary in space, the magic of a magnifying glass and India's first woman physicist.", "goals": ["Read and discuss three texts on science and curiosity", "Use future forms, passive voice, suffixes, acronyms and clipping", "Practise silent letters, panel talks, reports and articles"], "lessons": ["ch05-01-feathered-story", "ch05-02-feathered-reflect", "ch05-03-feathered-language", "ch05-04-feathered-skills", "ch05-05-magnify-poem", "ch05-06-magnify-reflect", "ch05-07-magnify-skills", "ch05-08-bibha-story", "ch05-09-bibha-language", "ch05-10-bibha-skills", "ch05-99-test"]}], "lessons": {"ch01-01-wit-warmup": {"title": "The Wit that Won Hearts: warm-up and the story", "summary": "Warm up with qualities and riddles, listen to the story of Tenali Rama and the quarrelling king, and check what you understood.", "blocks": [{"type": "text", "md": "Wit means clever, quick and funny thinking. In this lesson you first warm up with qualities and riddles, then **listen to the story** of how Tenali Rama ended a royal quarrel, and finally check your understanding."}, {"type": "quiz", "title": "Before you read I: qualities of a witty person", "questions": [{"type": "multi", "q": "Which of these qualities suit a person who uses wit? (Choose all that fit.)", "options": ["clever", "serious", "stubborn", "humorous", "observant", "creative", "punctual"], "answer": [0, 3, 4, 5], "explanation": "A witty person thinks quickly (clever), makes people smile (humorous), notices small details (observant) and finds fresh ideas (creative). Others such as wise, charming or confident can also fit - in class, give your reasons.", "hints": ["Think of someone who answers a problem with a clever joke."]}], "id": "ch01-01-qu1"}, {"type": "quiz", "title": "Before you read II: riddles", "questions": [{"type": "fill", "q": "I can be a friend or a foe, depending on how you use me. I can bring joy or pain. What am I?", "answer": ["words", "word"], "explanation": "Kind words heal and harsh words hurt.", "hints": ["You use me when you speak."]}, {"type": "fill", "q": "What is always in front of you but can't be seen?", "answer": ["the future", "future"], "explanation": "The future is always ahead but nobody can see it.", "hints": ["Think about time that has not come yet."]}, {"type": "fill", "q": "I can be measured but not touched. I can be spent but not saved. What am I?", "answer": "time", "explanation": "We measure time and spend it, but we can never store it.", "hints": ["Clocks measure me."]}, {"type": "fill", "q": "What has to be shared before you can keep it?", "answer": ["a secret", "secret"], "explanation": "A secret is only a secret once someone has been told it and agrees to keep it.", "hints": ["It is something you whisper."]}], "id": "ch01-01-qu2"}, {"type": "exercise", "title": "Discuss in pairs", "difficulty": "easy", "minutes": 8, "goal": "Discuss these four questions with a partner: (1) Why are humour and wit important in a person? (2) Why did kings and queens like witty courtiers? (3) How would you settle a disagreement between two people? (4) Has a small misunderstanding ever become a big problem for you? How did it end?", "checklist": ["I gave a reason for question 1", "I linked question 2 to advice and problem-solving", "I described clear steps for question 3", "I told a short real or imagined story for question 4"], "solution": "1) Wit makes tense moments lighter and shows quick thinking.\n2) A witty courtier could give advice, calm anger and solve problems without hurting anyone.\n3) Listen to both sides, find the real cause, stay calm and suggest a fair solution.\n4) Example: a friend thought I ignored her message; we talked, I explained my phone was off, and we laughed about it.", "solution_lang": "text", "hints": ["Use 'because' in every answer."], "id": "ch01-01-ex1", "mode": "selfcheck"}, {"type": "read", "title": "The Wit that Won Hearts (short retelling)", "label": "Read", "md": "King Krishnadeva Raya ruled the Vijayanagara Empire from 1509 to 1529. It was a golden age for art, poetry and building. He was a warrior and a poet, and his court had eight famous poets called the Ashtadiggajas. One of them, Tenali Ramakrishna, was loved for his quick wit.\n\nOne day the king quarrelled with Queen Thirumalambal over a small matter. For weeks he did not speak to her or visit her, and the palace felt lonely and quiet.\n\nThe queen explained what had happened. The king had written a poem full of vague words about the sun, moon and stars. His ministers made excuses and avoided it. One tired evening he read it to her, and she yawned again and again. The king thought she was insulting his poem and walked out angrily. She asked Tenali Rama to help. Rama said he needed time to make a good plan.\n\nThe next morning the court was busy discussing how to grow more paddy. Ministers suggested better irrigation and manure. Rama walked up with a plate of seeds and said they would give three times the harvest. A courtier joked that they must be magic seeds from the moon, and others sniggered. The king frowned and said the idea sounded absurd and risky for farmers.\n\nRama calmly replied that the real problem was the person who sows. Someone who yawns while sowing would scatter the seeds unevenly. The court burst out laughing. The king yawned too. Rama asked whether anyone in the world does not yawn, since it is as natural as breathing.\n\nThe king suddenly understood. He remembered how harshly he had scolded the queen for yawning and felt sorry. That evening he apologised gently and admitted his pride had blinded him. The queen forgave him and asked to hear his poem. The royal couple later rewarded Rama, and the palace was filled again with joy.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original text in your textbook as well."}, {"type": "quiz", "title": "Let us discuss: set the false statements right", "questions": [{"type": "single", "q": "Statement: 'The queen insulted the king by speaking against his poem.' What really happened?", "options": ["She yawned because she was tired, and the king took it as disrespect.", "She laughed loudly at the poem.", "She refused to listen to the poem at all.", "She told the ministers the poem was bad."], "answer": 0, "explanation": "She never criticised the poem. Her yawns came from tiredness, and the king misunderstood.", "hints": ["Think about why she yawned."]}, {"type": "single", "q": "Statement: 'Tenali Rama immediately went to the king and convinced him to talk to the queen.' What really happened?", "options": ["He asked for time to plan and acted the next morning in court.", "He refused to help the queen.", "He wrote a letter to the king.", "He asked the ministers to speak to the king."], "answer": 0, "explanation": "Rama said a well-planned approach was needed, so he waited until the next day.", "hints": ["Remember what Rama told the queen."]}, {"type": "single", "q": "Statement: 'The courtiers admired the king's poem and praised his talent.' What really happened?", "options": ["The ministers avoided the king and made excuses when he tried to recite it.", "They memorised it.", "They asked him to recite it every day.", "They sent it to other kingdoms."], "answer": 0, "explanation": "The poem was vague and the ministers kept away from it.", "hints": ["Re-read what the queen said about the ministers."]}, {"type": "single", "q": "Statement: 'The ministers were eager to hear Tenali Rama's idea about paddy.' What really happened?", "options": ["A courtier mocked the idea with sarcasm and others sniggered.", "They clapped at once.", "They fell asleep.", "They agreed to plant the seeds."], "answer": 0, "explanation": "The court doubted Rama until his clever reply made them laugh.", "hints": ["Recall the 'magic seeds from the moon' joke."]}, {"type": "single", "q": "Statement: 'The king never realised his mistake and stayed angry.' What really happened?", "options": ["He understood, felt sorry and apologised to the queen that evening.", "He sent Rama away.", "He asked the queen to apologise.", "He left the palace."], "answer": 0, "explanation": "Rama's yawn example made the king see how unfair he had been.", "hints": ["Look at the last scene."]}], "id": "ch01-01-qu3"}, {"type": "summary", "points": ["Wit is quick, clever and kind thinking that solves problems.", "A small misunderstanding (a yawn) caused a long quarrel.", "Rama used humour and a clever example instead of lecturing the king.", "Pride can blind a person to the truth; an honest apology repairs relationships."]}], "terms": [{"term": "wit", "def": "quick, clever and funny thinking"}, {"term": "misunderstanding", "def": "a wrong idea about what someone meant"}], "id": "ch01-01-wit-warmup", "chapter": "ch01", "kind": "lesson", "minutes": 20}, "ch01-02-wit-reflect": {"title": "The Wit that Won Hearts: think and reflect", "summary": "Answer the extract questions and the long questions on the story.", "blocks": [{"type": "text", "md": "Now go deeper. Use evidence from the story in every answer. The multiple-choice and fill-in questions are checked for you; the longer questions have a checklist and a model answer."}, {"type": "quiz", "title": "Extract 1: the queen asks Rama for help", "questions": [{"type": "single", "q": "What does the queen's line 'If I had known this would happen, I would have chosen another day' suggest about her feelings?", "options": ["She is angry at the king for overreacting.", "She regrets the unintended misunderstanding.", "She believes the poem was not worth listening to.", "She is worried the king might punish her."], "answer": 1, "explanation": "She did not mean to hurt him; she only wishes she had picked a better time.", "hints": ["Is she blaming or regretting?"]}, {"type": "single", "q": "Fill in: The king's reaction shows that he is sensitive and ______ in his poetry.", "options": ["has a lot of faith", "takes great pride"], "answer": 1, "explanation": "He was offended quickly, which shows how much pride he takes in his work.", "hints": ["Think about why he stormed off."]}], "id": "ch01-02-qu1"}, {"type": "exercise", "title": "Why does the queen believe only Tenali Rama can help?", "difficulty": "easy", "minutes": 8, "goal": "In 2-3 sentences, explain why the queen trusts Rama more than anyone else.", "checklist": ["Mentions Rama's wit / clever solutions", "Mentions that the king respects him"], "solution": "The queen knows Rama is the court's brilliant and witty poet who has solved seemingly impossible problems before. She also knows the king values him, so Rama can make the king understand without making him angrier.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "How does Rama's reply show wisdom and problem-solving?", "difficulty": "easy", "minutes": 8, "goal": "Explain how his reply 'I will try my best... but this needs a well-planned approach' shows these qualities.", "checklist": ["Mentions he did not rush", "Mentions planning / strategy", "Mentions he stayed calm and polite"], "solution": "Rama did not promise a quick fix. He listened patiently, admitted the problem needed a careful plan and asked for time. This shows he thinks before he acts and chooses the right method.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Extract 2: the king apologises", "questions": [{"type": "fill", "q": "When the king says 'I let my pride blind me', he means that his pride stopped him from seeing ______. (one short phrase)", "answer": ["the truth", "that yawning was not disrespect", "the queen's side", "his mistake"], "explanation": "Pride kept him from seeing that the yawn was only tiredness.", "hints": ["Blind = unable to see."]}, {"type": "single", "q": "Why does the queen say 'If you like, we can leave this quarrel behind us'?", "options": ["She wants to be polite and give him the choice, showing she forgives.", "She is still angry.", "She wants him to apologise again.", "She wants a reward."], "answer": 0, "explanation": "'If you like' is a gentle, polite way of offering peace without forcing it.", "hints": ["Think about her tone."]}, {"type": "single", "q": "The king admits his pride clouded his judgement. This shows ______.", "options": ["intelligence and courage", "maturity and self-awareness"], "answer": 1, "explanation": "Seeing and admitting one's own fault is a sign of maturity.", "hints": ["He is looking at himself honestly."]}], "id": "ch01-02-qu2"}, {"type": "exercise", "title": "One quality the queen shows in her reply", "difficulty": "easy", "minutes": 8, "goal": "Name ONE quality of the queen shown by her response to the king's apology and support it.", "checklist": ["Names a quality (forgiving, gracious, patient, loving...)", "Gives a reason from her words"], "solution": "She is forgiving and gracious. She accepts the apology at once, offers to move on and shows interest in his poem, which tells us she values the relationship more than being proved right.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex3", "mode": "selfcheck"}, {"type": "exercise", "title": "Q1 Golden Era", "difficulty": "easy", "minutes": 8, "goal": "Why was Krishnadeva Raya's reign called the 'Golden Era' of the Vijayanagara Empire?", "checklist": ["Mentions art, literature, architecture", "Mentions the king as patron/poet/warrior"], "solution": "Art, literature and architecture flourished. The king was a great patron of learning, a warrior and a poet whose works (such as Amuktamalyada) are still praised.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex4", "mode": "selfcheck"}, {"type": "exercise", "title": "Q2 Rama's special place", "difficulty": "easy", "minutes": 8, "goal": "How did Tenali Ramakrishna gain a special place in the court?", "checklist": ["Mentions quick wit and humour", "Mentions clever solutions"], "solution": "He was one of the Ashtadiggajas and became both a poet and a witty advisor. His quick humour and clever solutions to difficult problems made him loved.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex5", "mode": "selfcheck"}, {"type": "exercise", "title": "Q3 Effect of the quarrel", "difficulty": "easy", "minutes": 8, "goal": "How did the quarrel affect the palace?", "checklist": ["Mentions the silence/loneliness", "Mentions the king staying away"], "solution": "The king stopped speaking to the queen and visiting her. A shadow fell over the palace and its cheerful corridors became quiet and lonely.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex6", "mode": "selfcheck"}, {"type": "exercise", "title": "Q4 Rama's strategy", "difficulty": "easy", "minutes": 8, "goal": "What strategy did Rama use to make the king realise his mistake?", "checklist": ["Mentions the paddy seeds", "Mentions the yawning remark", "Mentions humour"], "solution": "He pretended to present magic paddy seeds. When the king doubted them, Rama said the problem was a sower who yawns. The court laughed, the king yawned, and Rama pointed out that everyone yawns, so the king saw the queen's yawn was natural.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex7", "mode": "selfcheck"}, {"type": "exercise", "title": "Q5 The courtiers' reaction", "difficulty": "easy", "minutes": 8, "goal": "How did the courtiers react to the 'special' seeds?", "checklist": ["Murmur", "Sarcasm and snickers"], "solution": "A murmur swept the court. One courtier joked that they must be magic seeds, another said Rama found them on the moon, and the court sniggered.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex8", "mode": "selfcheck"}, {"type": "exercise", "title": "Q6 Ending and lesson", "difficulty": "easy", "minutes": 8, "goal": "How does the story end and what lesson can we learn?", "checklist": ["Describes the apology and reunion", "States a lesson"], "solution": "The king apologises, the queen forgives him and the palace is happy again. Lesson: do not judge people too quickly, talk before getting angry and admit your mistakes. Wit can solve problems peacefully.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-02-ex9", "mode": "selfcheck"}, {"type": "summary", "points": ["The queen's words show regret, not insult.", "The king's pride made a small matter big; his apology showed maturity.", "Rama solved the problem by planning and by using humour.", "When you answer long questions, always give a reason from the story."]}], "id": "ch01-02-wit-reflect", "chapter": "ch01", "kind": "lesson", "minutes": 75}, "ch01-03-wit-language": {"title": "The Wit that Won Hearts: language practice", "summary": "Practise expressions, sound words, compound words and if-clauses.", "blocks": [{"type": "text", "md": "This lesson practises vocabulary and grammar from the story: expressions, sound words, compound words and the three kinds of if-sentence."}, {"type": "quiz", "title": "Fill the paragraph with the right expression (I)", "questions": [{"type": "fill", "q": "'... an argument began over a minor issue, and ______, making everyone feel uncomfortable.' Choose from: cast a shadow / murmur swept through the room / hush fell over / mind raced back / stormed off / rippled through", "answer": "hush fell over", "explanation": "Silence fell when the argument started.", "hints": ["The mood suddenly became quiet."]}, {"type": "fill", "q": "'... laughter ______ the gathering, making everyone relaxed.'", "answer": "rippled through", "explanation": "Laughter spreads like ripples.", "hints": ["Spreading through a group."]}, {"type": "fill", "q": "'The person who started the argument ______.'", "answer": "stormed off", "explanation": "He left angrily.", "hints": ["He left in anger."]}, {"type": "fill", "q": "'Everyone disapproved of the action and a ______.'", "answer": "murmur swept through the room", "explanation": "A low sound of disapproval.", "hints": ["'a ...' needs a noun phrase."]}, {"type": "fill", "q": "'My ______ to how my mother had saved other situations.'", "answer": "mind raced back", "explanation": "The narrator quickly remembers the past.", "hints": ["Thoughts going back in time."]}, {"type": "fill", "q": "'... such moments would have ______ over the gatherings.'", "answer": "cast a shadow", "explanation": "Trouble 'casts a shadow'.", "hints": ["Think of gloom."]}], "id": "ch01-03-qu1"}, {"type": "quiz", "title": "Sound words (II)", "questions": [{"type": "fill", "q": "A ______ of excitement spread through the classroom.", "answer": "murmur", "explanation": "A murmur is a low, soft sound.", "hints": ["Soft, many voices."]}, {"type": "fill", "q": "Anaya ______ in relief.", "answer": "sighed", "explanation": "A sigh shows relief.", "hints": ["Breathe out."]}, {"type": "fill", "q": "'Think carefully,' the teacher began to ______ as she wrote.", "answer": "mumble", "explanation": "Speaking softly, not clearly.", "hints": ["Almost under the breath."]}, {"type": "fill", "q": "A few students ______, realising it wasn't easy.", "answer": "gasped", "explanation": "A sudden breath of surprise.", "hints": ["Surprise."]}, {"type": "fill", "q": "Some exchanged ______, wondering if anyone could solve it.", "answer": "snickers", "explanation": "Suppressed laughter or comments.", "hints": ["Used in the story."]}, {"type": "fill", "q": "Anaya tapped her book on the desk with a small ______.", "answer": "thud", "explanation": "A dull sound.", "hints": ["Heavy, dull."]}, {"type": "fill", "q": "She said, stretching with a ______, as if it took great effort.", "answer": "groan", "explanation": "A low sound of effort.", "hints": ["Effort sound."]}, {"type": "fill", "q": "A small breeze made the windows ______.", "answer": "rattle", "explanation": "Windows shake and make noise.", "hints": ["Wind and glass."]}, {"type": "fill", "q": "'So, what's the answer?' the students ______ with playful enthusiasm.", "answer": "roared", "explanation": "Many loud voices.", "hints": ["Loud."]}, {"type": "fill", "q": "Leaning forward, Anaya ______, 'Sometimes the trickiest questions have the simplest answers.'", "answer": "whispered", "explanation": "Said softly as a secret.", "hints": ["Opposite of shouted."]}], "id": "ch01-03-qu2"}, {"type": "quiz", "title": "Compound words (III)", "questions": [{"type": "single", "q": "quick + ?", "options": ["witted", "blue", "hold", "hall"], "answer": 0, "explanation": "quick-witted = clever and fast in thinking (hyphenated compound).", "hints": ["A word describing a mind."]}, {"type": "single", "q": "soft + ?", "options": ["tempered", "spoken", "sense", "store"], "answer": 1, "explanation": "soft-spoken = speaking in a gentle voice.", "hints": ["Voice."]}, {"type": "single", "q": "common + ?", "options": ["sense", "hold", "hall", "blue"], "answer": 0, "explanation": "common sense (open compound) = practical good judgement.", "hints": ["Everyday judgement."]}, {"type": "single", "q": "house + ?", "options": ["hold", "store", "tempered", "hall"], "answer": 0, "explanation": "household (closed compound) = a family living together.", "hints": ["Home."]}, {"type": "single", "q": "book + ?", "options": ["witted", "store", "blue", "spoken"], "answer": 1, "explanation": "bookstore (closed compound).", "hints": ["Where books are sold."]}, {"type": "single", "q": "ill + ?", "options": ["tempered", "hall", "sense", "hold"], "answer": 0, "explanation": "ill-tempered = easily angry.", "hints": ["Mood."]}, {"type": "single", "q": "sky + ?", "options": ["blue", "witted", "hold", "store"], "answer": 0, "explanation": "sky blue (open compound) = light blue.", "hints": ["Colour."]}, {"type": "single", "q": "dance + ?", "options": ["hall", "sense", "spoken", "tempered"], "answer": 0, "explanation": "dance hall (open compound).", "hints": ["Place."]}, {"type": "fill", "q": "Fill: Ravi was ______, always speaking calmly even in arguments.", "answer": "soft-spoken", "explanation": "Matches the pair soft + spoken.", "hints": ["Gentle voice."]}], "id": "ch01-03-qu3"}, {"type": "quiz", "title": "If-clauses (IV)", "questions": [{"type": "single", "q": "'If, by chance, something were to go wrong, our farmers would suffer.' Which is the subordinate (if) clause?", "options": ["If, by chance, something were to go wrong", "our farmers would suffer", "something were to go", "go wrong, our farmers"], "answer": 0, "explanation": "The if-clause states the imagined condition; the main clause is 'our farmers would suffer'.", "hints": ["Which part begins with 'If'?"]}, {"type": "single", "q": "'If I had known this would happen, I would have chosen another day.' The main clause is ______.", "options": ["I would have chosen another day", "If I had known", "this would happen", "known this"], "answer": 0, "explanation": "Main clause = the result.", "hints": ["Which part could stand alone?"]}, {"type": "single", "q": "If I had a magic wand,", "options": ["I would give myself wings.", "We will go to the theatre.", "You would have solved the puzzle.", "We will stay indoors and play board games."], "answer": 0, "explanation": "'had' + 'would' = imagined situation in the present.", "hints": ["Imaginary present."]}, {"type": "single", "q": "If it rains tomorrow,", "options": ["We will stay indoors and play board games.", "I would sneak into the secret room.", "The boys would have woken up on time.", "I would give myself wings."], "answer": 0, "explanation": "Real future possibility: simple present + will.", "hints": ["Possible future."]}, {"type": "single", "q": "If you had listened carefully,", "options": ["You would have solved the puzzle.", "We will go to the theatre.", "I would sneak into the secret room.", "I would give myself wings."], "answer": 0, "explanation": "Past perfect + would have + past participle = a past that cannot be changed.", "hints": ["Past regret."]}, {"type": "single", "q": "If you finish your homework,", "options": ["We will go to the theatre.", "The boys would have woken up on time.", "You would have solved the puzzle.", "I would give myself wings."], "answer": 0, "explanation": "Possible future: simple present + will.", "hints": ["A real promise."]}, {"type": "single", "q": "If I were invisible,", "options": ["I would sneak into the secret room.", "We will stay indoors and play board games.", "We will go to the theatre.", "The boys would have woken up on time."], "answer": 0, "explanation": "'were' + would = imaginary.", "hints": ["Imaginary."]}, {"type": "single", "q": "If the alarm had rung,", "options": ["The boys would have woken up on time.", "I would give myself wings.", "You would have solved the puzzle.", "We will go to the theatre."], "answer": 0, "explanation": "Past perfect + would have.", "hints": ["Past."]}], "id": "ch01-03-qu4"}, {"type": "exercise", "title": "V & VI: complete the sentences", "difficulty": "medium", "minutes": 10, "goal": "Finish each sentence in your own way: (1) Your teacher will be unhappy if ... (2) They would have caught the train if ... (3) ... if you continue to stay up late every night. (4) If she knew the answer, ... (5) ... if she had studied harder. (6) If I had a million rupees, ... Then complete: If I were the Head Teacher / a bird / a magician, ... and If I had studied harder, ...", "checklist": ["Real future: simple present + will (1, 3)", "Past regret: had + would have (2, 5)", "Imaginary: past tense / were + would (4, 6, VI)"], "solution": "1) ...you do not submit your homework.\n2) ...they had left home ten minutes earlier.\n3) You will feel tired in class if you continue to stay up late every night.\n4) If she knew the answer, she would raise her hand.\n5) She would have scored higher if she had studied harder.\n6) If I had a million rupees, I would build a library for my village.\nVI) If I were the Head Teacher, I would start a reading hour. If I were a bird, I would fly over the sea. If I were a magician, I would make all hungry children smile with a feast. If I had studied harder, I would have passed with distinction.", "solution_lang": "text", "hints": ["Match tenses: had ... would have; were ... would."], "id": "ch01-03-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["Expressions like 'hush fell over' and 'stormed off' make writing vivid.", "Sound words (murmur, gasped, thud) show how something sounds.", "Compound words can be closed, hyphenated or open.", "If-clauses: real future (present + will), imaginary (past + would), past regret (had + would have)."]}], "terms": [{"term": "compound word", "def": "a word made of two or more words"}, {"term": "subordinate clause", "def": "a clause that cannot stand alone, such as an if-clause"}], "id": "ch01-03-wit-language", "chapter": "ch01", "kind": "lesson", "minutes": 35}, "ch01-04-wit-skills": {"title": "The Wit that Won Hearts: listen, speak, write, explore", "summary": "Listen to a second Tenali Rama story, practise intonation, write a narrative essay and explore.", "blocks": [{"type": "text", "md": "Press **Listen**, then answer. You may play the audio as many times as you like."}, {"type": "read", "title": "Let us listen: Rama and the proud scholar", "label": "Listen", "md": "A famous scholar, proud of his learning, came to Vijayanagara to challenge the scholars in King Krishnadeva Raya's court. The court scholars were afraid. They feared losing to him, and they also feared the king's anger if they refused. They knew only quick-witted Tenali Rama could handle it, and Rama agreed to accept the challenge.\n\nThe next day Rama and the visitor sat facing each other. Beside Rama lay a bundle wrapped in silk. Rama touched it and said, let us begin by discussing the merits of tila-kashta-mahisha-bandhana. The scholar was taken aback. Although he had read thousands of works, he had never heard of this one. He had nothing to say, admitted defeat and left the palace, ashamed.\n\nThe king was curious about this great work. Rama smiled and removed the silk. Inside was a bundle of sticks tied with a thick rope. Rama explained that til means sesame and kashta means stick, so tilakashta means sesame sticks. Mahisha means buffalo and bandhana means tying, so the rope is the one used to tie a buffalo. The king burst out laughing. Rama had taught the arrogant scholar a lesson.", "note": "This audio is a short script written for this app, based on the textbook activity. Your teacher's original transcript is in the book."}, {"type": "quiz", "title": "Listen and choose", "questions": [{"type": "single", "q": "The rope tying the bundle of sticks was ______.", "options": ["loose", "thick", "short"], "answer": 1, "explanation": "The story says a thick rope tied the sticks.", "hints": ["Listen to the last paragraph."]}, {"type": "single", "q": "The scholar is finally referred to as ______.", "options": ["irritable", "mischievous", "arrogant"], "answer": 2, "explanation": "He was proud and wanted to show his superiority, so he was arrogant.", "hints": ["Think of 'proud'."]}], "id": "ch01-04-qu1"}, {"type": "quiz", "title": "Put the events in order", "questions": [{"type": "order", "q": "Order the events of the story.", "items": ["The visitor wanted to show his superiority over others in the palace.", "The court scholars were afraid of the king's anger.", "Rama accepted the challenge thrown by the visitor.", "Rama had a bundle tied in silk when he came to the palace.", "The great scholar was ashamed because he did not know what to say.", "The king wanted to know more about the work mentioned by Rama.", "Rama showed the work to be a bundle of sticks tied together by a rope.", "The king laughed at the explanation given by Rama."], "explanation": "Challenge -> fear -> Rama accepts -> silk bundle -> scholar defeated -> king curious -> reveal -> laughter.", "hints": ["Start with the visitor's reason for coming."]}], "id": "ch01-04-qu2"}, {"type": "text", "md": "**Intonation** is the rise and fall of your voice. 'Yes/No' questions rise at the end (Are you coming home? ↗). Questions with a question word (what, when, where, why, who, how) fall at the end (When will you come home? ↘)."}, {"type": "quiz", "title": "Speak: rising or falling?", "questions": [{"type": "multi", "q": "Which of these questions end with a RISING tone?", "options": ["Is this your cat?", "What is the name of your cat?", "Will you be going to your village?", "Why are you going to your village?", "Is this where you live?", "Where do you live?", "Can I meet your parents?", "How are your parents?", "Do you have any plans for tomorrow?", "What are you going to do tomorrow?"], "answer": [0, 2, 4, 6, 8], "explanation": "Yes/No questions rise; wh-questions fall.", "hints": ["Which can be answered with 'yes' or 'no'?"]}, {"type": "single", "q": "Correct word order: which is right?", "options": ["Who is the cleverest character in the story?", "Who the cleverest character is in the story?"], "answer": 0, "explanation": "In a question the verb comes before the rest: question word + verb + subject.", "hints": ["Compare with 'Where is he?'"]}], "id": "ch01-04-qu3"}, {"type": "exercise", "title": "Speak: trip and folktale questions", "difficulty": "easy", "minutes": 8, "goal": "Work with a partner. Ask and answer 6 questions about a trip you plan (Where? Why? How? When? Who? What?) and then 6 about a witty character from a folktale (Who? Why? What? When? How? Where?). Use correct intonation.", "checklist": ["I used each question word once", "Wh-questions fall; yes/no questions rise", "Word order is correct"], "solution": "Trip: Where are you going? Why are you going there? How will you travel? When will you leave? Who is coming with you? What will you do there?\nFolktale: Who is your favourite witty character? Why is his wit important in the story? What is his most famous trick? When does the story happen? How does he solve the problem? Where does the story take place?", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-04-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Write: features of a narrative essay", "questions": [{"type": "multi", "q": "Which are features of a narrative essay such as 'A Lesson in Responsibility'?", "options": ["A clear opening that sets the context", "First-person narration (I, my)", "A problem or turning point", "Only facts and statistics, no feelings", "A lesson or message in the conclusion"], "answer": [0, 1, 2, 4], "explanation": "A narrative essay shares a personal experience in order, with feelings, a turning point and a lesson.", "hints": ["It is a story about you."]}], "id": "ch01-04-qu4"}, {"type": "exercise", "title": "Write a narrative essay", "difficulty": "medium", "minutes": 25, "goal": "Write a narrative essay (about 200 words) on ONE topic: 'The Day I Learnt the Value of Teamwork' or 'A Small Act of Kindness that Made a Difference'.", "checklist": ["Engaging opening that sets the scene", "Events in logical order with details", "My feelings and a problem/turning point", "Ends with an outcome and a lesson", "First person, simple clear language, correct grammar"], "solution": "Title: A Small Act of Kindness\nOne rainy morning I saw a little boy standing at the bus stop without an umbrella. I felt shy, but I shared mine. He smiled, and we walked together. Later his mother thanked me. That smile stayed with me all day. I learnt that a small act of kindness can brighten someone's life.", "solution_lang": "text", "hints": ["Plan: opening, three events, lesson."], "id": "ch01-04-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore", "difficulty": "easy", "minutes": 8, "goal": "(1) Write your own five-line limerick with a twist in the last line (a limerick has five lines). (2) Visit the library, read a story and tell your class its theme. (3) List stories of wit, humour and wisdom you know on chart paper.", "checklist": ["My limerick has five lines", "The last line has a funny twist", "I named the theme of my story"], "solution": "A cat who loved cooking one day\nSet fire to the stove by the way.\nShe cried, 'Oh my whiskers!'\nAnd grabbed all the biscuits,\nAnd now it's the cat's bakery!", "solution_lang": "text", "hints": ["Rhyme lines 1, 2 and 5 together, and 3 and 4 together."], "id": "ch01-04-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Rising tone for yes/no questions, falling tone for wh-questions.", "In the story Rama beat arrogance with a funny but true explanation.", "A narrative essay has an introduction, body and conclusion with a lesson."]}], "id": "ch01-04-wit-skills", "chapter": "ch01", "kind": "lesson", "minutes": 50}, "ch01-05-concrete-warmup": {"title": "A Concrete Example: garden words and the poem", "summary": "Learn garden words, think about the title and listen to what the poem says.", "blocks": [{"type": "text", "md": "The poem is about a neighbour's very unusual garden. First learn the words, then hear what happens."}, {"type": "quiz", "title": "Name the garden item (before we read I)", "questions": [{"type": "fill", "q": "A hose that waters plants is a garden ______.", "answer": "hose", "explanation": "Garden hose.", "hints": ["Rubber tube."]}, {"type": "fill", "q": "A young small tree is a ______.", "answer": "sapling", "explanation": "Sapling.", "hints": ["Starts with s."]}, {"type": "fill", "q": "A row of bushes used as a wall is a ______.", "answer": "hedge", "explanation": "Hedge.", "hints": ["Bushes."]}, {"type": "fill", "q": "A bed of soil for flowers is a flower ______.", "answer": "bed", "explanation": "Flower bed (flower beds).", "hints": ["Place for flowers."]}, {"type": "fill", "q": "A pot to grow a plant in is a flower ______.", "answer": "pot", "explanation": "Flower pot.", "hints": ["Container."]}, {"type": "fill", "q": "Small smooth stones are ______.", "answer": "pebbles", "explanation": "Pebbles.", "hints": ["Small stones."]}, {"type": "fill", "q": "A garden of arranged rocks and plants is a ______.", "answer": "rockery", "explanation": "Rockery.", "hints": ["Rocks."]}, {"type": "fill", "q": "A wooden boundary around a garden is a ______.", "answer": "fence", "explanation": "Fence.", "hints": ["Boundary."]}, {"type": "fill", "q": "A climbing plant is a ______.", "answer": "vine", "explanation": "Vine.", "hints": ["Climbing."]}, {"type": "fill", "q": "A one-wheeled cart for soil is a ______.", "answer": "wheelbarrow", "explanation": "Wheelbarrow.", "hints": ["One wheel."]}], "id": "ch01-05-qu1"}, {"type": "exercise", "title": "Your dream garden", "difficulty": "easy", "minutes": 8, "goal": "In a group of four, describe the garden you would like to have, the features you would include and why.", "checklist": ["Named at least three features from the list", "Gave a reason for each"], "solution": "I would like a garden with flower beds, a vine on a fence and a small pond, because flowers give colour, the vine gives shade and the pond attracts birds.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-05-ex1", "mode": "selfcheck"}, {"type": "reveal", "prompt": "What does 'concrete' mean? Does it have more than one meaning?", "md": "Yes. Concrete is a hard building material made of cement and stones. It also means real and clear (a concrete example is a clear, real example). The poem plays on both meanings."}, {"type": "read", "title": "A Concrete Example: what the poem says", "label": "Read", "md": "The speaker's next-door neighbour, Mrs. Jones, has a garden full of stones. It has a crazy path, a lily pond, a rockery and a strange sundial that she thinks rather nice.\n\nShe puts tiny plants between the stones. They are so delicate that the speaker jokes she must plant them with a pin.\n\nOne day she invites him to see her stones. They talk about a lovely flower for a quarter of an hour. When he finally asks where it is, she replies that he is standing on it.", "note": "The poem is by Reginald Arkell. This is a summary in plain words, not the poem; read the poem on page 18 of your textbook."}, {"type": "quiz", "title": "Complete the summary with words from the poem (Let us discuss I)", "questions": [{"type": "fill", "q": "Mrs. Jones's garden is full of ______.", "answer": "stones", "explanation": "The poem begins with 'a garden full of stones'.", "hints": ["Hard things."]}, {"type": "fill", "q": "It has a peculiar crazy ______.", "answer": ["path", "crazy path"], "explanation": "'A crazy path'.", "hints": ["You walk on it."]}, {"type": "fill", "q": "... along with an unusual ______ that she finds charming.", "answer": "sundial", "explanation": "'A sundial with a strange device'.", "hints": ["Tells time with the sun."]}, {"type": "fill", "q": "She plants tiny, ______ plants.", "answer": ["delicate", "small"], "explanation": "'delicate and small'.", "hints": ["Easily broken."]}, {"type": "fill", "q": "... planted with a ______.", "answer": "pin", "explanation": "'unless she plants them with a pin'.", "hints": ["Sewing tool."]}, {"type": "fill", "q": "They discuss a ______ that Mrs. Jones treasures.", "answer": "flower", "explanation": "'talked about a flower'.", "hints": ["Grows in gardens."]}, {"type": "fill", "q": "The speaker asks where the ______ flower is.", "answer": "lovely", "explanation": "'Where is this lovely thing?'", "hints": ["Beautiful."]}, {"type": "fill", "q": "Mrs. Jones says he has been ______ on it all along.", "answer": "standing", "explanation": "'You're standing on it'.", "hints": ["On his feet."]}], "id": "ch01-05-qu2"}, {"type": "summary", "points": ["Garden words: hose, sapling, hedge, rockery, fence, vine, wheelbarrow, pebbles.", "'Concrete' means both the hard material and 'real and clear'.", "The poem's joke: the 'flower' is under the speaker's feet."]}], "terms": [{"term": "rockery", "def": "a garden of rocks with plants"}, {"term": "concrete", "def": "(1) hard building material (2) real and clear"}], "id": "ch01-05-concrete-warmup", "chapter": "ch01", "kind": "lesson", "minutes": 25}, "ch01-06-concrete-poem": {"title": "A Concrete Example: understanding the poem", "summary": "Tone, speaker, rhyme, devices, irony and puns.", "blocks": [{"type": "text", "md": "**In this lesson:** Tone, speaker, rhyme, devices, irony and puns."}, {"type": "quiz", "title": "Tone, speaker and rhyme (Let us discuss II-III)", "questions": [{"type": "single", "q": "The tone of the poem is ______.", "options": ["mocking, humorous, mournful", "mocking, humorous, light-hearted", "humorous, mournful, amusing", "humorous, amusing, light-hearted"], "answer": 3, "explanation": "The poem is gently funny, not sad or cruel.", "hints": ["Is anything sad here?"]}, {"type": "single", "q": "The speaker in the poem is ______.", "options": ["Mrs. Jones", "the poet", "a gardener", "a child"], "answer": 1, "explanation": "The 'I' who talks about 'my next-door neighbour' is the poet.", "hints": ["Who says 'my neighbour'?"]}, {"type": "single", "q": "The rhyme scheme is ______.", "options": ["AABBCC", "ABABCC", "AABCAC", "ABBACC"], "answer": 0, "explanation": "In each stanza lines rhyme in pairs: Jones/stones, pond/beyond, device/nice.", "hints": ["Check lines 1 and 2."]}, {"type": "single", "q": "The poet repeats 'stones' in all stanzas to emphasise Mrs. Jones's ______.", "options": ["obsession with a stony garden", "pride in gardening skills"], "answer": 0, "explanation": "The repeated word shows how stones fill her mind.", "hints": ["What is she fixed on?"]}, {"type": "single", "q": "The imagery helps readers ______.", "options": ["understand Mrs. Jones's love for plants", "visualise the garden's peculiar nature"], "answer": 1, "explanation": "Words like crazy path and strange sundial paint a picture.", "hints": ["Imagery = pictures in words."]}], "id": "ch01-06-qu1"}, {"type": "exercise", "title": "Alliteration, refrain and irony", "difficulty": "medium", "minutes": 10, "goal": "(IV) Find alliteration (repeated starting sounds) in the poem. (V) A refrain repeats in every stanza: what is it? (VI) Which part shows situational irony?", "checklist": ["Found an alliteration example (e.g. 'quite a quarter')", "Identified the refrain: the first line about Mrs. Jones", "Explained the irony: she was excited about a 'flower' that was only stones"], "solution": "IV) 'puts little plants' (p, l sounds), 'quite a quarter' (q sound).\nV) The refrain is the line 'My next-door neighbour, Mrs. Jones,'.\nVI) The last two lines: the speaker looks for a lovely flower and is told he is standing on it. He expected a flower; the real 'flower' is a tiny plant between stones.", "solution_lang": "text", "hints": ["Say the line aloud to hear repeated sounds."], "id": "ch01-06-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Concrete and puns (VII-VIII)", "questions": [{"type": "fill", "q": "'Concrete' can refer to the ______ in Mrs. Jones's garden. (one word: what the garden is made of)", "answer": ["stones", "stone"], "explanation": "The garden is hard and stony.", "hints": ["Hard material."]}, {"type": "single", "q": "The title is also symbolic because the poem gives a clear example of Mrs. Jones's ______ gardening habits.", "options": ["unusual", "expensive", "careless", "modern"], "answer": 0, "explanation": "It is a clear, real example of her odd habits.", "hints": ["Think 'strange'."]}, {"type": "single", "q": "Which sentence uses a pun?", "options": ["I tried arguing with my pencil but it kept making sharp points.", "The pencil was on the table.", "My pencil is red.", "I like writing."], "answer": 0, "explanation": "'Sharp points' means both a sharp pencil tip and strong arguments.", "hints": ["A word with two meanings."]}], "id": "ch01-06-qu2"}, {"type": "exercise", "title": "Write your own pun", "difficulty": "easy", "minutes": 8, "goal": "A pun plays on a word with two meanings. Write one pun using 'pen', 'bat', 'ruler' or 'point'.", "checklist": ["Uses a word with two meanings", "Both meanings make sense in the sentence"], "solution": "My cricket bat is nervous because it is always facing the ball. (bat = cricket bat / bat the animal also possible)\nOr: The ruler of the classroom was a ruler - because he decided all the lines.", "solution_lang": "text", "hints": ["Pick a word with 2 meanings, then write a funny sentence."], "id": "ch01-06-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Think and reflect: the first stanza", "questions": [{"type": "single", "q": "What can we infer about Mrs. Jones's taste from a garden 'full of stones'?", "options": ["She likes unusual, rocky and unconventional gardens.", "She hates gardens.", "She is very rich.", "She wants a normal lawn."], "answer": 0, "explanation": "A garden of stones, a crazy path and a strange sundial show an unconventional taste.", "hints": ["Is it an ordinary garden?"]}, {"type": "truefalse", "q": "True or false: The garden serves as a means to reveal more about Mrs. Jones herself.", "answer": true, "explanation": "Her garden shows her personality: proud, quirky and devoted.", "hints": ["Is a garden only a place?"]}, {"type": "single", "q": "What does the sundial with a 'strange device' suggest about her personality?", "options": ["She has a fascination with unusual items.", "She prefers traditional garden decorations.", "She is uninterested in her garden's appearance.", "She likes modern and expensive items."], "answer": 0, "explanation": "'Strange device' = unusual item; she finds it nice.", "hints": ["Strange = unusual."]}], "id": "ch01-06-qu3"}, {"type": "exercise", "title": "Crazy path", "difficulty": "easy", "minutes": 8, "goal": "What does the poet mean by 'crazy path'?", "checklist": ["Explains it is irregular/uneven", "Links it to the stones"], "solution": "A crazy path is a path of irregular, uneven stones that does not run in a straight line. It looks odd but charming.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-06-ex3", "mode": "selfcheck"}, {"type": "exercise", "title": "Long questions 1-5", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) How does Mrs. Jones feel about her garden? (2) Why are the plants 'planted with a pin'? (3) What do we learn about Mrs. Jones? (4) How is she portrayed in a positive light? (5) What does the poem say about how people see the world differently?", "checklist": ["Used evidence from the poem", "Noted the speaker's humour", "Wrote 2-3 sentences for each"], "solution": "1) She is proud and delighted; she thinks the sundial 'rather nice' and spends a quarter of an hour praising a flower.\n2) It is an exaggeration to show the plants are tiny.\n3) She is imaginative, passionate and unconventional.\n4) She loves her garden, welcomes the speaker kindly and is devoted to her hobby.\n5) Mrs. Jones sees beauty in tiny plants among stones, while the speaker sees only stones, so people see the same world differently.", "solution_lang": "text", "hints": ["Mention the speaker's surprise at the end."], "id": "ch01-06-ex4", "mode": "selfcheck"}, {"type": "summary", "points": ["The poem is humorous, light-hearted and rhymes AABBCC.", "Alliteration, refrain, imagery, irony and a pun on the title are the key devices.", "The speaker (the poet) and Mrs. Jones see the garden differently."]}], "id": "ch01-06-concrete-poem", "chapter": "ch01", "kind": "lesson", "minutes": 50}, "ch01-07-concrete-language": {"title": "A Concrete Example: word study", "summary": "Synonyms, instruments, word-building and the Rock Garden listening.", "blocks": [{"type": "text", "md": "**In this lesson:** Synonyms, instruments, word-building and the Rock Garden listening."}, {"type": "quiz", "title": "Replace the underlined word (Let us learn I)", "questions": [{"type": "multi", "q": "'A sundial with a strange device': which words can replace 'strange'?", "options": ["unusual", "peculiar", "new", "rare", "external"], "answer": [0, 1], "explanation": "Strange = unusual, peculiar.", "hints": ["Odd."]}, {"type": "multi", "q": "'... which Mrs. Jones thinks rather nice': replace 'nice'.", "options": ["pleasant", "superior", "agreeable", "gentle", "charming"], "answer": [0, 2], "explanation": "Nice = pleasant/agreeable here.", "hints": ["Pleasing."]}, {"type": "multi", "q": "'They are so delicate...': replace 'delicate'.", "options": ["delicious", "fragile", "dainty", "graceful", "weak"], "answer": [1, 2], "explanation": "Delicate = fragile, dainty.", "hints": ["Easily broken."]}, {"type": "single", "q": "'Where is this lovely thing?' I cried. Replace 'cried'.", "options": ["exclaimed", "wept", "shouted", "whispered"], "answer": 0, "explanation": "Cried = called out (exclaimed). 'Wept' means shed tears.", "hints": ["He is surprised, not sad."]}], "id": "ch01-07-qu1"}, {"type": "quiz", "title": "Instruments (II)", "questions": [{"type": "single", "q": "implement", "options": ["something used by hand: spade, knife (works by being moved by hand)", "an electrical item for the house", "a small electronic item", "a set of necessary items"], "answer": 0, "explanation": "Implements are hand-worked: spade, knife.", "hints": ["Think of the examples."]}, {"type": "single", "q": "tool", "options": ["something used by hand to make or repair", "an electrical item", "a set of items", "a small mechanical item"], "answer": 0, "explanation": "A hammer is a tool.", "hints": ["Hammer."]}, {"type": "single", "q": "equipment", "options": ["a set of necessary items for a purpose", "something used by hand to make", "an electrical house item", "a small gadget"], "answer": 0, "explanation": "A cricket kit is equipment.", "hints": ["Cricket bat + helmet."]}, {"type": "single", "q": "appliance", "options": ["something electrical used to do work in the house", "a hand tool", "a set of items", "a gadget"], "answer": 0, "explanation": "Mixer grinder.", "hints": ["Kitchen."]}, {"type": "single", "q": "gadget", "options": ["something small, mechanical or electronic", "a hand tool", "a set of items", "a house appliance"], "answer": 0, "explanation": "Mobile phone, laptop.", "hints": ["Small electronics."]}], "id": "ch01-07-qu2"}, {"type": "quiz", "title": "Change the first letter (III)", "questions": [{"type": "fill", "q": "nice -> ______ (cut into small pieces)", "answer": "dice", "explanation": "Given example.", "hints": ["To dice vegetables."]}, {"type": "fill", "q": "nice -> ______ (grain we cook)", "answer": "rice", "explanation": "rice.", "hints": ["Staple grain."]}, {"type": "fill", "q": "nice -> ______ (plural of mouse)", "answer": "mice", "explanation": "mice.", "hints": ["Plural."]}, {"type": "fill", "q": "nice -> ______ (bad habit)", "answer": "vi
