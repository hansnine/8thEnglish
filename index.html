by Erwin Schrödinger.", "The International Astronomical Union renamed a star 'Bibha'.", "The Government of India declared a chair professorship in her name."], "explanation": "Born 1913 -> Manchester 1945 -> TIFR 1949 -> nomination 1950 -> star 2019 -> chair 2020.", "hints": ["Use the dates."]}], "id": "ch05-08-qu1"}, {"type": "quiz", "title": "Extract 1: Manchester", "questions": [{"type": "single", "q": "What can be inferred from the title 'India's New Woman Scientist'?", "options": ["The world was still doubtful about women scientists' capabilities.", "Women scientists were widely celebrated.", "Women were as common as men in science.", "Women were not allowed to study science."], "answer": 0, "explanation": "A woman scientist was newsworthy and unusual.", "hints": ["A 'new' kind of scientist."]}, {"type": "single", "q": "'Celebrated' in 'celebrated Nobel Laureate' refers to all EXCEPT someone who is ______.", "options": ["famous and highly respected", "frequently seen in public", "renowned for achievements", "well-regarded in the field"], "answer": 1, "explanation": "Being seen in public is not part of the meaning.", "hints": ["Find the odd one."]}, {"type": "fill", "q": "'She has an eye for Cosmic Rays' suggests that she was very ______ at studying them. (one word)", "answer": ["good", "skilled", "talented", "observant", "gifted"], "explanation": "It means she had a special talent for it.", "hints": ["An 'eye for' = a talent for."]}], "id": "ch05-08-qu2"}, {"type": "quiz", "title": "Extract 2: the legacy", "questions": [{"type": "single", "q": "Challenges of women scientists today compared with her era:", "options": ["Women no longer face any barriers.", "The challenges remain, but progress has been made.", "The struggles are harder.", "The struggles are the same."], "answer": 1, "explanation": "'How far we've come - and how much further we have to go.'", "hints": ["Both parts of that sentence."]}, {"type": "single", "q": "'Bibha Chowdhuri was the beacon, the beam of light whose story continues to inspire young women.' This is ______.", "options": ["a fact", "an opinion"], "answer": 1, "explanation": "'Beacon' and 'inspire' show a judgement, not a measurable fact.", "hints": ["Can it be proved?"]}], "id": "ch05-08-qu3"}, {"type": "exercise", "title": "Long questions 1-7", "difficulty": "medium", "minutes": 20, "goal": "Answer: (1) Why is she a pioneer? (2) What does Schrödinger's nomination show? (3) Support: she never worked for awards. (4) How is the star's name literal and symbolic recognition? (5) How do women in ISRO reflect changing attitudes? (6) What is the writer's purpose? (7) How could this text change perceptions of women in other male-dominated fields?", "checklist": ["Evidence from the text", "Reasons"], "solution": "1) She was India's first woman physicist and the first Indian woman to excel in high-energy particle physics.\n2) A Nobel laureate-level physicist thought her work worth the prize, so her abilities were exceptional.\n3) She received no award in her lifetime yet continued her research tirelessly.\n4) Literally a real star carries her name; symbolically 'Bibha' means beam of light, as she lit the path for others.\n5) Women now lead missions instead of just participating, showing more acceptance.\n6) To honour a forgotten pioneer and inspire young women.\n7) It shows that talent can break barriers, encouraging acceptance in other fields.", "solution_lang": "text", "hints": ["Quote short phrases."], "id": "ch05-08-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Bibha Chowdhuri discovered pi-mesons and was nominated for the Nobel Prize.", "She was largely forgotten until the star and chair honoured her.", "Today's women scientists build on her pioneering work."]}], "terms": [{"term": "physicist", "def": "a scientist who studies matter, energy and light"}, {"term": "pioneer", "def": "one of the first to do something"}], "id": "ch05-08-bibha-story", "chapter": "ch05", "kind": "lesson", "minutes": 35}, "ch05-09-bibha-language": {"title": "Bibha Chowdhuri: language practice", "summary": "Antonyms, suffixes, acronyms, clipping and passive voice.", "blocks": [{"type": "text", "md": "**In this lesson:** Antonyms, suffixes, acronyms, clipping and passive voice."}, {"type": "quiz", "title": "Antonyms (crossword words)", "questions": [{"type": "fill", "q": "Antonym of 'core' (from the text)", "answer": "periphery", "explanation": "core vs periphery (boundary).", "hints": ["Edge."]}, {"type": "fill", "q": "Antonym of 'dependent'", "answer": "autonomous", "explanation": "autonomous = independent.", "hints": ["Independent."]}, {"type": "fill", "q": "Antonym of 'extinguish'", "answer": "ignite", "explanation": "ignite = arouse/set alight.", "hints": ["Light."]}, {"type": "fill", "q": "Antonym of 'terrestrial' (of the Earth)", "answer": ["celestial", "extraterrestrial"], "explanation": "celestial = of the sky.", "hints": ["Space."]}, {"type": "fill", "q": "Antonym of 'effortless'", "answer": "arduous", "explanation": "arduous = needing great effort.", "hints": ["Difficult."]}, {"type": "fill", "q": "Antonym of 'trivial'", "answer": ["notable", "important", "significant"], "explanation": "notable = remarkable.", "hints": ["Not unimportant."]}], "id": "ch05-09-qu1"}, {"type": "quiz", "title": "Replace the underlined phrase (II)", "questions": [{"type": "fill", "q": "the first people to start the online markets", "answer": "pioneers", "explanation": "pioneers.", "hints": ["First."]}, {"type": "fill", "q": "a scientist who studies matter, energy, light", "answer": "physicist", "explanation": "physicist.", "hints": ["Science."]}, {"type": "fill", "q": "friends who are classmates and my age", "answer": "peers", "explanation": "peers.", "hints": ["Equals."]}, {"type": "fill", "q": "the famous and important people", "answer": "luminaries", "explanation": "luminaries.", "hints": ["Shining."]}, {"type": "fill", "q": "continuous efforts and determination", "answer": "persistence", "explanation": "persistence.", "hints": ["Keep going."]}, {"type": "fill", "q": "things that block our way", "answer": "barriers", "explanation": "barriers.", "hints": ["Block."]}], "id": "ch05-09-qu2"}, {"type": "quiz", "title": "Suffixes -ship, -ment, -hood (III)", "questions": [{"type": "fill", "q": "member + ______", "answer": "membership", "explanation": "membership.", "hints": ["-ship."]}, {"type": "fill", "q": "govern + ______", "answer": "government", "explanation": "government.", "hints": ["-ment."]}, {"type": "fill", "q": "partner + ______", "answer": "partnership", "explanation": "partnership.", "hints": ["-ship."]}, {"type": "fill", "q": "child + ______", "answer": "childhood", "explanation": "childhood.", "hints": ["-hood."]}, {"type": "fill", "q": "citizen + ______", "answer": "citizenship", "explanation": "citizenship.", "hints": ["-ship."]}, {"type": "fill", "q": "entertain + ______", "answer": "entertainment", "explanation": "entertainment.", "hints": ["-ment."]}, {"type": "fill", "q": "brother + ______", "answer": "brotherhood", "explanation": "brotherhood.", "hints": ["-hood."]}, {"type": "fill", "q": "agree + ______", "answer": "agreement", "explanation": "agreement.", "hints": ["-ment."]}], "id": "ch05-09-qu3"}, {"type": "quiz", "title": "Acronyms (IV)", "questions": [{"type": "fill", "q": "National Aeronautics and Space Administration", "answer": "NASA", "explanation": "NASA.", "hints": ["Space."]}, {"type": "fill", "q": "All India Institute of Medical Sciences", "answer": "AIIMS", "explanation": "AIIMS.", "hints": ["Hospital."]}, {"type": "fill", "q": "Ayurveda, Yoga and Naturopathy, Unani, Siddha and Homoeopathy", "answer": "AYUSH", "explanation": "AYUSH.", "hints": ["Ministry."]}, {"type": "fill", "q": "National Institute of Pharmaceutical Education and Research", "answer": "NIPER", "explanation": "NIPER.", "hints": ["Pharma."]}, {"type": "fill", "q": "World Health Organization", "answer": "WHO", "explanation": "WHO.", "hints": ["Health."]}, {"type": "single", "q": "'photo' from 'photograph' is which kind of clipping?", "options": ["Back clipping", "Front clipping", "Middle clipping"], "answer": 0, "explanation": "The end is removed.", "hints": ["End cut."]}, {"type": "single", "q": "'phone' from 'telephone' is ______.", "options": ["Back clipping", "Front clipping", "Middle clipping"], "answer": 1, "explanation": "The front is removed.", "hints": ["Front cut."]}, {"type": "single", "q": "'flu' from 'influenza' is ______.", "options": ["Back clipping", "Front clipping", "Middle clipping"], "answer": 2, "explanation": "Front and end removed.", "hints": ["Middle stays."]}], "id": "ch05-09-qu4"}, {"type": "quiz", "title": "Passive voice (V)", "questions": [{"type": "fill", "q": "Significant advancements ______ (record) in leading journals when a new vaccine ...", "answer": "were recorded", "explanation": "plural subject: were + past participle.", "hints": ["Plural."]}, {"type": "fill", "q": "... a new vaccine for malaria ______ (discover).", "answer": "was discovered", "explanation": "singular: was.", "hints": ["Singular."]}, {"type": "fill", "q": "The vaccine ______ (test) through several trials.", "answer": "was tested", "explanation": "was tested.", "hints": ["Singular."]}, {"type": "fill", "q": "... results ______ (publish) in those journals.", "answer": "were published", "explanation": "were published.", "hints": ["Plural."]}, {"type": "fill", "q": "... blood samples ______ (take) regularly.", "answer": "were taken", "explanation": "were taken.", "hints": ["Plural."]}, {"type": "fill", "q": "The amount of antibodies ______ (measure) carefully.", "answer": "was measured", "explanation": "was measured.", "hints": ["Singular amount."]}], "id": "ch05-09-qu5"}, {"type": "exercise", "title": "Rewrite in passive voice (VI)", "difficulty": "medium", "minutes": 10, "goal": "Rewrite the plant-growth experiment report using the passive voice: 'I conducted an experiment... I placed various plants under different light... I measured their growth... I recorded data daily... I analysed the results...' Begin: 'An experiment was conducted...'", "checklist": ["Uses was/were + past participle", "Omits 'I' where the doer is obvious"], "solution": "An experiment was conducted to investigate the effects of light on plant growth. Various plants were placed under different light conditions and their growth was measured over several weeks. Data was recorded daily to track the height of each plant. At the end the results were analysed and it was found that plants exposed to natural light grew significantly taller. It was concluded that sunlight plays a crucial role. The findings were presented to the class.", "solution_lang": "text", "hints": ["The action matters more than the doer."], "id": "ch05-09-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Chandrayaan landing in passive (VII)", "questions": [{"type": "single", "q": "'First, the spacecraft ______ towards the Moon.'", "options": ["launched", "were launched", "was launched", "is launched"], "answer": 3, "explanation": "Instructions are given in present tense: is launched.", "hints": ["Present."]}, {"type": "single", "q": "'Then it ______ to enter the Moon's orbit.'", "options": ["position", "was positioned", "is positioned", "has positioned"], "answer": 2, "explanation": "is positioned.", "hints": ["Present."]}, {"type": "single", "q": "'The spacecraft's path ______ for landing.'", "options": ["adjusted", "was adjusted", "is adjusted", "were adjusted"], "answer": 2, "explanation": "is adjusted.", "hints": ["Singular, present."]}, {"type": "single", "q": "'The spacecraft ______ as it nears the surface.'", "options": ["slowed down", "was slowed down", "is slowed down", "were slowed down"], "answer": 2, "explanation": "is slowed down.", "hints": ["Present."]}, {"type": "single", "q": "'Finally, the rover ______ to explore.'", "options": ["is released", "has released", "were released", "was released"], "answer": 0, "explanation": "is released.", "hints": ["Present."]}], "id": "ch05-09-qu6"}, {"type": "summary", "points": ["Add -ship, -ment or -hood to make nouns.", "Use passive voice when the action matters more than the doer.", "Acronyms are pronounced as words; clipping shortens words."]}], "id": "ch05-09-bibha-language", "chapter": "ch05", "kind": "lesson", "minutes": 40}, "ch05-10-bibha-skills": {"title": "Bibha Chowdhuri: listen, speak, write, explore", "summary": "Listen to a podcast on AI, hold a panel discussion, write a report and explore.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to a podcast on AI, hold a panel discussion, write a report and explore."}, {"type": "read", "title": "Let us listen: AI for humankind (podcast)", "label": "Listen", "md": "Welcome to Tech Talks. Today we look at how artificial intelligence benefits humankind in four segments.\n\nSegment one is healthcare. AI analyses medical data faster and more accurately than humans, which leads to quicker diagnoses and personalised treatment. AI-powered robots help in surgeries, and during the global pandemic AI sped up the discovery of new medicines.\n\nSegment two is the environment. AI helps predict natural disasters and manage water and agriculture. In renewable energy, AI improves the performance of wind turbines and solar panels.\n\nSegment three is education. AI offers personalised learning, and helps teachers analyse student performance and handle administrative tasks.\n\nSegment four is accessibility. Speech recognition, text-to-speech and voice commands make communication easier for people with disabilities. AI is a powerful force for good, but we must use it responsibly.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen and choose", "questions": [{"type": "single", "q": "A key benefit of AI in healthcare:", "options": ["Helps doctors talk faster", "Personalised treatments and faster diagnoses", "Cosmetic surgery", "Billing"] ch05-10-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a report: Zonal Science Exhibition", "difficulty": "medium", "minutes": 20, "goal": "As student editor, write a report for the school magazine in past tense, passive voice and third person with a headline, reporter's name and three paragraphs.", "checklist": ["Headline and reporter's name", "Organiser, host, date, time, place", "Chief Guest and competitions", "Best exhibit winner and observations", "Passive voice, past tense"], "solution": "ZONAL SCIENCE EXHIBITION HELD AT OUR SCHOOL\nBy Student Editor\nThe Zonal Science Exhibition was organised by the District Education Office and was hosted by our school on 12 August from 9 a.m. in the school hall. Teams from 25 schools were welcomed by the Principal. The exhibition was inaugurated by the Chief Guest, a scientist from ISRO. A Science Quiz and a Science Models competition were held. Models on solar energy and water purification were displayed. The trophy for the best exhibit was won by Team Spark. The Chief Guest praised the creativity of the students.", "solution_lang": "text", "hints": ["Use 'was held', 'were displayed'."], "id": "ch05-10-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Explore: AR and VR; Rashtriya Vigyan Puraskar", "questions": [{"type": "single", "q": "Which one replaces the real world with a simulated one?", "options": ["Virtual reality", "Augmented reality"], "answer": 0, "explanation": "VR is fully immersive.", "hints": ["Immersive."]}, {"type": "single", "q": "Which award recognises lifetime achievements?", "options": ["Vigyan Ratna", "Vigyan Shri", "Vigyan Yuva-SSB", "Vigyan Team"], "answer": 0, "explanation": "Ratna = jewel/lifetime.", "hints": ["Lifetime."]}, {"type": "single", "q": "Which award is for scientists up to the age of 45?", "options": ["Vigyan Yuva-Shanti Swarup Bhatnagar", "Vigyan Ratna", "Vigyan Shri", "Vigyan Team"], "answer": 0, "explanation": "Yuva = young.", "hints": ["Young."]}, {"type": "s   const hash = location.hash.replace(/^#\/?/, "") || "home"; const [kind, ...rest] = hash.split("/"); const arg = rest.join("/");

  if (kind === "lesson" && C.lessons[arg]) { currentRoute = arg; renderLesson(arg); }
  else if (kind === "glossary") { currentRoute = "glossary"; renderGlossary(); }
  else { currentRoute = "home"; renderHome(); }

}
function initChrome() {

  $("#brand").textContent = C.meta.title + (C.meta.author ? " · by " + C.meta.author : "");

  if (!theme) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  $("#themeBtn").onclick = () => { const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("course-theme", n); } catch (e) { /* ignore */ } };
  $("#menuBtn").onclick = () => document.body.classList.toggle("nav-open"); $("#scrim").onclick = () => document.body.classList.remove("nav-open");
}
(async function boot() {
  initChrome(); await loadProgress(); setSaveState();
  window.addEventListener("hashchange", route); route();
  window.__course = { get progress() { return P; }, route, save, tex2mml };
})();
})();

</script>
