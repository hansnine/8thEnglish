ation": "Plough, puddle, irrigate, transplant, harvest, thresh, mill.", "hints": ["Land first."]}, {"type": "single", "q": "The main step in preparing the soil for rice is ______.", "options": ["puddling the soil", "ploughing", "clearing"], "answer": 0, "explanation": "Soak it with water.", "hints": ["Water."]}, {"type": "single", "q": "Rice seeds grow into seedlings in ______.", "options": ["4-5 weeks", "2-3 weeks", "6-7 weeks"], "answer": 0, "explanation": "Four to five weeks.", "hints": ["Nursery."]}, {"type": "single", "q": "Drying rice grains after threshing is important ______.", "options": ["to store the rice grains for longer", "to get seeds", "to separate easily"], "answer": 0, "explanation": "Reduces moisture so they can be stored.", "hints": ["Storage."]}], "id": "ch04-07-qu4"}, {"type": "summary", "points": ["Rake, trowel, sickle, plough, spade and scythe are farm tools.", "Archaic words: morrow, hither, quoth, betwixt, yonder.", "Rice is puddled, transplanted, harvested, threshed and milled."]}], "id": "ch04-07-hymn-language", "chapter": "ch04", "kind": "lesson", "minutes": 15}, "ch04-08-hymn-skills": {"title": "Harvest Hymn: speak, write, explore", "summary": "Silent letters, a presentation on a harvest dish, a slogan and millets.", "blocks": [{"type": "text", "md": "**In this lesson:** Silent letters, a presentation on a harvest dish, a slogan and millets."}, {"type": "quiz", "title": "Silent n and silent b", "questions": [{"type": "single", "q": "In 'hymn', 'column', 'autumn', 'solemn' the silent letter is ______.", "options": ["n", "m", "l", "t"], "answer": 0, "explanation": "Silent n after m.", "hints": ["At the end."]}, {"type": "single", "q": "In 'womb', 'tomb', 'bomb', 'climb', 'comb' the silent letter is ______.", "options": ["b", "m", "o", "c"], "answer": 0, "explanation": "Silent b after m.", "hints": ["At the end."]}], "id": "ch04-08-qu1"}, {"type": "exercise", "title": "Presentation on a harvest dish", "difficulty": "easy", "minutes": 8, "goal": "In groups, present a popular harvest-festival dish from your region: name (and other names), ingredients, preparation, serving, taste, special ritual, a memory. Use phrases: 'Good morning to all of you gathered here...', 'We will start off with...', 'In conclusion, I'd like to say...', 'Thank you for your attention.'", "checklist": ["Greeting and introduction", "Structure announced", "All points covered", "Conclusion and thanks"], "solution": "Today we are here to tell you about Pongal, a sweet rice dish made at the harvest festival of Tamil Nadu. We will start off with the ingredients: new rice, moong dal, jaggery, ghee and cardamom. It is cooked in a new pot until it boils over. Thank you for your attention.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-08-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a slogan", "difficulty": "easy", "minutes": 8, "goal": "Draft a creative slogan for the school notice board to thank farmers. Keep it short, simple and focused on the main idea.", "checklist": ["Few words", "Simple language", "Clear message"], "solution": "Thank the farmer: every grain on our plate begins with their care.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-08-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore: millets", "difficulty": "easy", "minutes": 8, "goal": "Read about pearl millet (bajra): sixth major cereal, highest drought tolerance, rich in protein and fibre. In groups find out if millets are in your cuisine, compile recipes into a booklet and create a recipe. Also learn a harvest song from an elder and make a songbook.", "checklist": ["Named a millet recipe", "Shared a song"], "solution": "Bajra roti with butter and jaggery; ragi dosa; jowar upma. Songs like the Pongal and Bihu songs form part of our heritage.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-08-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Silent n: hymn, column. Silent b: tomb, climb.", "A presentation has an introduction, points and a conclusion.", "Millets are nutritious and drought-tolerant."]}], "id": "ch04-08-hymn-skills", "chapter": "ch04", "kind": "lesson", "minutes": 25}, "ch04-09-rain-story": {"title": "Waiting for the Rain: warm-up and the story", "summary": "Talk about waiting and hear the story of Velu, the old woman and the rain.", "blocks": [{"type": "text", "md": "**In this lesson:** Talk about waiting and hear the story of Velu, the old woman and the rain."}, {"type": "exercise", "title": "Before we read", "difficulty": "easy", "minutes": 8, "goal": "(1) Have you waited for the rains? Why? (2) How do you feel when it rains after a long time? (3) Why do farmers wait for rain? (4) In groups: how do you spend a long wait, what do you think about and how do you feel?", "checklist": ["Answered all", "Gave reasons"], "solution": "I wait for rain when it is very hot. I feel happy and relieved. Farmers need rain to sow and irrigate. While waiting I read or think and sometimes feel impatient.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-09-ex1", "mode": "selfcheck"}, {"type": "read", "title": "Waiting for the Rain (short retelling)", "label": "Read", "md": "Velu, a farmer, wakes hoping it will rain but the crimson sunrise shows not a cloud. He has farmed his own land for six years, jowar one season and dhal the next, never taking rest. This year the rains did not come after summer. The fields lay untended, hard, crusted and cracked.\n\nSomeone said they should consult astrologers, but Velu said the rains had come every year without that. He went to the weather office in the city, but they said they were at a loss: so many favourable conditions but no rain. Tired and dejected, Velu rested under a large tree where an old woman sat.\n\nShe smiled at him, and he asked why she smiled when without rain there was nothing to smile about. He complained that he had worked hard and honestly and wondered why he was punished. The old woman said perhaps he had worked too hard. He did not understand how anyone could work too hard. She said he had strength to work without a break, but the earth had also worked for thousands of years. Shouldn't someone let the land rest? Nature is a mother to all and gives her children the rest they need. When rains don't come the land is left undisturbed and when the rain comes it springs back fresh for the crop.\n\nVelu began to understand. As he walked home he thought the land might be breathing peacefully. He felt a cool breeze and a drop on his shoulder. The clouds were gathering. Soon there would be lightning, thunder and sweet fragrant rain. Velu ran home laughing and happy.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Who said what?", "questions": [{"type": "single", "q": "'It doesn't look encouraging.' Who said it, to whom?", "options": ["Velu, to himself, as he looked at the sky", "The old woman, to Velu", "The weather officer, to Velu", "A neighbour, to Velu"], "answer": 0, "explanation": "Given example.", "hints": ["No cloud."]}, {"type": "single", "q": "'The rains came all these years without any such consultations...' Who said it?", "options": ["Velu, to his neighbours, rejecting the idea of astrologers", "The old woman", "A neighbour", "The weather officer"], "answer": 0, "explanation": "He did not believe astrologers could bring rain.", "hints": ["He disagreed."]}, {"type": "single", "q": "'So many favourable conditions but still no rain. Very odd!' Who said it?", "options": ["The people at the weather office, to Velu", "Velu", "The old woman", "A neighbour"], "answer": 0, "explanation": "They were at a loss.", "hints": ["City office."]}], "id": "ch04-09-qu1"}, {"type": "quiz", "title": "Complete with the reason", "questions": [{"type": "single", "q": "Velu asked the old woman to stop smiling because ______.", "options": ["without the rains there was nothing to smile about", "she was laughing at him", "he was angry with her", "he was thirsty"], "answer": 0, "explanation": "He felt miserable.", "hints": ["Smile."]}, {"type": "single", "q": "He said it was hard not to work because ______.", "options": ["he was a hard-working farmer who never took rest", "he disliked rest", "he was ill", "he was lazy"], "answer": 0, "explanation": "Six years of continuous work.", "hints": ["Never rested."]}, {"type": "single", "q": "Velu was confused when she said the land needed rest because ______.", "options": ["he had never thought of the land as needing rest", "he disagreed strongly", "he was angry", "he did not hear her"], "answer": 0, "explanation": "He asked 'Let the land rest?'", "hints": ["New idea."]}, {"type": "single", "q": "The old woman said no rain was good for the land because ______.", "options": ["the land was left undisturbed to rest and would spring back fresh", "the sun was good", "it saved water", "it killed weeds"], "answer": 0, "explanation": "Like rest for a person.", "hints": ["Rest."]}, {"type": "single", "q": "Velu ran home laughing because ______.", "options": ["the clouds were gathering and rain was about to come", "he had a plan", "his work was done", "he found gold"], "answer": 0, "explanation": "A cool breeze and a drop.", "hints": ["Rain."]}], "id": "ch04-09-qu2"}, {"type": "exercise", "title": "Will the rain come?", "difficulty": "easy", "minutes": 8, "goal": "(1) Do you think the old woman would help Velu? Why? (2) Will Velu's wait continue or will it rain?", "checklist": ["Gave an opinion", "Gave a reason"], "solution": "Yes, she helps him by changing his view. After her talk the rain begins, so the wait ends soon.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-09-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Velu worries about the drought but learns from an old woman.", "The land needs rest like people do.", "The rain arrives as Velu starts to understand."]}], "terms": [{"term": "fallow", "def": "land left unsown to rest"}, {"term": "dejected", "def": "sad and disappointed"}], "id": "ch04-09-rain-story", "chapter": "ch04", "kind": "lesson", "minutes": 25}, "ch04-10-rain-reflect": {"title": "Waiting for the Rain: think and reflect", "summary": "Extract and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Extract and long questions."}, {"type": "quiz", "title": "Extract 1: astrologers and the weather office", "questions": [{"type": "single", "q": "Velu is determined to seek information because ______.", "options": ["he wants to find a practical solution to the drought affecting his farm", "he was at a loss of words"], "answer": 0, "explanation": "He acts, he does not just wait.", "hints": ["Practical."]}, {"type": "single", "q": "What did Velu expect at the weather office, and what happened?", "options": ["He expected to be told when it would rain; they said they could not tell and were at a loss.", "He expected a gift; he got one.", "He expected a loan; he got one.", "He expected an astrologer; he met one."], "answer": 0, "explanation": "Expectation vs outcome.", "hints": ["They didn't know."]}, {"type": "single", "q": "The absence of rain despite favourable conditions shows ______.", "options": ["unpredictability of nature", "lack of astrological knowledge", "ineffectiveness of farmers", "delay in understanding weather"], "answer": 0, "explanation": "Nature is unpredictable.", "hints": ["Very odd."]}], "id": "ch04-10-qu1"}, {"type": "reveal", "prompt": "What does the first line tell us about Velu's beliefs?", "md": "He does not believe astrology can bring rain; he trusts practical reasons."}, {"type": "quiz", "title": "Extract 2: the old woman", "questions": [{"type": "single", "q": "The old woman's advice ______ Velu at that moment.", "options": ["confused", "failed to impress", "scared", "made sense to"], "answer": 0, "explanation": "He said 'I don't understand'.", "hints": ["He was puzzled."]}], "id": "ch04-10-qu2"}, {"type": "reveal", "prompt": "What does her soft tone and smile tell us about her?", "md": "She is kind, wise and gentle."}, {"type": "reveal", "prompt": "State one thing about the old woman when she calls Velu 'my son'.", "md": "She speaks with a mother's affection and care, like an elder."}, {"type": "reveal", "prompt": "The 'difficulty' she mentions is due to the fact that ______.", "md": "people don't realise that the earth is old and needs rest like them."}, {"type": "exercise", "title": "Long questions 1-6", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) How does the old woman convey Nature's wisdom? (2) Why couldn't farmers tend their fields without rain? (3) Support the view that land needs rest like people. (4) What can be inferred about Velu's character? (5) The life of farmers and their relationship with nature. (6) How might rest and care of land support a sustainable ecosystem?", "checklist": ["Evidence", "Reasons"], "solution": "1) She compares the earth to a worker who needs rest and Nature to a mother who gives rest to her children.\n2) The soil was hard and crusted and could not be ploughed or sown without rain.\n3) The earth has worked for thousands of years; just as we rest, the land recovers nutrients.\n4) Velu is hard-working, practical and honest but impatient; he becomes open-minded.\n5) Farmers depend on nature and must live with its uncertainty.\n6) Resting land restores nutrients and moisture, reduces pests and keeps soil fertile for the future.", "solution_lang": "text", "hints": ["Link to lines."], "id": "ch04-10-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["Velu is practical and hard-working.", "The old woman teaches that the land needs rest.", "Nature is unpredictable and has its own wisdom."]}], "id": "ch04-10-rain-reflect", "chapter": "ch04", "kind": "lesson", "minutes": 20}, "ch04-11-rain-language": {"title": "Waiting for the Rain: language practice", "summary": "Weather and farming words, homophones, collocations, present tenses and determiners.", "blocks": [{"type": "text", "md": "**In this lesson:** Weather and farming words, homophones, collocations, present tenses and determiners."}, {"type": "quiz", "title": "Crossword words from the text", "questions": [{"type": "fill", "q": "gentle wind", "answer": "breeze", "explanation": "breeze.", "hints": ["Cool."]}, {"type": "fill", "q": "collected crops", "answer": "harvest", "explanation": "harvest.", "hints": ["Gathered."]}, {"type": "fill", "q": "prepare and use (the land)", "answer": "cultivate", "explanation": "cultivate.", "hints": ["Farm."]}, {"type": "fill", "q": "land for crops", "answer": "field", "explanation": "field.", "hints": ["Land."]}, {"type": "fill", "q": "rumbling sound with rain", "answer": "thunder", "explanation": "thunder.", "hints": ["Sky."]}, {"type": "fill", "q": "grains etc. grown in large quantity", "answer": "crop", "explanation": "crop.", "hints": ["Grown."]}, {"type": "fill", "q": "turn up the soil", "answer": ["plough", "till"], "explanation": "plough or till.", "hints": ["Farm action."]}, {"type": "fill", "q": "plant seeds", "answer": "sow", "explanation": "sow.", "hints": ["Scatter seeds."]}], "id": "ch04-11-qu1"}, {"type": "quiz", "title": "Homophones", "questions": [{"type": "single", "q": "The farmer wondered ______ the clouds would bring rain.", "options": ["whether", "weather"], "answer": 0, "explanation": "whether = if.", "hints": ["If."]}, {"type": "single", "q": "breaking a small ______ of roti", "options": ["piece", "peace"], "answer": 0, "explanation": "piece = part.", "hints": ["A part."]}, {"type": "single", "q": "The ______ fields stretched endlessly.", "options": ["plain", "plane"], "answer": 0, "explanation": "plain = flat.", "hints": ["Flat land."]}, {"type": "single", "q": "he could ______ his last sack of grain", "options": ["sell", "cell"], "answer": 0, "explanation": "sell.", "hints": ["Trade."]}, {"type": "single", "q": "it didn't ______ possible to grow another crop", "options": ["seem", "seam"], "answer": 0, "explanation": "seem.", "hints": ["Appear."]}, {"type": "single", "q": "every farmer hopes for the next ______", "options": ["rain", "reign"], "answer": 0, "explanation": "rain.", "hints": ["Water."]}], "id": "ch04-11-qu2"}, {"type": "quiz", "title": "Meanings in context", "questions": [{"type": "single", "q": "'Being annoyed, she muttered something.' muttered =", "options": ["spoke in a low voice", "spoke slowly", "spoke angrily"], "answer": 0, "explanation": "Low voice.", "hints": ["Under her breath."]}, {"type": "single", "q": "'Riya felt forlorn for a week.' forlorn =", "options": ["sad and neglected", "upset and irritated", "angry and bitter"], "answer": 0, "explanation": "Sad and neglected.", "hints": ["Lonely."]}, {"type": "single", "q": "'He was at a loss because he did not know what to do.'", "options": ["confused", "shocked", "lonely"], "answer": 0, "explanation": "Confused.", "hints": ["Unsure."]}, {"type": "single", "q": "'Her eyes sparkled.'", "options": ["showed joy", "glowed dimly", "opened wide"], "answer": 0, "explanation": "Joy.", "hints": ["Happy."]}], "id": "ch04-11-qu3"}, {"type": "quiz", "title": "Collocations", "questions": [{"type": "single", "q": "favourable ___", "options": ["weather", "skin", "expression", "garden"], "answer": 0, "explanation": "favourable weather.", "hints": ["Given."]}, {"type": "single", "q": "wrinkled ___", "options": ["skin", "weather", "country", "activity"], "answer": 0, "explanation": "wrinkled skin.", "hints": ["Old."]}, {"type": "single", "q": "dejected ___", "options": ["expression", "garden", "activity", "country"], "answer": 0, "explanation": "dejected expression.", "hints": ["Sad look."]}, {"type": "single", "q": "fragrant ___", "options": ["garden", "expression", "skin", "activity"], "answer": 0, "explanation": "fragrant garden.", "hints": ["Smelling nice."]}, {"type": "single", "q": "ceaseless ___", "options": ["activity", "garden", "skin", "weather"], "answer": 0, "explanation": "ceaseless activity.", "hints": ["Nonstop."]}, {"type": "single", "q": "beloved ___", "options": ["country", "weather", "skin", "activity"], "answer": 0, "explanation": "beloved country.", "hints": ["Dear."]}], "id": "ch04-11-qu4"}, {"type": "quiz", "title": "Present tenses (V)", "questions": [{"type": "fill", "q": "Ravi ______ (be) a farmer who ______ (practise) crop rotation.", "answer": "is, practises", "explanation": "Simple present.", "hints": ["Habit."]}, {"type": "fill", "q": "Each season he ______ (plant) different crops.", "answer": "plants", "explanation": "plants.", "hints": ["Regular."]}, {"type": "fill", "q": "This year he ______ (grow) legumes.", "answer": "is growing", "explanation": "Present progressive.", "hints": ["Now."]}, {"type": "fill", "q": "Over the years Ravi ______ (learn) that...", "answer": "has learnt", "explanation": "Present perfect.", "hints": ["Up to now."]}, {"type": "fill", "q": "... planting the same crop repeatedly ______ (deplete) the soil.", "answer": "depletes", "explanation": "depletes.", "hints": ["General truth."]}, {"type": "fill", "q": "... he ______ (keep) the land productive.", "answer": "keeps", "explanation": "keeps.", "hints": ["Habit."]}, {"type": "fill", "q": "He ______ (see) a noticeable improvement since adopting this method.", "answer": "has seen", "explanation": "Present perfect.", "hints": ["Since."]}, {"type": "fill", "q": "Now Ravi ______ (share) his knowledge.", "answer": "is sharing", "explanation": "is sharing.", "hints": ["Now."]}, {"type": "fill", "q": "... how crop rotation ______ (benefit) both soil and harvests.", "answer": "benefits", "explanation": "benefits.", "hints": ["Fact."]}], "id": "ch04-11-qu5"}, {"type": "quiz", "title": "Determiners", "questions": [{"type": "single", "q": "It was ___ rainy afternoon.", "options": ["a", "an"], "answer": 0, "explanation": "a rainy.", "hints": ["Consonant sound."]}, {"type": "single", "q": "___ sky was thick with dark clouds.", "options": ["the", "a"], "answer": 0, "explanation": "the sky.", "hints": ["Specific."]}, {"type": "single", "q": "Mala noticed a puddle in front of ___ house.", "options": ["her", "their"], "answer": 0, "explanation": "her.", "hints": ["Mala."]}, {"type": "single", "q": "always loved playing in ___ rain.", "options": ["the", "a"], "answer": 0, "explanation": "the rain.", "hints": ["General."]}, {"type": "single", "q": "jumping from ___ puddle to another", "options": ["one", "some"], "answer": 0, "explanation": "one puddle to another.", "hints": ["Count."]}, {"type": "single", "q": "___ snails", "options": ["a few", "few"], "answer": 0, "explanation": "'a few' is positive.", "hints": ["Positive sense."]}, {"type": "single", "q": "With ___ jump", "options": ["each", "every"], "answer": 0, "explanation": "each jump.", "hints": ["Individual."]}, {"type": "single", "q": "both ___ squeals and laughter", "options": ["their", "her"], "answer": 0, "explanation": "their (both).", "hints": ["Two people."]}, {"type": "single", "q": "Though drenched, ___ sibling minded it.", "options": ["neither", "either"], "answer": 0, "explanation": "neither.", "hints": ["Not one of two."]}], "id": "ch04-11-qu6"}, {"type": "summary", "points": ["Homophones sound alike: weather/whether, piece/peace, plain/plane.", "Present perfect links the past to now.", "Determiners come before nouns: articles, possessives, 'a few', each, neither."]}], "id": "ch04-11-rain-language", "chapter": "ch04", "kind": "lesson", "minutes": 35}, "ch04-12-rain-skills": {"title": "Waiting for the Rain: listen, speak, write, explore", "summary": "Listen to a weather forecast, play with a tongue twister, role-play Rain and Earth, write to the Councillor.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to a weather forecast, play with a tongue twister, role-play Rain and Earth, write to the Councillor."}, {"type": "read", "title": "Let us listen: the weather forecast", "label": "Listen", "md": "Delhi is expected to have a cloudy sky with light rain; the temperature will be between 25 and 36 degrees. Mumbai will be cloudy with moderate rain, between 24 and 30 degrees. Kolkata will have a partly cloudy sky with one or two spells of rain or thundershowers, between 28 and 34 degrees. Chennai is expected to have a partly cloudy sky with the possibility of a thunderstorm, between 27 and 36 degrees. Bengaluru will be cloudy with light rain, between 21 and 29 degrees. Hyderabad will be cloudy with light rain or drizzle, between 23 and 33 degrees. Don't forget to carry your umbrellas!", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: fill in", "questions": [{"type": "fill", "q": "Delhi will mostly have a ______ sky with light rain.", "answer": "cloudy", "explanation": "cloudy.", "hints": ["Sky."]}, {"type": "fill", "q": "Moderate rain is likely in ______.", "answer": "Mumbai", "explanation": "Mumbai.", "hints": ["West coast."]}, {"type": "fill", "q": "Kolkata's maximum temperature is around ______ °C.", "answer": "34", "explanation": "34.", "hints": ["Thirty-something."]}, {"type": "fill", "q": "There is a chance of a ______ in Chennai.", "answer": "thunderstorm", "explanation": "thunderstorm.", "hints": ["Storm."]}, {"type": "fill", "q": "Bengaluru will have a ______ temperature of 29 °C.", "answer": "maximum", "explanation": "maximum.", "hints": ["Highest."]}, {"type": "fill", "q": "Taking an ______ is advisable.", "answer": "umbrella", "explanation": "umbrella.", "hints": ["Rain."]}], "id": "ch04-12-qu1"}, {"type": "exercise", "title": "Tongue twister", "difficulty": "easy", "minutes": 8, "goal": "Say as fast as you can: 'Whether the weather be fine, or whether the weather be not, whether the weather be cold, or whether the weather be hot, we'll weather the weather, whatever the weather, whether we like it or not.'", "checklist": ["Said it clearly", "Then faster"], "solution": "Practise slowly first, then speed up. Notice the sounds /w/ and /th/.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-12-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Role-play: Rain and Earth", "difficulty": "easy", "minutes": 8, "goal": "In pairs, role-play a conversation between Rain and the Earth after a long dry spell. Start: 'Rain: Greetings, Earth! It's been a while since we've met. How have you been?'", "checklist": ["Used the hints for both parts", "Expressed relief and gratitude", "Ended with a promise"], "solution": "Earth: Hello Rain! I am so glad to see you. I was parched. Rain: I came a long way from the sky... Earth: Thank you for the gift of water. Rain: I promise to return on time next year.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-12-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a letter to the Councillor", "difficulty": "medium", "minutes": 15, "goal": "Write a formal letter to your Municipal Councillor requesting a rainwater harvesting unit for your ward, with suggestions to address water scarcity.", "checklist": ["Sender's address and date", "Receiver's designation", "Subject line", "Para 1 problem, para 2 causes and consequences, para 3 request and suggestions, para 4 conclusion", "Formal and concise"], "solution": "Subject: Request to Install a Rainwater Harvesting Unit in Ward No. 44\nDear Madam,\nI would like to bring to your notice the severe shortage of water in our ward every summer. The groundwater level has fallen and tankers come irregularly. As a result, families spend hours fetching water. I request you to set up a rainwater harvesting unit in the community park and to encourage households to install rooftop systems. I look forward to your action.\nYours sincerely, (Rahul Menon)", "solution_lang": "text", "hints": ["Keep it short and to the point."], "id": "ch04-12-ex3", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore: fallowing and weather wisdom", "difficulty": "easy", "minutes": 8, "goal": "(1) Fallowing: leaving land unsown for one or more cycles to recover nutrients and moisture and to control pests. (2) Ask your Vocational Education teacher about agriculture and horticulture. (3) Read about indigenous weather knowledge in ancient texts like the Rigveda and Meghmala and about IMD agro-met services.", "checklist": ["Explained fallowing", "Named a vocation"], "solution": "Fallowing divides a field in two: one half is planted while the other rests, then they swap the next year. Horticulture is the growing of fruits, vegetables and flowers.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-12-ex4", "mode": "selfcheck"}, {"type": "summary", "points": ["A weather forecast gives sky conditions, rain and temperature ranges.", "A formal letter has four paragraphs.", "Fallowing lets land recover."]}], "id": "ch04-12-rain-skills", "chapter": "ch04", "kind": "lesson", "minutes": 45}, "ch04-99-test": {"title": "Test: Unit 4: Environment", "summary": "Check what you have learnt in Unit 4.", "blocks": [{"type": "quiz", "title": "Unit 4 test", "questions": [{"type": "single", "q": "Grandfather said 'nothing is lucky if you put it away'. He meant ______.", "options": ["luck comes from using things with effort", "seeds are unlucky", "never plant", "luck is a game"], "answer": 0, "explanation": "Put it to use.", "hints": ["Effort."]}, {"type": "single", "q": "The cherry tree stood for ______.", "options": ["growth and toughness, mirroring Rakesh", "a goat", "winter", "sourness"], "answer": 0, "explanation": "Rakesh and the tree grew together.", "hints": ["Grow."]}, {"type": "single", "q": "'As we were talking, I realised...' uses ______.", "options": ["Past Progressive", "Past Perfect", "Simple Present", "Future"], "answer": 0, "explanation": "were + -ing.", "hints": ["Ongoing."]}, {"type": "single", "q": "The opposite of 'sturdy' is ______.", "options": ["shaky", "wide", "cold", "special"], "answer": 0, "explanation": "shaky.", "hints": ["Weak."]}, {"type": "single", "q": "'Thou art the Seed and the Scythe' is a ______.", "options": ["metaphor", "simile", "pun", "refrain"], "answer": 0, "explanation": "Direct comparison.", "hints": ["No 'like'."]}, {"type": "single", "q": "Surya symbolises ______.", "options": ["light, energy and life", "mercy and rain", "motherhood", "greed"], "answer": 0, "explanation": "The Sun.", "hints": ["Light."]}, {"type": "single", "q": "'thee' means ______.", "options": ["you (object)", "your", "yours", "are"], "answer": 0, "explanation": "thee = you.", "hints": ["Archaic."]}, {"type": "single", "q": "Velu learnt that ______.", "options": ["the land needs rest", "astrologers are right", "the weather office is wrong", "he should work less"], "answer": 0, "explanation": "Nature's wisdom.", "hints": ["Rest."]}, {"type": "single", "q": "'weather' and 'whether' are ______.", "options": ["homophones", "synonyms", "antonyms", "rhymes only"], "answer": 0, "explanation": "Same sound, different meaning.", "hints": ["Homophones."]}, {"type": "single", "q": "'She has worked hard' is in the ______ tense.", "options": ["Present Perfect", "Simple Present", "Past Perfect", "Past Progressive"], "answer": 0, "explanation": "has + past participle.", "hints": ["Up to now."]}, {"type": "single", "q": "'___ sibling minded the rain.' (not one of the two)", "options": ["Neither", "Either", "Each", "Every"], "answer": 0, "explanation": "Neither.", "hints": ["Not one."]}, {"type": "single", "q": "The silent letter in 'hymn' is ______.", "options": ["n", "m", "h", "y"], "answer": 0, "explanation": "Silent n.", "hints": ["End."]}], "id": "ch04-99-qu1", "pass_score": 0.7, "mode": "test"}], "kind": "test", "id": "ch04-99-test", "chapter": "ch04", "minutes": 10}, "ch05-01-feathered-story": {"title": "Feathered Friend: warm-up and the story", "summary": "Learn six key words, hear Arthur C. Clarke's space-station story and check your understanding.", "blocks": [{"type": "text", "md": "**In this lesson:** Learn six key words, hear Arthur C. Clarke's space-station story and check your understanding."}, {"type": "exercise", "title": "Discuss in pairs", "difficulty": "easy", "minutes": 8, "goal": "Discuss: (1) Who can a 'feathered' friend be? (2) Which feathered friend do you like and why? (3) Feathered or furry friend: whom would you choose? (4) Could a feathered or furry friend go to space with astronauts?", "checklist": ["Named a bird/animal", "Gave a reason for each answer", "Used 'because'"], "solution": "1) A pet bird such as a parrot, canary or sparrow. 2) I like the parrot because it can copy words. 3) A feathered friend, because birds sing and need less space. 4) A small bird could, but it needs oxygen, food and a safe cage, so only for experiments.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-01-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Complete the word with vowels", "questions": [{"type": "fill", "q": "R _ G _ L _ T _ _ N: official rule that controls how something is done", "answer": "regulation", "explanation": "regulation.", "hints": ["Rule."]}, {"type": "fill", "q": "F _ R B _ D: to not allow something", "answer": "forbid", "explanation": "forbid.", "hints": ["Not allow."]}, {"type": "fill", "q": "F _ S _: join or blend into one", "answer": "fuse", "explanation": "fuse.", "hints": ["Join."]}, {"type": "fill", "q": "_ B R _ P T L Y: suddenly", "answer": "abruptly", "explanation": "abruptly.", "hints": ["Suddenly."]}, {"type": "fill", "q": "C _ N F _ S S: admit one's mistake", "answer": "confess", "explanation": "confess.", "hints": ["Admit."]}, {"type": "fill", "q": "D _ _ T _ T _ _ N: a person who advises what to eat", "answer": "dietitian", "explanation": "dietitian.", "hints": ["Food expert."]}], "id": "ch05-01-qu1"}, {"type": "read", "title": "Feathered Friend, part I (short retelling)", "label": "Read", "md": "The narrator says there has never been a rule against keeping pets on a space station, and even if there were, Sven Olsen would have ignored it. Sven was a thin, strong builder. In space he caught floating steel girders, moved them into place in a slow three-dimensional dance and fused them together, working in a bulky space suit. Unlike builders on Earth, he could step back and admire the work without gravity pulling him away.\n\nSven's pet was a small yellow canary called Claribel. She weighed almost nothing, ate very little and was not troubled by weightlessness. The narrator first heard her musical whistle in his tiny office and bumped his head on a beam in surprise. She hung in the air like a hummingbird, did a backward loop no Earth canary could manage and left. Sven admitted she was his only after several days. He had smuggled her up on the last ferry, partly out of scientific curiosity, to see how a bird would fly without weight. Claribel grew fat and became everyone's pet. The crew hid her from visiting VIPs, though her noisy peeps sometimes had to be explained.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Let us discuss: part I", "questions": [{"type": "single", "q": "Sven's scientific reason for smuggling Claribel was to ______.", "options": ["see how a bird flies when it has no weight but can use its wings", "teach her to sing", "measure her appetite", "test the space suits"], "answer": 0, "explanation": "He wanted to see how a bird behaves in weightlessness.", "hints": ["Think: wings without weight."]}, {"type": "single", "q": "The narrator thought the whistle came from the intercom because ______.", "options": ["it was a musical sound beside his ear and he expected an announcement", "he saw the loudspeaker", "Sven told him", "the intercom was broken"], "answer": 0, "explanation": "He waited for an announcement that never came.", "hints": ["He did not see a bird at first."]}, {"type": "single", "q": "How did Claribel adjust to space?", "options": ["She quickly learned to move without gravity and did not worry about it.", "She stayed in her cage.", "She lost weight.", "She stopped singing."], "answer": 0, "explanation": "She flew in loops and saved effort.", "hints": ["Think of her loops and her lazy flicks."]}, {"type": "multi", "q": "Which could cause the spacers trouble? (Choose all.)", "options": ["Visitors from Earth might discover a pet", "Claribel's noise when upset", "Claribel's size", "Hiding her in vents and shafts"], "answer": [0, 1, 3], "explanation": "Pets were not formally allowed in practice, and her noise risked discovery.", "hints": ["Think about VIPs."]}], "id": "ch05-01-qu2"}, {"type": "read", "title": "Feathered Friend, part II (short retelling)", "label": "Read", "md": "Next 'morning' the crew was on twelve-hour watches. The narrator woke with a headache and disturbed dreams. At breakfast one seat was empty because Sven was searching for Claribel. He came in holding her: a tiny bundle of yellow feathers, claws clenched. The cook-doctor-dietitian, Jock Duncan, listened for a heartbeat but could not tell. Someone suggested oxygen. Claribel revived inside a mask, sang a few notes and fainted again.\n\nThen the narrator remembered that miners once carried canaries to detect poisonous gas. He told the duty engineer, Jim, that something was wrong with the air. Jim said the duplicate alarm circuits would have gone off, but his assistant reminded him the second circuit was not yet connected. Jim hurried away while the crew passed the oxygen bottle around like a pipe of peace.\n\nTen minutes later Jim returned looking sheepish. A rare eclipse by Earth's shadow had frozen part of the air purifier and the single alarm failed. Without Claribel the crew would soon have been slightly dead. So if you hear birdsong on a space station, you are doubly safeguarded.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "True or false", "questions": [{"type": "truefalse", "q": "The alarm failed because the alarms were not connected.", "answer": false, "explanation": "Only the second alarm circuit was unconnected; the one working alarm failed when the purifier froze.", "hints": ["Re-read what Jim learned."]}, {"type": "truefalse", "q": "Claribel was brought to the space station for an official experiment.", "answer": false, "explanation": "Sven smuggled her as a pet, partly out of curiosity.", "hints": ["Was she allowed?"]}, {"type": "truefalse", "q": "The canary's suffering helped the crew discover a problem with the air purifier.", "answer": true, "explanation": "She fainted from bad air, which led to the discovery.", "hints": ["Think of the miners."]}, {"type": "truefalse", "q": "The air purifier froze because of a rare eclipse.", "answer": true, "explanation": "Earth's shadow cut off the sunlight and part of the purifier froze.", "hints": ["Shadow."]}, {"type": "truefalse", "q": "Claribel could fly gracefully in the space station, performing loops.", "answer": true, "explanation": "She did a backward loop.", "hints": ["Backward loop."]}, {"type": "truefalse", "q": "The crew was uninterested in Claribel after she was discovered.", "answer": false, "explanation": "She became a general pet.", "hints": ["Everyone loved her."]}, {"type": "truefalse", "q": "Claribel fainted and had to be revived with oxygen.", "answer": true, "explanation": "The oxygen mask revived her.", "hints": ["Mask."]}], "id": "ch05-01-qu3"}, {"type": "summary", "points": ["Sven smuggled a canary into the space station out of curiosity.", "The canary fainted because the air was bad.", "A failed alarm and a frozen purifier were the cause.", "Claribel's fainting saved the crew."]}], "terms": [{"term": "canary", "def": "a small yellow pet bird"}, {"term": "girder", "def": "a long thick steel beam for supporting buildings"}], "id": "ch05-01-feathered-story", "chapter": "ch05", "kind": "lesson", "minutes": 25}, "ch05-02-feathered-reflect": {"title": "Feathered Friend: think and reflect", "summary": "Answer the extract questions and the long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Answer the extract questions and the long questions."}, {"type": "quiz", "title": "Extract 1: Sven's job", "questions": [{"type": "single", "q": "What can be inferred about Sven's abilities?", "options": ["He is good at following instructions but lacks creativity.", "He understands working in space very well.", "He struggles with space construction.", "He prefers simple tasks."], "answer": 1, "explanation": "His difficult, specialised work shows strong skill.", "hints": ["He is 'one of our best'."]}, {"type": "single", "q": "Assertion (A): Sven's job required girders to perform a 'three-dimensional ballet'. Reason (R): Zero gravity lets objects float, making precise positioning harder.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "A false, R true"], "answer": 0, "explanation": "Floating objects need careful steering, which is why the job looks like a dance.", "hints": ["Does R explain the dance?"]}, {"type": "fill", "q": "Replace 'outfits' with a word from the extract: 'people wore colourful outfits'.", "answer": "garbs", "explanation": "garbs = clothing of a special kind.", "hints": ["Starts with g."]}], "id": "ch05-02-qu1"}, {"type": "exercise", "title": "How do we know Sven worked in zero gravity?", "difficulty": "easy", "minutes": 8, "goal": "Give clues from the extract.", "checklist": ["Mentions floating girders", "Mentions 'free fall'", "Mentions no gravity pulling them away"], "solution": "The girders 'floated around in free fall', and Sven's team could admire their work without being pulled away by gravity. These clues show zero gravity.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-02-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Extract 2: the alarm", "questions": [{"type": "single", "q": "The narrator references canaries and miners in order to ______.", "options": ["highlight the historical use of canaries as warning systems", "explain the reason that caused Claribel to faint suddenly"], "answer": 1, "explanation": "He realises why she fainted: bad air, like gas in a mine.", "hints": ["He is solving a puzzle."]}, {"type": "single", "q": "'That shook Jim' means Jim was ______.", "options": ["physically pushed", "startled by unexpected information", "cold", "sleepy"], "answer": 1, "explanation": "Surprise, not a push.", "hints": ["Mental shock."]}, {"type": "fill", "q": "Jim initially dismisses the warning because he thinks the ______ circuits would have set off the alarms.", "answer": ["duplicate", "alarm", "alarm circuits"], "explanation": "He believed there were two independent alarm circuits.", "hints": ["Duplicate."]}], "id": "ch05-02-qu2"}, {"type": "exercise", "title": "'Like a pipe of peace'", "difficulty": "easy", "minutes": 8, "goal": "What does passing the oxygen bottle around 'like a pipe of peace' suggest about the crew's response?", "checklist": ["Mentions humour/relief", "Mentions calm sharing after tension"], "solution": "It suggests they were sharing the oxygen calmly, even jokingly, as if making peace after arguing about the problem. The comparison adds humour to a serious moment.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-02-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Long questions 1-7", "difficulty": "medium", "minutes": 20, "goal": "Answer: (1) What was the purpose of the alarm and why did it fail? (2) How does the crew's reaction to Claribel change? (3) What does the last part say about unusual problem solving? (4) Justify the title. (5) What does 'slightly dead' suggest? (6) How is science fiction mixed with humour? (7) How would Sven reflect on saving the crew?", "checklist": ["Evidence from the story", "Reasons", "Own words"], "solution": "1) The alarm should warn about unsafe air; the single alarm failed because the purifier froze during an eclipse and the second circuit was not connected.\n2) At first it is a secret, then she becomes a general pet, and at the end she is a hero.\n3) A small, unexpected idea (a canary) can solve a big technical failure.\n4) 'Feathered Friend' fits because the bird is a friend and saves lives.\n5) It jokes about a deadly danger, showing how uncertain life in space is.\n6) Words like 'slightly dead', the pipe of peace and the 'doubly safeguarded' ending are funny but the setting is science fiction.\n7) Sven would feel relieved and proud, and grateful that his curiosity helped.", "solution_lang": "text", "hints": ["Quote a phrase from the story where you can."], "id": "ch05-02-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["A good inference uses clues from the text.", "The canary's fainting was a warning sign.", "Humour makes a serious sci-fi story enjoyable."]}], "id": "ch05-02-feathered-reflect", "chapter": "ch05", "kind": "lesson", "minutes": 40}, "ch05-03-feathered-language": {"title": "Feathered Friend: language practice", "summary": "Adjectives, merged words and ways to talk about the future.", "blocks": [{"type": "text", "md": "**In this lesson:** Adjectives, merged words and ways to talk about the future."}, {"type": "quiz", "title": "Choose the adjective (Let us learn I)", "questions": [{"type": "fill", "q": "______ path", "answer": "narrow", "explanation": "narrow path.", "hints": ["Not wide."]}, {"type": "fill", "q": "______ worry", "answer": "nagging", "explanation": "nagging worry.", "hints": ["Persistent."]}, {"type": "fill", "q": "______ plan", "answer": "vague", "explanation": "vague plan.", "hints": ["Unclear."]}, {"type": "fill", "q": "______ look", "answer": "sheepish", "explanation": "sheepish look.", "hints": ["Embarrassed."]}, {"type": "fill", "q": "______ reason", "answer": "inexplicable", "explanation": "inexplicable reason.", "hints": ["Cannot be explained."]}, {"type": "fill", "q": "______ traffic", "answer": "sluggish", "explanation": "sluggish traffic.", "hints": ["Slow."]}, {"type": "fill", "q": "______ voices", "answer": "hushed", "explanation": "hushed voices.", "hints": ["Quiet."]}, {"type": "fill", "q": "______ expression", "answer": "delighted", "explanation": "delighted expression.", "hints": ["Happy."]}], "id": "ch05-03-qu1"}, {"type": "quiz", "title": "Merged words (II)", "questions": [{"type": "fill", "q": "motor + hotel = ______", "answer": "motel", "explanation": "motel: a hotel for motorists.", "hints": ["mo + tel."]}, {"type": "fill", "q": "smoke + fog = ______", "answer": "smog", "explanation": "smog: smoky fog.", "hints": ["sm + og."]}, {"type": "fill", "q": "situation + comedy = ______", "answer": "sitcom", "explanation": "sitcom: a funny TV series.", "hints": ["sit + com."]}, {"type": "fill", "q": "video + log = ______", "answer": "vlog", "explanation": "vlog: a video blog.", "hints": ["v + log."]}, {"type": "fill", "q": "spoon + fork = ______", "answer": "spork", "explanation": "spork: a spoon with fork prongs.", "hints": ["sp + ork."]}, {"type": "fill", "q": "web + seminar = ______", "answer": "webinar", "explanation": "webinar: a seminar held on the web.", "hints": ["web + inar."]}], "id": "ch05-03-qu2"}, {"type": "text", "md": "English has many ways to talk about the future: **will** (predictions, offers), **simple present** (timetables), **present progressive** (fixed plans), **going to** (informal plans), **future perfect** (will have + past participle: completed by a time), **future progressive** (will be + -ing: in progress at a time) and **future in the past** (was going to, would)."}, {"type": "quiz", "title": "Future forms (III-IV)", "questions": [{"type": "single", "q": "'It will mean that you're being doubly safeguarded.' Here 'will' denotes ______ time.", "options": ["past", "present", "future"], "answer": 2, "explanation": "Will talks about what is coming.", "hints": ["Next."]}, {"type": "fill", "q": "Our flight ______ (leave) at 10.00 a.m. tomorrow. (timetable)", "answer": ["leaves"], "explanation": "Timetable: simple present.", "hints": ["Schedule."]}, {"type": "fill", "q": "They ______ (finish) the project by the end of this week.", "answer": ["will finish", "will have finished"], "explanation": "Both show a future result.", "hints": ["Future."]}, {"type": "fill", "q": "The weather forecast says it ______ (rain) later today.", "answer": ["will rain", "is going to rain"], "explanation": "A prediction.", "hints": ["Prediction."]}, {"type": "fill", "q": "We ______ (move) into our new house next month.", "answer": ["are moving"], "explanation": "A fixed plan: present progressive.", "hints": ["Plan."]}, {"type": "fill", "q": "I ______ (start) my new hobby class next Monday.", "answer": ["am starting"], "explanation": "Fixed arrangement.", "hints": ["Arranged."]}, {"type": "fill", "q": "She ______ (go) to the mall this afternoon.", "answer": ["is going", "is going to go"], "explanation": "Plan.", "hints": ["Plan."]}, {"type": "fill", "q": "The team ______ (have) a meeting at 3.00 p.m. tomorrow.", "answer": ["has", "is having", "will have"], "explanation": "A scheduled event.", "hints": ["Scheduled."]}, {"type": "fill", "q": "I ______ (help) you with your homework after dinner.", "answer": ["will help"], "explanation": "An offer or promise: will.", "hints": ["Promise."]}], "id": "ch05-03-qu3"}, {"type": "exercise", "title": "Future forms in a paragraph (V)", "difficulty": "medium", "minutes": 10, "goal": "Fill in with the suitable future forms: By 2040, AI (revolutionise) medical treatments. Researchers (develop) AI-powered tools that (transform) healthcare by the end of this decade. Next week the International Science Congress (open). In the coming years, robots (assist) surgeons. Years ago, experts had predicted AI would reshape our world, and now this (be) our new reality.", "checklist": ["1: will have revolutionised", "2: will develop / are developing", "3: will have transformed", "4: opens (schedule)", "5: will assist / will be assisting", "6: is"], "solution": "By 2040 AI will have revolutionised medical treatments. Researchers will develop tools that will have transformed healthcare by the end of this decade. Next week the Science Congress opens. In the coming years robots will assist surgeons. ... this is our new reality.", "solution_lang": "text", "hints": ["'By 2040' -> future perfect."], "id": "ch05-03-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["Merged words (blends) are made by joining parts of two words.", "Choose the future form by meaning: schedule, plan, prediction, completion.", "Adjectives like nagging, vague and sheepish describe nouns precisely."]}], "terms": [{"term": "blend", "def": "a word made by joining parts of two words (e.g. brunch)"}], "id": "ch05-03-feathered-language", "chapter": "ch05", "kind": "lesson", "minutes": 30}, "ch05-04-feathered-skills": {"title": "Feathered Friend: listen, speak, write, explore", "summary": "Listen to Toby the Martian, practise silent letters, ask for advice and write an article.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to Toby the Martian, practise silent letters, ask for advice and write an article."}, {"type": "read", "title": "Let us listen: Monika and Toby", "label": "Listen", "md": "Monika asks Toby, a Martian stranded on Earth, if he misses his planet. He says he misses his people and home. She says she is happy to have him as a friend. She asks what he eats for breakfast. Toby says Martians do not eat; they get energy from the Sun. Monika asks if he never wants ice creams and chocolates, but he says Martians are made of different stuff. She wonders how he sees with only one eye. Toby says one eye is enough, and he can even see with his eye closed: through mountains, clouds, wood and metals. He says she has a blue toy aeroplane in her pocket, and that the apple she ate for breakfast is going round and round in her stomach. Monika gasps in disbelief.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: tick or cross", "questions": [{"type": "truefalse", "q": "Toby misses his school.", "answer": false, "explanation": "He misses his people and home.", "hints": ["Listen to what he misses."]}, {"type": "truefalse", "q": "Monika accepts Toby as her friend.", "answer": true, "explanation": "She is happy to have him as a friend.", "hints": ["Friendly."]}, {"type": "truefalse", "q": "Monika asks Toby about one of his facial features.", "answer": true, "explanation": "She asks about his single eye.", "hints": ["Eye."]}, {"type": "truefalse", "q": "Toby tells Monika that she had a banana for breakfast.", "answer": false, "explanation": "It was an apple.", "hints": ["A fruit that keeps the doctor away."]}, {"type": "truefalse", "q": "Toby says he can see much clearer with a closed eye.", "answer": false, "explanation": "He says he can see even with his eye closed, not 'clearer'.", "hints": ["Compare 'even' and 'clearer'."]}], "id": "ch05-04-qu1"}, {"type": "quiz", "title": "Listen: exact words", "questions": [{"type": "fill", "q": "I miss my ______ and home.", "answer": "people", "explanation": "people.", "hints": ["Martians."]}, {"type": "fill", "q": "We ______ don't need to eat anything.", "answer": "Martians", "explanation": "Martians.", "hints": ["Toby's race."]}, {"type": "fill", "q": "We get our ______ from the Sun.", "answer": "energy", "explanation": "energy.", "hints": ["Power."]}, {"type": "fill", "q": "Don't you ever feel like having ice-creams and ______?", "answer": "chocolates", "explanation": "chocolates.", "hints": ["Sweet."]}, {"type": "fill", "q": "How are you able to see only with ______ eye?", "answer": "one", "explanation": "one.", "hints": ["Single."]}, {"type": "fill", "q": "I can see beyond mountains and ______, woods and even ______. (first word)", "answer": "clouds", "explanation": "clouds.", "hints": ["Sky."]}], "id": "ch05-04-qu2"}, {"type": "quiz", "title": "Silent letters", "questions": [{"type": "single", "q": "Which letter is silent in 'ballet' (ba-lay)?", "options": ["t", "l", "b", "a"], "answer": 0, "explanation": "The final -t is silent in French loanword ballet.", "hints": ["Last letter."]}, {"type": "single", "q": "Silent letter in 'whistle'?", "options": ["t", "w", "h", "s"], "answer": 0, "explanation": "The t is silent.", "hints": ["wi-sl."]}, {"type": "single", "q": "Silent letter in 'psychologist'?", "options": ["p", "s", "y", "g"], "answer": 0, "explanation": "The p is silent.", "hints": ["sai-ko."]}, {"type": "single", "q": "Silent letter in 'receipt'?", "options": ["p", "c", "r", "e"], "answer": 0, "explanation": "p.", "hints": ["Before t."]}, {"type": "single", "q": "Silent letter in 'debris'?", "options": ["s", "d", "b", "r"], "answer": 0, "explanation": "The final s is silent (de-bree).", "hints": ["Last letter."]}, {"type": "single", "q": "Silent letter in 'pneumonia'?", "options": ["p", "n", "m", "a"], "answer": 0, "explanation": "p.", "hints": ["First letter."]}, {"type": "single", "q": "Silent letter in 'almond'?", "options": ["l", "m", "a", "d"], "answer": 0, "explanation": "l (ah-mund).", "hints": ["Middle."]}, {"type": "single", "q": "Silent letter in 'foreign'?", "options": ["g", "f", "r", "n"], "answer": 0, "explanation": "g.", "hints": ["Before n."]}, {"type": "single", "q": "Silent letter in 'island'?", "options": ["s", "i", "l", "a"], "answer": 0, "explanation": "s.", "hints": ["After i."]}, {"type": "single", "q": "Silent letter in 'wreck'?", "options": ["w", "r", "c", "k"], "answer": 0, "explanation": "w.", "hints": ["First letter."]}, {"type": "single", "q": "Silent letter in 'aisle'?", "options": ["s", "a", "i", "l"], "answer": 0, "explanation": "s.", "hints": ["Sounds like 'ile'."]}, {"type": "single", "q": "Silent letter in 'campaign'?", "options": ["g", "c", "m", "p"], "answer": 0, "explanation": "g.", "hints": ["Before n."]}, {"type": "single", "q": "Silent letter in 'fasten'?", "options": ["t", "f", "s", "n"], "answer": 0, "explanation": "t.", "hints": ["Middle."]}], "id": "ch05-04-qu3"}, {"type": "exercise", "title": "Ask for and give advice", "difficulty": "easy", "minutes": 8, "goal": "In pairs act out two situations: (1) you need to make a model of the solar system for the Science Exhibition; (2) you need to prepare for an inter-class quiz on Chandrayaan-3.", "checklist": ["Used 'What should I do...?' / 'How can I...?'", "Used 'I feel you should...' / 'It is best to...'"], "solution": "A: What should I do to make a model of the solar system? B: I feel you should use a thermocol ball for each planet. It is best to use paint, and you should ensure the orbits are drawn to scale.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-04-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Speak: space and invention", "difficulty": "easy", "minutes": 8, "goal": "Speak for one minute: (a) which planet you would visit, why, and five things you would take; (b) what you would invent, how and why.", "checklist": ["Gave reasons", "Named five items", "Described how the invention works"], "solution": "I would visit Mars because it has a red surface and might once have held water. I would take food, water, a camera, a warm suit and a notebook.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-04-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a conversation", "difficulty": "medium", "minutes": 15, "goal": "Write a conversation between Deepa and Asma, members of the Science Club, deciding on a model for the Science Fair. Mention where, when and with whom, use words in brackets for emotions, filler words, agreement and disagreement.", "checklist": ["Setting stated", "Brackets for emotions/actions", "Points of agreement and disagreement", "Ends with a decision"], "solution": "Deepa: (encouragingly) Don't worry, Asma. Tell me your idea.\nAsma: (hesitatingly) Er... a model of a water purifier using sand and charcoal.\nDeepa: Hmm, I'd prefer a solar cooker. (smiling) But yours is useful too.\nAsma: (excitedly) Why not do both?\nDeepa: Deal! We will meet tomorrow in the lab.", "solution_lang": "text", "hints": ["Use at least 3 stage directions."], "id": "ch05-04-ex3", "mode": "selfcheck"}, {"type": "exercise", "title": "Write an article: The Importance of Internet", "difficulty": "medium", "minutes": 20, "goal": "Write an article with a title, your name and three paragraphs: introduction, uses of the internet with examples (music, maps, mail, videos, social media, learning), and a thoughtful ending.", "checklist": ["Title and writer's name", "Paragraph 1: introduction", "Paragraph 2: uses with examples", "Paragraph 3: comment/quote"], "solution": "The Importance of Internet\nBy Meera\nThe internet connects the world... It lets us send mail, find routes on maps, learn on video lessons and enjoy music... Use it wisely, for knowledge is power.", "solution_lang": "text", "hints": ["Do not forget the examples."], "id": "ch05-04-ex4", "mode": "selfcheck"}, {"type": "quiz", "title": "Explore: do animals sense calamities?", "questions": [{"type": "single", "q": "According to the textbook, what do scientists say animals sense before an earthquake?", "options": ["Ultra-low frequency electromagnetic waves", "Loud sound waves", "Heat", "Light"], "answer": 0, "explanation": "Stress in deep rock generates such waves.", "hints": ["Waves."]}, {"type": "single", "q": "In 2004, before the tsunami, what did elephants do?", "options": ["Ran for higher ground", "Stayed still", "Slept", "Entered the sea"], "answer": 0, "explanation": "They fled to higher ground.", "hints": ["Escape."]}], "id": "ch05-04-qu4"}, {"type": "exercise", "title": "Explore: space routines and bird feeders", "difficulty": "easy", "minutes": 8, "goal": "(1) Read how astronauts write (Space Pen), exercise (straps and vacuum cylinders), eat (preserved food) and sleep (restrained in sleeping bags). (2) Learn about Salim Ali, the 'Birdman of India'. (3) Make a bird feeder from cardboard and chart paper in groups of four.", "checklist": ["Explained one astronaut routine", "Named Salim Ali as an ornithologist", "Made a feeder"], "solution": "Astronauts sleep in sleeping bags attached to a wall so they do not float away. Salim Ali studied birds and conducted systematic bird surveys across India.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-04-ex5", "mode": "selfcheck"}, {"type": "summary", "points": ["Silent letters: ballet (t), whistle (t), psychologist (p), receipt (p).", "Use 'What should I...?' to ask advice and 'I feel you should...' to give it.", "An article has a title, introduction, body and ending."]}], "id": "ch05-04-feathered-skills", "chapter": "ch05", "kind": "lesson", "minutes": 80}, "ch05-05-magnify-poem": {"title": "Magnifying Glass: warm-up and the poem", "summary": "Think about magnifying glasses, hear what the poem says and understand its devices.", "blocks": [{"type": "text", "md": "**In this lesson:** Think about magnifying glasses, hear what the poem says and understand its devices."}, {"type": "exercise", "title": "Look and discuss", "difficulty": "easy", "minutes": 8, "goal": "Look at the pictures of people using magnifying glasses (page 222). Answer: (1) What is common in all? (2) Which are you familiar with? (3) Why do they need a magnifying glass? (4) What other instruments magnify objects? (II) What would you use one for, and why?", "checklist": ["Answered all four", "Named another instrument (microscope, telescope, binoculars)"], "solution": "1) Everyone uses a magnifying glass to look closely. 3) Small things such as insects, footprints or small print are hard to see. 4) Microscope, telescope, binoculars. II) I would study insects in my garden to see their tiny legs.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-05-ex1", "mode": "selfcheck"}, {"type": "read", "title": "Magnifying Glass: what the poem says", "label": "Read", "md": "The speaker says the round glass can make magic 'talk'. A scrap of chalk shows countless tiny shells. An inch of moss becomes a forest of flowers and trees. A drop of water looks like a hive of bees.\n\nThe speaker lies in wait and watches a clever spider spin silk from its spinnerets. The spider has tiger-like claws, and silly flies stumble into his net in spite of having so many eyes. Even the tiniest thing becomes more marvellous through the glass, which seems to surpass itself. With lenses like it, looking at the moon, you would almost think you could walk there in an afternoon.", "note": "The poem is by Walter de la Mare. This is a summary in plain words, not the poem; read it on page 222-223 of your textbook."}, {"type": "quiz", "title": "Summary words (Let us discuss I)", "questions": [{"type": "fill", "q": "The poem describes the magic of seeing the world through a ______.", "answer": ["glass", "round glass", "magnifying glass"], "explanation": "The 'round glass'.", "hints": ["Title."]}, {"type": "fill", "q": "Tiny things like ______ ...", "answer": "shells", "explanation": "'myriad shells'.", "hints": ["In chalk."]}, {"type": "fill", "q": "... and ______ can appear vast.", "answer": "moss", "explanation": "'an inch of moss'.", "hints": ["Soft green."]}, {"type": "fill", "q": "Even a ______ of water ...", "answer": "drop", "explanation": "'a drop of water'.", "hints": ["Tiny amount."]}, {"type": "fill", "q": "... can seem like a hive of ______.", "answer": "bees", "explanation": "'like hive of bees'.", "hints": ["Buzz."]}, {"type": "fill", "q": "The poet is impressed at how the spider spins its ______ ...", "answer": ["web-silk", "silk", "web"], "explanation": "'woven web-silk'.", "hints": ["Spider."]}, {"type": "fill", "q": "... from its ______.", "answer": "spinnerets", "explanation": "'from his spinnerets'.", "hints": ["Spider parts."]}, {"type": "fill", "q": "Through lenses, the ______ could seem within reach.", "answer": "moon", "explanation": "'Eyeing the moon'.", "hints": ["Night sky."]}], "id": "ch05-05-qu1"}, {"type": "quiz", "title": "Main idea, tone and form (II)", "questions": [{"type": "single", "q": "The main idea is the transformative power of ______ through the magnifying glass.", "options": ["wonders in nature", "close observation"], "answer": 1, "explanation": "Looking closely reveals hidden wonders.", "hints": ["How do we use the glass?"]}, {"type": "single", "q": "The tone is ______.", "options": ["wonder and curiosity", "peaceful and emotional"], "answer": 0, "explanation": "The speaker is amazed.", "hints": ["Amazed."]}, {"type": "single", "q": "The poem has ______ stanzas with ______ lines each (a quatrain).", "options": ["four; six", "six; four"], "answer": 1, "explanation": "Six stanzas of four lines each.", "hints": ["Count them."]}, {"type": "single", "q": "The rhyme scheme is ______.", "options": ["ABCD", "ABCB"], "answer": 1, "explanation": "Lines 2 and 4 rhyme: talk/chalk; trees/bees.", "hints": ["Which lines rhyme?"]}], "id": "ch05-05-qu2"}, {"type": "quiz", "title": "Poetic devices (III-IV)", "questions": [{"type": "single", "q": "Which is a simile (uses like or as)?", "options": ["A drop of water like hive of bees", "Magic talk", "A forest, flowers and trees", "Silly flies"], "answer": 0, "explanation": "'Like' compares a drop to a hive.", "hints": ["Look for 'like'."]}, {"type": "single", "q": "Which is an example of alliteration?", "options": ["woven web-silk", "silly flies stumble", "magic talk", "tiny thing"], "answer": 0, "explanation": "The w sound repeats.", "hints": ["Repeated first sounds."]}, {"type": "single", "q": "'Of but an inch of moss a forest' is a ______.", "options": ["metaphor", "simile", "pun", "refrain"], "answer": 0, "explanation": "Moss is said to be a forest with no 'like' or 'as'.", "hints": ["No 'like'."]}, {"type": "single", "q": "'A myriad shells show in a scrap of chalk': the glass reveals ______.", "options": ["countless tiny shells hidden in the chalk", "a big shell", "the sea", "a statue"], "answer": 0, "explanation": "Myriad = countless.", "hints": ["Myriad."]}, {"type": "single", "q": "'A forest - flowers and trees': the poet uses nature imagery to emphasise ______.", "options": ["how much a tiny thing can hold", "how big forests are", "how green moss is", "how old chalk is"], "answer": 0, "explanation": "A tiny patch looks like a whole world.", "hints": ["Small to big."]}], "id": "ch05-05-qu3"}, {"type": "exercise", "title": "Reasons for the poet's choices (V)", "difficulty": "medium", "minutes": 10, "goal": "Complete with a reason: (1) The exclamation marks in 'The tigerish claws he has!', 'With all those eyes!' and 'In an afternoon!' because ... (2) 'Magic talk' is personification because ... (3) Each stanza introduces a small object and then its magnified wonder; this supports the theme of ... (4) The last stanza moves to the moon because ...", "checklist": ["Reasons given", "Used the word 'because'"], "solution": "1) ...show the speaker's excitement and wonder.\n2) ...gives the glass a human ability to talk, as if it tells secrets.\n3) ...hidden wonder in everyday things, as the speaker reveals the world close up.\n4) ...lenses in telescopes also magnify distant objects, widening the sense of wonder from tiny to vast.", "solution_lang": "text", "hints": ["Think about feeling, not just facts."], "id": "ch05-05-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["The poem has six quatrains with the rhyme scheme ABCB.", "It uses simile, metaphor, alliteration, imagery and personification.", "Its theme is the wonder revealed by close observation."]}], "terms": [{"term": "quatrain", "def": "a stanza of four lines"}, {"term": "myriad", "def": "countless; a very large number"}], "id": "ch05-05-magnify-poem", "chapter": "ch05", "kind": "lesson", "minutes": 35}, "ch05-06-magnify-reflect": {"title": "Magnifying Glass: think, reflect and word study", "summary": "Answer extract questions, then study vocabulary and listen to a conversation on Indian inventions.", "blocks": [{"type": "text", "md": "**In this lesson:** Answer extract questions, then study vocabulary and listen to a conversation on Indian inventions."}, {"type": "quiz", "title": "Extract: the first stanzas", "questions": [{"type": "truefalse", "q": "The poet uses his magical powers to make the round glass powerful.", "answer": false, "explanation": "Magic is a figure of speech; the glass is powerful because of lenses.", "hints": ["Is the 'magic' real?"]}, {"type": "single", "q": "Which line shows intricate patterns in ordinary objects?", "options": ["A myriad shells show in a scrap of chalk", "With this round glass", "I can make magic talk", "In the afternoon"], "answer": 0, "explanation": "Countless shells inside a chalk piece.", "hints": ["Intricate = detailed."]}, {"type": "single", "q": "What does comparing 'an inch of moss' to a 'forest' show?", "options": ["The speaker sees whole worlds in tiny things.", "The speaker dislikes moss.", "Moss is tall.", "The speaker is lost."], "answer": 0, "explanation": "Magnification turns small things grand.", "hints": ["Small becomes big."]}, {"type": "single", "q": "How does the poet feel about the glass revealing wonders?", "options": ["Satisfied", "Fascinated", "Grateful", "Determined"], "answer": 1, "explanation": "The tone is wonder.", "hints": ["Amazed."]}], "id": "ch05-06-qu1"}, {"type": "exercise", "title": "Long questions 1-5", "difficulty": "medium", "minutes": 12, "goal": "Answer: (1) What is the significance of the spider? (2) How might the speaker's view change without a magnifying glass? (3) Why does the poem end with the moon within reach? (4) What is the speaker's attitude to nature and observation? (5) Which is your favourite part and why?", "checklist": ["Evidence from the poem", "Own opinion in 5"], "solution": "1) The spider shows a hidden, skilful world: only a close look reveals how it spins silk and traps flies.\n2) Without it the speaker would see ordinary chalk, moss and water and miss their wonder.\n3) It extends the idea from tiny objects to distant ones: lenses bring faraway things close.\n4) Respectful, curious and full of wonder.\n5) My favourite is the moss-forest idea because it makes a tiny thing feel like an adventure.", "solution_lang": "text", "hints": ["Link each answer to a line."], "id": "ch05-06-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Vocabulary (Let us learn I)", "questions": [{"type": "fill", "q": "With his ______ description... (marvellous)", "answer": "marvellous", "explanation": "marvellous.", "hints": ["Wonderful."]}, {"type": "fill", "q": "... written beautifully ______ with details.", "answer": "woven", "explanation": "woven.", "hints": ["Like cloth."]}, {"type": "fill", "q": "... the ______ storytelling technique.", "answer": "deft", "explanation": "deft = skilful.", "hints": ["Skilful."]}, {"type": "fill", "q": "... describing the ______ emotions.", "answer": "myriad", "explanation": "myriad = countless.", "hints": ["Countless."]}, {"type": "fill", "q": "The reader will ______ upon unexpected twists.", "answer": "stumble", "explanation": "stumble upon = find by chance.", "hints": ["Find by chance."]}, {"type": "fill", "q": "... twists that ______ all our understanding.", "answer": "surpass", "explanation": "surpass = go beyond.", "hints": ["Exceed."]}], "id": "ch05-06-qu2"}, {"type": "quiz", "title": "Collective nouns (II)", "questions": [{"type": "single", "q": "a swarm of", "options": ["locusts", "ships", "dancers", "stars"], "answer": 0, "explanation": "swarm of locusts.", "hints": ["Insects."]}, {"type": "single", "q": "a constellation of", "options": ["stars", "trees", "soldiers", "ships"], "answer": 0, "explanation": "stars.", "hints": ["Sky."]}, {"type": "single", "q": "a grove of", "options": ["trees", "stars", "ships", "dancers"], "answer": 0, "explanation": "trees.", "hints": ["Small forest."]}, {"type": "single", "q": "a troupe of", "options": ["dancers", "locusts", "trees", "soldiers"], "answer": 0, "explanation": "dancers.", "hints": ["Performers."]}, {"type": "single", "q": "a battalion of", "options": ["soldiers", "ships", "stars", "trees"], "answer": 0, "explanation": "soldiers.", "hints": ["Army."]}, {"type": "single", "q": "a fleet of", "options": ["ships", "dancers", "locusts", "trees"], "answer": 0, "explanation": "ships.", "hints": ["Sea."]}], "id": "ch05-06-qu3"}, {"type": "quiz", "title": "Idioms with 'eye' (III)", "questions": [{"type": "single", "q": "apple of one's eye", "options": ["a person who is very precious", "something quick", "to agree", "to ignore"], "answer": 0, "explanation": "Very dear.", "hints": ["Dear."]}, {"type": "single", "q": "in the blink of an eye", "options": ["very quickly", "closely watching", "overall look", "to ignore"], "answer": 0, "explanation": "Very fast.", "hints": ["Blink."]}, {"type": "single", "q": "keep an eye on", "options": ["watch closely", "agree", "ignore", "praise"], "answer": 0, "explanation": "Watch.", "hints": ["Look after."]}, {"type": "single", "q": "turn a blind eye", "options": ["act as if you do not notice", "watch closely", "agree", "give a view"], "answer": 0, "explanation": "Ignore.", "hints": ["Blind."]}, {"type": "single", "q": "see eye to eye", "options": ["agree with each other", "stare", "overall look", "ignore"], "answer": 0, "explanation": "Agree.", "hints": ["Same view."]}, {"type": "single", "q": "bird's-eye view", "options": ["an overall look at something", "a bird's sight", "to agree", "something quick"], "answer": 0, "explanation": "From above.", "hints": ["Overall."]}], "id": "ch05-06-qu4"}, {"type": "quiz", "title": "The suffix -ish (IV)", "questions": [{"type": "multi", "q": "Which nouns take -ish to make adjectives (like tiger -> tigerish)?", "options": ["girl", "glass", "book", "silk", "boy", "water", "moon", "scrap"], "answer": [0, 2, 4], "explanation": "girlish, bookish, boyish are common. (Glass is glassy and silk is silky.)", "hints": ["Think of 'childish'."]}], "id": "ch05-06-qu5"}, {"type": "read", "title": "Let us listen: lesser-known Indian inventions", "label": "Listen", "md": "A daughter tells her father that people know India gave the world yoga and zero, but there are many more inventions. She says radio broadcasting has roots in India: Jagadish Chandra Bose experimented with microwaves before Marconi. The father says he did not know that and remembers something about fibre optics. She says fibre optics was pioneered by Narinder Kapany, called the father of fibre optics. The father says he uses it every day, and asks about fun things. She names Snakes and Ladders, invented to teach children values, with ladders for virtues and snakes for evil. The father then tells her the USB port was invented by Ajay Bhatt, an Indian-born engineer. Both feel proud and amazed.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: mark the true statements", "questions": [{"type": "multi", "q": "Which statements are true?", "options": ["The father is surprised that India was involved in radio broadcasting and fibre optics.", "The daughter appears indifferent about the USB port.", "The father shows little interest in snakes and ladders.", "The father only confirms the daughter's facts.", "The daughter expresses pride in India's role in global inventions.", "The daughter is excited as she shares new discoveries."], "answer": [0, 4, 5], "explanation": "Statements 1, 5 and 6 match the conversation. The father does share a fact (the USB port) so statement 4 is false. Your textbook asks for four true statements; if your teacher counts a different one, check with them.", "hints": ["Is she indifferent or excited?"]}], "id": "ch05-06-qu6"}, {"type": "summary", "points": ["A swarm of locusts, a grove of trees and a fleet of ships are collective nouns.", "Idioms with 'eye' have meanings that differ from the words.", "Many modern inventions have Indian roots."]}], "terms": [{"term": "collective noun", "def": "a name for a group of things"}], "id": "ch05-06-magnify-reflect", "chapter": "ch05", "kind": "lesson", "minutes": 30}, "ch05-07-magnify-skills": {"title": "Magnifying Glass: speak, write, explore", "summary": "Practise /v/ and /f/, write a conversation, explore telescopes and ancient Indian astronomers.", "blocks": [{"type": "text", "md": "To say **/f/** and **/v/** the lower lip lightly touches the upper teeth. /v/ makes the throat vibrate; /f/ does not."}, {"type": "quiz", "title": "/f/ or /v/?", "questions": [{"type": "single", "q": "Which word has the /v/ sound?", "options": ["vase", "forest", "flowers", "deft"], "answer": 0, "explanation": "vase starts with /v/.", "hints": ["Feel the vibration."]}, {"type": "single", "q": "Which has /f/ in the middle?", "options": ["afternoon", "woven", "even", "marvellous"], "answer": 0, "explanation": "afternoon.", "hints": ["af-ter."]}, {"type": "single", "q": "Which ends with /v/?", "options": ["hive", "of", "itself", "deft"], "answer": 0, "explanation": "hive.", "hints": ["Last sound."]}, {"type": "single", "q": "Which ends with /f/?", "options": ["of", "hive", "woven", "valour"], "answer": 0, "explanation": "of, itself.", "hints": ["Last sound."]}], "id": "ch05-07-qu1"}, {"type": "exercise", "title": "Explore: telescopes and scholars", "difficulty": "easy", "minutes": 8, "goal": "(1) Read about the telescopes at Nainital (ARIES), Hanle (IAO), the James Webb Space Telescope and Mauna Kea. (2) Read about Aryabhata, Varahamihira and Bhaskaracharya II and Jantar Mantar. Share two facts each.", "checklist": ["Gave two facts about telescopes", "Gave two facts about ancient astronomers"], "solution": "Hanle's observatory is at 4,500 m and supports optical, infrared and gamma-ray telescopes. Aryabhata proposed a heliocentric model centuries before Copernicus. Jantar Mantar in New Delhi was built in 1724 by Maharaja Sawai Jai Singh II.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-07-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Explore: low vision aids", "questions": [{"type": "single", "q": "Which aid is used to see signs far away?", "options": ["Telescope", "Magnifying spectacles", "Stand magnifier", "Hand-held magnifier"], "answer": 0, "explanation": "Telescopes see distant objects.", "hints": ["Far away."]}], "id": "ch05-07-qu2"}, {"type": "summary", "points": ["/v/ vibrates; /f/ does not.", "Telescopes also use lenses.", "Indian astronomers made major discoveries long ago."]}], "id": "ch05-07-magnify-skills", "chapter": "ch05", "kind": "lesson", "minutes": 10}, "ch05-08-bibha-story": {"title": "Bibha Chowdhuri: warm-up and the story", "summary": "Learn about India's first woman physicist and check her life story.", "blocks": [{"type": "text", "md": "**In this lesson:** Learn about India's first woman physicist and check her life story."}, {"type": "exercise", "title": "Qualities of a scientist", "difficulty": "easy", "minutes": 8, "goal": "Complete a word web for 'qualities of a scientist' and discuss what you know about women scientists such as those of ISRO's Chandrayaan-3 mission.", "checklist": ["Wrote at least four qualities"], "solution": "curious, patient, hardworking, observant, honest, questioning, determined.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch05-08-ex1", "mode": "selfcheck"}, {"type": "read", "title": "Bibha Chowdhuri (short retelling)", "label": "Read", "md": "Bibha Chowdhuri, born in Kolkata in 1913, was India's first woman physicist. At a time when many Indian women struggled to get an education, she became a scientist and rose in a field full of men.\n\nHer persistence earned her a place at the Bose Institute, where she became the first Indian woman to excel in high-energy particle physics. In 1945 she went to the University of Manchester and studied cosmic rays under Nobel Laureate Patrick Blackett. A newspaper called her 'India's New Woman Scientist' with an eye for cosmic rays.\n\nHer notable contribution was the discovery of pi-mesons, a subatomic particle. Erwin Schrödinger nominated her for the Nobel Prize in 1950. She did not win it and received no awards in her lifetime. In 1949 she became the first woman faculty member at the Tata Institute of Fundamental Research, chosen by Homi J. Bhabha. She also worked at the Physical Research Laboratory in Ahmedabad and the Saha Institute in Kolkata, and at the Kolar Gold Mines. She died in 1991 largely forgotten.\n\nIn 2019 the International Astronomical Union named the star HD 86081 'Bibha', meaning beam of light. In 2020 the Government of India declared a chair professorship in her name. Today women such as Dr. Ritu Karidhal Srivastava lead ISRO missions, and over fifty women contributed to Chandrayaan-3.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Put her life in order", "questions": [{"type": "order", "q": "Arrange the events in the correct order.", "items": ["Bibha Chowdhuri was born in pre-independent India.", "She joined the University of Manchester under Patrick M.S. Blackett.", "She became the first woman faculty member at TIFR.", "She was nominated for a Nobel Prize
