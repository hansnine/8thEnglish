t and principled.\n6) The brush makes dreams real for the poor, so the title is apt.\n7) I would paint clean water, food and books for those who lack them.", "solution_lang": "text", "hints": ["Link to lines of the poem."], "id": "ch03-06-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["Gopi shows courage and keeps her promise.", "The brush symbolises imagination used for good.", "Greed is defeated by cleverness."]}], "id": "ch03-06-brush-reflect", "chapter": "ch03", "kind": "lesson", "minutes": 20}, "ch03-07-brush-language": {"title": "The Magic Brush of Dreams: word study and listening", "summary": "Meanings of 'draw', crossword vocabulary, interjections and a listening activity.", "blocks": [{"type": "text", "md": "**In this lesson:** Meanings of 'draw', crossword vocabulary, interjections and a listening activity."}, {"type": "quiz", "title": "Meanings of 'draw'", "questions": [{"type": "single", "q": "His speech drew loud applause.", "options": ["got a reaction", "attract", "absorb", "moving"], "answer": 0, "explanation": "Got a reaction.", "hints": ["Applause."]}, {"type": "single", "q": "The event will draw huge crowds.", "options": ["attract", "got a reaction", "absorb", "opened"], "answer": 0, "explanation": "Attract.", "hints": ["Crowds."]}, {"type": "single", "q": "Plants draw water from the soil.", "options": ["absorb", "attract", "opened", "pulled out"], "answer": 0, "explanation": "Absorb.", "hints": ["Roots."]}, {"type": "single", "q": "The train was drawing into the station.", "options": ["moving", "absorb", "attract", "opened"], "answer": 0, "explanation": "Moving.", "hints": ["Train."]}, {"type": "single", "q": "She drew the curtains.", "options": ["opened", "pulled out", "moving", "absorb"], "answer": 0, "explanation": "Drew the curtains to let light in: opened.", "hints": ["Light in."]}, {"type": "single", "q": "He drew a piece of paper from the folder.", "options": ["pulled out", "opened", "attract", "absorb"], "answer": 0, "explanation": "Pulled out.", "hints": ["Took out."]}], "id": "ch03-07-qu1"}, {"type": "quiz", "title": "Vocabulary from the poem (crossword clues)", "questions": [{"type": "fill", "q": "the fastest pace of a horse", "answer": "gallop", "explanation": "gallop.", "hints": ["Fast horse."]}, {"type": "fill", "q": "runs away from a place", "answer": "flees", "explanation": "flees.", "hints": ["Escape."]}, {"type": "fill", "q": "speaks very softly", "answer": "whispers", "explanation": "whispers.", "hints": ["Very soft."]}, {"type": "fill", "q": "take hold of something suddenly and forcibly", "answer": "seize", "explanation": "seize.", "hints": ["Grab."]}, {"type": "fill", "q": "having a lot of money", "answer": "wealthy", "explanation": "wealthy.", "hints": ["Rich."]}, {"type": "fill", "q": "a win after overcoming an enemy", "answer": "victory", "explanation": "victory.", "hints": ["Win."]}, {"type": "fill", "q": "a deep loud shout in pain or anger", "answer": "roar", "explanation": "roar.", "hints": ["Loud shout."]}, {"type": "fill", "q": "to act according to rules", "answer": "comply", "explanation": "comply (Gopi: 'I can't comply').", "hints": ["Obey."]}], "id": "ch03-07-qu2"}, {"type": "quiz", "title": "Interjections", "questions": [{"type": "single", "q": "Phew!", "options": ["relief", "pain", "mistake", "delight"], "answer": 0, "explanation": "Relief.", "hints": ["Sigh."]}, {"type": "single", "q": "Eek!", "options": ["alarm", "delight", "relief", "pain"], "answer": 0, "explanation": "Alarm.", "hints": ["Fear."]}, {"type": "single", "q": "Ouch!", "options": ["pain", "surprise", "delight", "mistake"], "answer": 0, "explanation": "Pain.", "hints": ["Hurt."]}, {"type": "single", "q": "Yippee!", "options": ["delight", "pain", "alarm", "mistake"], "answer": 0, "explanation": "Delight.", "hints": ["Joy."]}, {"type": "single", "q": "Whoa!", "options": ["surprise", "pain", "relief", "mistake"], "answer": 0, "explanation": "Surprise.", "hints": ["Stop and wonder."]}, {"type": "single", "q": "Oops!", "options": ["mistake", "alarm", "pain", "delight"], "answer": 0, "explanation": "Mistake.", "hints": ["Slip."]}, {"type": "single", "q": "Hey!", "options": ["attract attention", "mistake", "relief", "pain"], "answer": 0, "explanation": "Attract attention.", "hints": ["Call."]}], "id": "ch03-07-qu3"}, {"type": "exercise", "title": "Sentences with interjections", "difficulty": "easy", "minutes": 8, "goal": "Create sentences with any five expressions: Phew, Eek, Ouch, Yippee, Whoa, Oops, Hey.", "checklist": ["Used five", "Each fits its feeling"], "solution": "Phew! I finished the exam. Eek! A spider! Ouch! I pinched my finger. Yippee! We won! Oops! I spilled the milk.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-07-ex1", "mode": "selfcheck"}, {"type": "read", "title": "Let us listen: five magical wishes", "label": "Listen", "md": "Speaker one would like to predict the future, to see profits and losses before time, make better savings and help others make wise money decisions. Speaker two wants to learn instantly and remember everything, so exams would be easy and there would be time for cricket. Speaker three wants to fly, see the world from above and travel without using any transport. Speaker four, who is older, wants the power to heal aches and pains, and to heal family and others too. Speaker five wants to control the weather so that crops always get the right amount of rain and sunshine.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Match speaker and wish", "questions": [{"type": "single", "q": "Speaker 1 wants ______.", "options": ["power to predict the future (to make wise business decisions)", "power of healing", "power to remember quickly", "power to control the weather"], "answer": 0, "explanation": "He mentions profits and savings.", "hints": ["Business."]}, {"type": "single", "q": "Speaker 2 wants ______.", "options": ["the ability to remember information quickly", "power of healing", "ability to end poverty", "power to fly"], "answer": 0, "explanation": "Learn instantly.", "hints": ["Exams."]}, {"type": "single", "q": "Speaker 3 wants ______.", "options": ["power to move around without using vehicles", "power of healing", "control weather", "end poverty"], "answer": 0, "explanation": "Flying.", "hints": ["No transport."]}, {"type": "single", "q": "Speaker 4 wants ______.", "options": ["power of healing ailments", "to remember", "to fly", "weather"], "answer": 0, "explanation": "Heal aches.", "hints": ["Pain."]}, {"type": "single", "q": "Speaker 5 wants ______.", "options": ["power to control the weather as per need", "to heal", "to fly", "to predict"], "answer": 0, "explanation": "Weather for crops.", "hints": ["Rain."]}], "id": "ch03-07-qu4"}, {"type": "summary", "points": ["'Draw' has many meanings: attract, absorb, open, pull out.", "Interjections show sudden feelings: Phew, Ouch, Oops.", "The five speakers wished for prediction, memory, flying, healing and weather control."]}], "id": "ch03-07-brush-language", "chapter": "ch03", "kind": "lesson", "minutes": 30}, "ch03-08-brush-skills": {"title": "The Magic Brush of Dreams: speak, write, explore", "summary": "Practise falling tone and requests, write an imaginative essay and explore riddles.", "blocks": [{"type": "text", "md": "The **falling tone** is used for commands and warnings: *Come here!* *Paint my fortress tall!* Requests can be formal (to a teacher) or informal (to a sibling)."}, {"type": "quiz", "title": "Formal or informal?", "questions": [{"type": "single", "q": "'Would you mind if I organised a class picnic?'", "options": ["Formal", "Informal"], "answer": 0, "explanation": "Would you mind if... is formal.", "hints": ["To a teacher."]}, {"type": "single", "q": "'Can you help me finish my project?'", "options": ["Informal", "Formal"], "answer": 0, "explanation": "Can/Will you is informal.", "hints": ["To a sibling."]}, {"type": "single", "q": "'Do you think you could include me in the inter-school event?'", "options": ["Formal", "Informal"], "answer": 0, "explanation": "Formal.", "hints": ["To the in-charge."]}, {"type": "single", "q": "'I was wondering if you could enrol me in a dance class.'", "options": ["Informal", "Formal"], "answer": 0, "explanation": "Said to a mother: informal.", "hints": ["Family."]}], "id": "ch03-08-qu1"}, {"type": "exercise", "title": "Make requests", "difficulty": "easy", "minutes": 8, "goal": "In pairs make formal requests (class picnic; extra sports period; inclusion in an event) and informal requests (help with a project; enrol in dance; cousin to spend the weekend).", "checklist": ["Formal phrases used", "Informal phrases used"], "solution": "Formal: 'Would it be possible to organise a class picnic, ma'am?' Informal: 'Can you help me with my project, please?'", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-08-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Imaginative essay checklist", "questions": [{"type": "multi", "q": "What does an imaginative essay include?", "options": ["Relevant title", "Captivating opening", "Description of setting", "Sensory details and similes", "Only facts", "Turning point and a takeaway message", "Reflective conclusion"], "answer": [0, 1, 2, 3, 5, 6], "explanation": "It uses imagination but still has a clear structure and a message.", "hints": ["Creative but organised."]}], "id": "ch03-08-qu2"}, {"type": "exercise", "title": "Write an imaginative essay", "difficulty": "medium", "minutes": 25, "goal": "Write on ONE topic: (1) You were a scarf that flew from a clothesline: places you travelled to, how you returned, the most valuable experience. (2) You found a magical book in the library that took you to a different time: your experience and learning.", "checklist": ["Title", "Captivating opening", "Setting and characters", "Turning point", "Takeaway message", "Sensory details"], "solution": "The Scarf that Flew\nOne windy morning I slipped from the clothesline and floated over rooftops. I saw a market full of colours, a river with boats... A little girl caught me and wore me. Later she returned me home. I learnt that the best journeys are those that bring us home again.", "solution_lang": "text", "hints": ["Describe what you see, hear, smell."], "id": "ch03-08-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Explore: riddles", "questions": [{"type": "single", "q": "I can fill a room but take up no space; often heard but never seen.", "options": ["sound", "air", "light", "smell"], "answer": 0, "explanation": "Sound.", "hints": ["Heard."]}, {"type": "single", "q": "The more you take, the more you leave behind.", "options": ["footsteps", "air", "money", "water"], "answer": 0, "explanation": "Footsteps.", "hints": ["Walking."]}, {"type": "single", "q": "I have cities but no houses, forests but no trees.", "options": ["a map", "a book", "a dream", "a painting"], "answer": 0, "explanation": "A map.", "hints": ["Paper."]}, {"type": "single", "q": "I'm tall when I'm young and short when I'm old.", "options": ["a candle", "a tree", "a pencil", "a person"], "answer": 0, "explanation": "A candle.", "hints": ["Light."]}], "id": "ch03-08-qu3"}, {"type": "exercise", "title": "Explore: P. C. Sorcar and your magical object", "difficulty": "easy", "minutes": 8, "goal": "(1) Find out about magician P. C. Sorcar Sr. (Padma Shri, 26 January 1964). (2) Draw a magical object with its special quality and put it on the display board.", "checklist": ["Drew the object", "Wrote its special quality"], "solution": "A pencil that writes the right answers on its own, with a rule: it only works if I have studied.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-08-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Use a falling tone for commands.", "An imaginative essay uses sensory details and a clear message.", "Riddles are word tricks."]}], "id": "ch03-08-brush-skills", "chapter": "ch03", "kind": "lesson", "minutes": 50}, "ch03-09-wonders-read": {"title": "Spectacular Wonders: warm-up and the text", "summary": "Sort wonders, hear about seven of India's natural wonders and complete the table.", "blocks": [{"type": "text", "md": "**In this lesson:** Sort wonders, hear about seven of India's natural wonders and complete the table."}, {"type": "exercise", "title": "Natural or man-made?", "difficulty": "easy", "minutes": 8, "goal": "Sort the pictured wonders into natural and man-made. Which are more appealing and why? Name two wonders of nature that amazed you and complete a web chart for 'Nature's Power'.", "checklist": ["Sorted correctly", "Gave reasons", "At least five words in the web"], "solution": "Natural: Grand Canyon, waterfalls. Man-made: Taj Mahal, Great Wall. Nature's Power: storms, volcano, tsunami, earthquake, rain, waterfalls, floods.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-09-ex1", "mode": "selfcheck"}, {"type": "read", "title": "Spectacular Wonders (short retelling)", "label": "Read", "md": "India has many mystifying natural wonders.\n\nThe Valley of Flowers in Chamoli district, Uttarakhand, has around 600 species of exotic flowers such as orchids, poppies, primulas and daisies, between May and October. It is home to rare animals like the snow leopard and is a UNESCO World Heritage Site.\n\nThe Living Root Bridges of Meghalaya are made by the indigenous people from intertwined living roots. Bamboo and wooden bridges did not last the monsoon. These bridges can last hundreds of years, rise fifty to a hundred feet and the longest is about 175 feet.\n\nThe Lonar Crater Lake in Buldhana district, Maharashtra, was formed when a huge meteorite crashed to Earth. It is the only crater in India formed in basalt by a meteorite and a rare saline lake lies at its core.\n\nThe Magnetic Hill near Leh, Ladakh, is an optical illusion: when you park in the marked box on the road, vehicles appear to roll uphill at about 20 km per hour.\n\nThe Glowing Waters of Kumbalangi, Kerala, glow at night due to bioluminescence caused by micro-plankton, making it an eco-tourism village.\n\nThe Sundarbans in West Bengal is a mangrove forest of 1,400 km in the river delta, named after sundari trees. It has Bengal tigers, estuarine crocodiles and pythons.\n\nChandipur Beach in Balasore district, Odisha, plays hide-and-seek: the sea retreats and the beach appears.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Complete the table", "questions": [{"type": "single", "q": "The Living Root Bridges are in ______.", "options": ["Meghalaya", "Kerala", "Ladakh", "Odisha"], "answer": 0, "explanation": "Made by indigenous people.", "hints": ["Northeast."]}, {"type": "single", "q": "Lonar Crater Lake: Buldhana district, ______.", "options": ["Maharashtra", "Odisha", "Kerala", "Uttarakhand"], "answer": 0, "explanation": "Maharashtra.", "hints": ["Meteorite."]}, {"type": "single", "q": "Magnetic Hills: location ______.", "options": ["Leh district, Ladakh", "Kochi", "Chamoli", "Balasore"], "answer": 0, "explanation": "Ladakh.", "hints": ["Cold desert."]}, {"type": "single", "q": "Glowing Waters: Kumbalangi village in ______.", "options": ["Kerala", "West Bengal", "Odisha", "Ladakh"], "answer": 0, "explanation": "Kerala.", "hints": ["Backwaters."]}, {"type": "single", "q": "The Sundarbans is in ______.", "options": ["West Bengal", "Odisha", "Kerala", "Assam"], "answer": 0, "explanation": "Mangroves and tigers.", "hints": ["Delta."]}, {"type": "single", "q": "Chandipur Beach is in Balasore district, ______.", "options": ["Odisha", "Kerala", "Ladakh", "West Bengal"], "answer": 0, "explanation": "Odisha.", "hints": ["Disappearing sea."]}, {"type": "single", "q": "Unique feature of the Sundarbans:", "options": ["a 1,400 km mangrove forest with Bengal tigers", "a disappearing sea", "glowing water", "a magnetic road"], "answer": 0, "explanation": "Mangroves.", "hints": ["Tigers."]}, {"type": "single", "q": "Unique feature of Chandipur Beach:", "options": ["the sea retreats and seems to disappear", "meteorite", "roots", "flowers"], "answer": 0, "explanation": "Tides retreat.", "hints": ["Hide-and-seek."]}], "id": "ch03-09-qu1"}, {"type": "summary", "points": ["Seven wonders: Valley of Flowers, Living Root Bridges, Lonar Crater, Magnetic Hills, Glowing Waters, Sundarbans and Chandipur Beach.", "Bioluminescence = light made by living organisms.", "The Magnetic Hill is an optical illusion."]}], "terms": [{"term": "bioluminescence", "def": "light produced by a living organism"}, {"term": "optical illusion", "def": "something that tricks your eyes"}], "id": "ch03-09-wonders-read", "chapter": "ch03", "kind": "lesson", "minutes": 15}, "ch03-10-wonders-reflect": {"title": "Spectacular Wonders: think and reflect", "summary": "Extracts and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Extracts and long questions."}, {"type": "quiz", "title": "Extract 1: the opening", "questions": [{"type": "fill", "q": "Replace the phrase: 'India is the birthplace of rare flora and fauna that thrive...' Use a phrase from the extract for 'birthplace': ______", "answer": ["home to"], "explanation": "India is home to...", "hints": ["Two words."]}, {"type": "single", "q": "'Nature's unusual side' suggests the phenomena ______.", "options": ["are strange and surprising", "are ordinary", "are man-made", "are dangerous"], "answer": 0, "explanation": "Unusual = strange.", "hints": ["Not usual."]}, {"type": "single", "q": "spark : imagination :: ______ : ______", "options": ["inspiration; creativity", "wonder; amazement", "effort; reward", "knowledge; books"], "answer": 0, "explanation": "Spark leads to imagination, as inspiration leads to creativity.", "hints": ["Cause leads to result."]}, {"type": "truefalse", "q": "Some natural phenomena can surprise people.", "answer": true, "explanation": "Yes.", "hints": ["Mystifying."]}], "id": "ch03-10-qu1"}, {"type": "quiz", "title": "Extract 2: Chandipur Beach", "questions": [{"type": "single", "q": "The writer begins with a question to ______.", "options": ["engage the reader's curiosity and create suspense", "confuse", "test", "end the text"], "answer": 0, "explanation": "A question hooks the reader.", "hints": ["Hook."]}, {"type": "single", "q": "(A) Chandipur Beach is known for its disappearing sea. (R) The tides retreat drastically.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "A false, R true"], "answer": 0, "explanation": "The sea seems to vanish because the tide retreats.", "hints": ["Cause."]}, {"type": "single", "q": "'Unique' suggests ______.", "options": ["one of its kind", "very popular", "ancient", "far from city"], "answer": 0, "explanation": "One of its kind.", "hints": ["Only one."]}], "id": "ch03-10-qu2"}, {"type": "reveal", "prompt": "What does 'playing hide-and-seek with its visitors' convey?", "md": "The sea hides and returns, like a child in a game, which makes the place playful and mysterious."}, {"type": "exercise", "title": "Long questions 1-5", "difficulty": "medium", "minutes": 12, "goal": "Answer: (1) How are living root bridges a boon for the local people? (2) Why is Lonar Crater Lake remarkable and rare? (3) What might be the writer's purpose? (4) What impact do descriptive language and introductory questions have? (5) Which phenomenon interested you most and why?", "checklist": ["Evidence", "Own choice for 5"], "solution": "1) They are an innovative solution for crossing rivers in the monsoon, last hundreds of years, need no cement and are part of local culture.\n2) It was formed by a meteorite in basalt, the only such crater in India, with a saline lake at its core.\n3) To make readers appreciate and want to visit India's natural wonders and protect them.\n4) They create curiosity and pictures in the mind.\n5) I liked the glowing waters because nature lights up the night.", "solution_lang": "text", "hints": ["Quote a detail."], "id": "ch03-10-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["The writer uses questions to hook readers.", "Lonar Crater Lake and living bridges are rare and remarkable.", "Unique means one of its kind."]}], "id": "ch03-10-wonders-reflect", "chapter": "ch03", "kind": "lesson", "minutes": 20}, "ch03-11-wonders-language": {"title": "Spectacular Wonders: language practice", "summary": "Expressions, synonyms, binomials, participles and gerunds.", "blocks": [{"type": "text", "md": "**In this lesson:** Expressions, synonyms, binomials, participles and gerunds."}, {"type": "quiz", "title": "Expressions (I)", "questions": [{"type": "fill", "q": "I have read many stories ______. (came into existence/to no end/in full glory/in disbelief/to name a few/age-old problem)", "answer": "to name a few", "explanation": "to name a few.", "hints": ["Examples."]}, {"type": "fill", "q": "Do you know when this little town ______?", "answer": "came into existence", "explanation": "came into existence.", "hints": ["Began."]}, {"type": "fill", "q": "His hard work has helped him ______.", "answer": "to no end", "explanation": "to no end = endlessly.", "hints": ["A lot."]}, {"type": "fill", "q": "There are no simple solutions to the ______ of traffic jams.", "answer": "age-old problem", "explanation": "age-old problem.", "hints": ["Very old."]}, {"type": "fill", "q": "He stared at the treasure ______.", "answer": "in disbelief", "explanation": "in disbelief.", "hints": ["Not believing."]}, {"type": "fill", "q": "The garden is ______ in spring.", "answer": "in full glory", "explanation": "in full glory.", "hints": ["At its best."]}], "id": "ch03-11-qu1"}, {"type": "quiz", "title": "Synonyms (II)", "questions": [{"type": "single", "q": "mysterious, puzzling, baffling", "options": ["enigmatic", "colossal", "exotic", "serene", "spectacular"], "answer": 0, "explanation": "enigmatic.", "hints": ["Puzzling."]}, {"type": "single", "q": "mighty, gigantic, huge", "options": ["colossal", "exotic", "serene", "enigmatic", "spectacular"], "answer": 0, "explanation": "colossal.", "hints": ["Huge."]}, {"type": "single", "q": "breath-taking, stunning, awe-inspiring", "options": ["spectacular", "colossal", "exotic", "serene", "enigmatic"], "answer": 0, "explanation": "spectacular.", "hints": ["Stunning."]}, {"type": "single", "q": "peaceful, calm, tranquil", "options": ["serene", "colossal", "exotic", "spectacular", "enigmatic"], "answer": 0, "explanation": "serene.", "hints": ["Calm."]}, {"type": "single", "q": "unusual, peculiar, foreign", "options": ["exotic", "colossal", "serene", "enigmatic", "spectacular"], "answer": 0, "explanation": "exotic.", "hints": ["Uncommon."]}], "id": "ch03-11-qu2"}, {"type": "quiz", "title": "Binomials (III)", "questions": [{"type": "single", "q": "odds and ends", "options": ["small, unimportant things", "sometimes", "at some future time", "complete part of"], "answer": 0, "explanation": "Small things.", "hints": ["Leftovers."]}, {"type": "single", "q": "on and off", "options": ["sometimes, occasionally", "all or nothing", "increase quickly", "put things together"], "answer": 0, "explanation": "Occasionally.", "hints": ["Not always."]}, {"type": "single", "q": "mix and match", "options": ["put different things together to get a range of possibilities", "choose only the best", "at some time", "very quickly"], "answer": 0, "explanation": "Combine.", "hints": ["Mix."]}, {"type": "single", "q": "all or nothing", "options": ["something to be done completely or not at all", "sometimes", "small things", "increase quickly"], "answer": 0, "explanation": "Completely.", "hints": ["All."]}, {"type": "single", "q": "part and parcel", "options": ["complete part of or belong to", "choose the best", "sometimes", "small things"], "answer": 0, "explanation": "An essential part.", "hints": ["Part."]}, {"type": "single", "q": "pick and choose", "options": ["choose only the best", "sometimes", "small things", "at some time"], "answer": 0, "explanation": "Selective.", "hints": ["Choose."]}, {"type": "single", "q": "sooner or later", "options": ["at some time in the future", "sometimes", "complete part", "increase quickly"], "answer": 0, "explanation": "Eventually.", "hints": ["Future."]}, {"type": "single", "q": "leaps and bounds", "options": ["increase or develop very quickly", "sometimes", "small things", "choose best"], "answer": 0, "explanation": "Rapid.", "hints": ["Jumps."]}], "id": "ch03-11-qu3"}, {"type": "exercise", "title": "Use binomials in sentences", "difficulty": "easy", "minutes": 8, "goal": "Write sentences with five binomials from the list.", "checklist": ["Five sentences", "Correct meaning"], "solution": "Sooner or later we all need to learn to swim. Her English improved by leaps and bounds. I find odds and ends in my bag. Rain is part and parcel of the monsoon. We meet on and off.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-11-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Participles (IV)", "questions": [{"type": "fill", "q": "The ______ marble monument looks spectacular in the moonlight. (glow)", "answer": "glowing", "explanation": "present participle.", "hints": ["-ing."]}, {"type": "fill", "q": "The ______ view of the Himalayas attracts visitors. (amaze)", "answer": "amazing", "explanation": "amazing.", "hints": ["-ing."]}, {"type": "fill", "q": "The Sun Temple has intricately ______ stone wheels. (carve)", "answer": "carved", "explanation": "past participle.", "hints": ["-ed."]}, {"type": "fill", "q": "______ at a height of 182 m, the Statue of Unity... (stand)", "answer": "Standing", "explanation": "Standing.", "hints": ["-ing."]}, {"type": "fill", "q": "The ______ islands of the Andaman offer clean beaches. (scatter)", "answer": "scattered", "explanation": "scattered.", "hints": ["-ed."]}], "id": "ch03-11-qu4"}, {"type": "quiz", "title": "Gerund (G) or participle (P)?", "questions": [{"type": "single", "q": "Dancing is a great way to express emotions.", "options": ["G", "P"], "answer": 0, "explanation": "Dancing = subject (noun).", "hints": ["Noun."]}, {"type": "single", "q": "Travelling can broaden your perspective.", "options": ["G", "P"], "answer": 0, "explanation": "Noun.", "hints": ["Subject."]}, {"type": "single", "q": "The falling leaves signalled autumn.", "options": ["P", "G"], "answer": 0, "explanation": "Falling describes leaves.", "hints": ["Adjective."]}, {"type": "single", "q": "She enjoys cooking new recipes.", "options": ["G", "P"], "answer": 0, "explanation": "Object of enjoys.", "hints": ["Noun."]}, {"type": "single", "q": "Reading helps improve your vocabulary.", "options": ["G", "P"], "answer": 0, "explanation": "Subject.", "hints": ["Noun."]}, {"type": "single", "q": "He watched the shimmering stars.", "options": ["P", "G"], "answer": 0, "explanation": "Describes stars.", "hints": ["Adjective."]}, {"type": "single", "q": "Forgetting the keys inside, Kanchan locked the door.", "options": ["P", "G"], "answer": 0, "explanation": "Participle phrase.", "hints": ["Describes Kanchan."]}], "id": "ch03-11-qu5"}, {"type": "exercise", "title": "Combine with participles or gerunds (VI)", "difficulty": "easy", "minutes": 8, "goal": "(2) Smitha walked carelessly. She slipped on the doormat. (participle) (3) Sleep for eight hours. It is good for health. (gerund) (4) Ranjith felt happy about the result. He called his parents. (participle) (5) Father encouraged Meena. Meena joined the course. (gerund)", "checklist": ["Used -ing/-ed forms correctly"], "solution": "2) Walking carelessly, Smitha slipped on the doormat.\n3) Sleeping for eight hours is good for health.\n4) Feeling happy about the result, Ranjith called his parents.\n5) Father's encouraging Meena made her join the course.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-11-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Participles act as adjectives; gerunds act as nouns.", "Binomials are fixed pairs: odds and ends, sooner or later.", "Enigmatic, colossal, serene, exotic, spectacular are strong describing words."]}], "id": "ch03-11-wonders-language", "chapter": "ch03", "kind": "lesson", "minutes": 40}, "ch03-12-wonders-skills": {"title": "Spectacular Wonders: listen, speak, write, explore", "summary": "Listen to a conversation on Rainbow Mountain, make a presentation, write a descriptive essay.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to a conversation on Rainbow Mountain, make a presentation, write a descriptive essay."}, {"type": "read", "title": "Let us listen: Rainbow Mountain", "label": "Listen", "md": "A brother and sister talk about pictures their uncle posted from Peru. Both say the Rainbow Mountain was their favourite, and the brother admits he did not know it was hers too. They admire nature's creativity. She asks if he knows how it is formed. He says the colours come from layers of minerals such as clay, limestone and sandstone deposited millions of years ago. She says each colour comes from a different mineral, the green from copper and the red from clay. He is surprised that the mountain was buried under snow until recently. She says the melting snow made it visible. He says water from ancient seas and lakes deposited the layers, and she adds that each colour represents a different time in history.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: mark the four true statements", "questions": [{"type": "multi", "q": "Choose the TRUE statements.", "options": ["The brother was taken aback to see the posted pictures.", "The brother admitted to not knowing about his sister's favourite picture.", "The sister said the rainbow mountain was like any other mountain.", "The brother was aware of the reason for the formation of colours.", "The brother was surprised to learn about the mountain being covered with snow till recently.", "The sister understood nature's role in the beauty of the mountain."], "answer": [1, 3, 4, 5], "explanation": "Statements 2, 4, 5 and 6 are true.", "hints": ["Re-read who said what."]}], "id": "ch03-12-qu1"}, {"type": "exercise", "title": "Presentation: a place of interest", "difficulty": "easy", "minutes": 8, "goal": "In a group of four make a 10-slide presentation on a place people like to visit in your region: slides 1-2 choose the place; 3-4 location and how to reach; 5-6 attractions and history; 7-8 weather, food, customs, language; 9-10 best time to visit and why.", "checklist": ["Followed the slide plan", "Spoke clearly"], "solution": "Place: Hampi. Location: Karnataka, near Hospet. Attractions: Virupaksha Temple, Stone Chariot. Best time: October to February.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-12-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a descriptive essay", "difficulty": "medium", "minutes": 20, "goal": "Write a descriptive essay for the school magazine about something in nature that attracted you (a place, an object or an event). Include a title, an introduction, two or three body paragraphs and a conclusion.", "checklist": ["Title", "Introduction", "2-3 body paragraphs with sensory details", "Conclusion"], "solution": "Monsoon on the Hill\nThe first drops of the monsoon fell on the hill behind my house... I could smell the wet earth... Waterfalls appeared... I stood amazed. Nature's power is beautiful.", "solution_lang": "text", "hints": ["Use all five senses."], "id": "ch03-12-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore: man-made wonders", "difficulty": "easy", "minutes": 8, "goal": "Read the man-made wonders in the book (Kallanai Dam by the Chola King Karikala around 150 CE, and others) and share one with the class.", "checklist": ["Named one wonder", "Gave one fact"], "solution": "Kallanai Dam (the Grand Anaicut) in Tamil Nadu is one of the world's oldest dams still in use. It was built by the Chola king Karikala around 150 CE.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-12-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["A presentation follows a slide plan.", "A descriptive essay uses the senses.", "Rainbow Mountain's colours come from mineral layers."]}], "id": "ch03-12-wonders-skills", "chapter": "ch03", "kind": "lesson", "minutes": 40}, "ch03-99-test": {"title": "Test: Unit 3: Mystery and Magic", "summary": "Check what you have learnt in Unit 3.", "blocks": [{"type": "quiz", "title": "Unit 3 test", "questions": [{"type": "single", "q": "Encyclopedia's code Nom Utes Sweden Hurts stands for ______.", "options": ["Monday to Thursday without 'day'", "four cities", "four names", "four tribes"], "answer": 0, "explanation": "Days of the week.", "hints": ["Drop 'day'."]}, {"type": "single", "q": "The fifth word is ______.", "options": ["Fir (Friday)", "Sun", "Rock", "Nom"], "answer": 0, "explanation": "Fir = Friday.", "hints": ["Fir tree."]}, {"type": "single", "q": "Reported: 'Did you see the thief?' he asked.", "options": ["He asked if I had seen the thief.", "He asked did I see the thief.", "He asked that I saw.", "He asked who I saw."], "answer": 0, "explanation": "if + past perfect.", "hints": ["Yes/no."]}, {"type": "single", "q": "'Spoonerism' means ______.", "options": ["swapping initial sounds of words", "a long spoon", "a kind of riddle", "a poem"], "answer": 0, "explanation": "Swapping sounds.", "hints": ["Slip of the tongue."]}, {"type": "single", "q": "The Zamindar represents ______.", "options": ["greed", "kindness", "art", "wisdom"], "answer": 0, "explanation": "He wants wealth and power.", "hints": ["Greed."]}, {"type": "single", "q": "The magic brush symbolises ______.", "options": ["the power of art and imagination", "greed", "barriers", "fear"], "answer": 0, "explanation": "Imagination.", "hints": ["Art."]}, {"type": "single", "q": "'Eek!' expresses ______.", "options": ["alarm", "relief", "delight", "pain"], "answer": 0, "explanation": "Alarm.", "hints": ["Fright."]}, {"type": "single", "q": "'Phew!' expresses ______.", "options": ["relief", "alarm", "pain", "delight"], "answer": 0, "explanation": "Relief.", "hints": ["Sigh."]}, {"type": "single", "q": "Lonar Crater Lake was formed by ______.", "options": ["a meteorite impact", "a volcano", "a river", "an earthquake"], "answer": 0, "explanation": "Meteorite.", "hints": ["Space rock."]}, {"type": "single", "q": "The glowing waters of Kumbalangi are caused by ______.", "options": ["bioluminescence", "gas", "oil", "moonlight"], "answer": 0, "explanation": "Living organisms.", "hints": ["Plankton."]}, {"type": "single", "q": "'Dancing is fun.' Dancing is a ______.", "options": ["gerund", "participle"], "answer": 0, "explanation": "Noun use.", "hints": ["Subject."]}, {"type": "single", "q": "'The falling leaves' - falling is a ______.", "options": ["participle", "gerund"], "answer": 0, "explanation": "Adjective use.", "hints": ["Describes leaves."]}], "id": "ch03-99-qu1", "pass_score": 0.7, "mode": "test"}], "kind": "test", "id": "ch03-99-test", "chapter": "ch03", "minutes": 10}, "ch04-01-cherry-story": {"title": "The Cherry Tree: warm-up and the story", "summary": "Talk about growing plants, hear Ruskin Bond's story and put the events in order.", "blocks": [{"type": "text", "md": "**In this lesson:** Talk about growing plants, hear Ruskin Bond's story and put the events in order."}, {"type": "exercise", "title": "Before we read", "difficulty": "easy", "minutes": 8, "goal": "Pairs: (1) Have you grown a plant from a seed or sapling? (2) What care did it need and who helped? (3) How did you feel when it grew? Then: What trees do people plant at home and why is planting trees important? Name fruit trees in your region and the conditions they need.", "checklist": ["Answered all", "Named three fruit trees"], "solution": "I grew a tulsi plant with my mother's help. It needed water and sunlight. I felt proud. Trees give oxygen, shade, fruit and prevent soil erosion. Mango, guava and coconut grow in warm, rainy areas.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-01-ex1", "mode": "selfcheck"}, {"type": "read", "title": "The Cherry Tree, part I and II (short retelling)", "label": "Read", "md": "When Rakesh was six, he walked home from the Mussoorie bazaar eating sweet-sour cherries from Kashmir. He lived with his grandfather in a small cottage at the edge of the forest, because there was no school in his parents' village fifty miles away, where they grew maize, rice and barley on terraced fields.\n\nHe offered one cherry to his grandfather and ate the other two. He rolled the last seed in his mouth and asked if cherry seeds are lucky. Grandfather said nothing is lucky if you put it away; put it to use and plant it. Rakesh pressed the seed into soft soil in a shady corner and soon forgot about it.\n\nIn winter Grandfather told stories while Rakesh read him the newspaper. When wild ducks flew north in spring, Rakesh found a tiny rooted twig: the cherry tree had come up. He watered it and ringed it with pebbles 'for privacy'. In the monsoon it grew fast, until a goat ate all its leaves. Grandfather said cherry trees are tough.\n\nLater a woman cutting grass cut the tree in half with her scythe. Grandfather scolded her, but the tree sent out new shoots by summer. Rakesh went home to help his parents with the planting and ploughing, and came back thinner but stronger to find the tree a foot taller. A green praying mantis became its first visitor. A hairy caterpillar was moved to a heap of dry leaves with the words 'Come back when you're a butterfly.' Winter snow bent the tree low and made Grandfather grumpy, with unhappy endings in his stories.\n\nIn February, on Rakesh's ninth birthday, the four-year-old tree bore its first pale pink blossom. The next year it had more blossoms, then small sour cherries which the birds enjoyed. One warm afternoon Grandfather rested under it in a cane chair. That evening Rakesh asked why this tree was so special among so many. Grandfather said, 'We planted it ourselves.' Rakesh touched its bark and whispered, 'Is this what it feels to be God?'", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Order the events", "questions": [{"type": "order", "q": "Arrange the events of the story.", "items": ["Rakesh's parents grew maize, rice and barley in a village.", "Rakesh was sent to live with his grandfather in Mussoorie.", "Rakesh bought a bunch of cherries and ate most of them.", "Rakesh kept rolling the last cherry seed in his mouth.", "Rakesh pressed the cherry seed into the soft soil with his thumb.", "Rakesh discovered that the small, well-rooted twig had grown into a cherry tree.", "Rakesh sprinkled water on the cherry tree and surrounded it with pebbles.", "The cherry tree grew quickly after the rains arrived early.", "A goat entered the garden and ate all the leaves of the young cherry tree.", "Grandfather told Rakesh that cherry trees were tough."], "explanation": "Follow the story.", "hints": ["Parents' village first."]}], "id": "ch04-01-qu1"}, {"type": "exercise", "title": "Will the cherry tree survive?", "difficulty": "easy", "minutes": 8, "goal": "After the goat episode, do you think the tree would survive? Why?", "checklist": ["Gave a yes/no", "Gave a reason"], "solution": "Yes. Grandfather says cherry trees are tough, and the main stem and two branches remain, so it can sprout again.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-01-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Cause and effect (part II)", "questions": [{"type": "single", "q": "Cause: A woman cut the cherry tree while cutting grass. Effect: ______.", "options": ["Grandfather scolded the woman.", "Rakesh left home.", "The goat came.", "It snowed."], "answer": 0, "explanation": "Given example.", "hints": ["He was upset."]}, {"type": "single", "q": "Cause: ______. Effect: Rakesh was thinner but stronger when he came back.", "options": ["Rakesh went home to the village to help with planting, ploughing and sowing", "He was ill", "He studied hard", "He ran away"], "answer": 0, "explanation": "Farm work made him thinner and stronger.", "hints": ["Village work."]}, {"type": "single", "q": "Cause: A hairy caterpillar started eating the leaves. Effect: ______.", "options": ["Rakesh removed it and dropped it on dry leaves.", "Rakesh killed it.", "Grandfather cut the tree.", "The tree died."], "answer": 0, "explanation": "He saved the leaves gently.", "hints": ["He was kind."]}, {"type": "single", "q": "Cause: ______. Effect: Rakesh and Grandfather gazed at the tree as though it was a miracle.", "options": ["A pale pink blossom appeared on a branch", "The tree grew taller than Grandfather", "It snowed", "A bird sat on it"], "answer": 0, "explanation": "The first blossom.", "hints": ["February."]}, {"type": "single", "q": "Cause: Rakesh tasted one of the small cherries in summer. Effect: ______.", "options": ["He spat it out because it was too sour.", "He ate all of them.", "He planted more.", "He gave them to birds."], "answer": 0, "explanation": "'It's too sour'.", "hints": ["Taste."]}], "id": "ch04-01-qu2"}, {"type": "summary", "points": ["Rakesh grew a cherry tree from a seed with Grandfather's advice.", "The tree survived a goat, a scythe and snow because it was tough.", "Planting it themselves made the tree special."]}], "terms": [{"term": "sapling", "def": "a young tree"}, {"term": "scythe", "def": "a tool with a long curved blade for cutting grass"}], "id": "ch04-01-cherry-story", "chapter": "ch04", "kind": "lesson", "minutes": 25}, "ch04-02-cherry-reflect": {"title": "The Cherry Tree: think and reflect", "summary": "Extract questions and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Extract questions and long questions."}, {"type": "quiz", "title": "Extract 1: the seed", "questions": [{"type": "fill", "q": "Replace 'quickly and without delay' with a word from the extract:", "answer": "promptly", "explanation": "Rakesh 'promptly' ate the other two.", "hints": ["Starts with p."]}, {"type": "single", "q": "Rolling the seed in his mouth suggests Rakesh was ______.", "options": ["feeling impatient and restless", "enjoying the taste and the moment", "bored", "thoughtful and playful"], "answer": 3, "explanation": "He is thoughtful and playful as he studies the seed. (Enjoying the taste and the moment is also close; discuss.)", "hints": ["He is exploring the seed."]}, {"type": "single", "q": "Rakesh's decision to plant the seed shows ______.", "options": ["he respects and values his grandfather's advice", "he has a close bond with his grandfather and a willingness to learn from him", "both of these"], "answer": 2, "explanation": "He trusts his grandfather and learns from him.", "hints": ["Both."]}], "id": "ch04-02-qu1"}, {"type": "reveal", "prompt": "How does the grandfather's advice reflect his view about luck and effort?", "md": "He believes luck comes from effort: a seed is lucky only if you put it to use."}, {"type": "quiz", "title": "Extract 2: winter", "questions": [{"type": "single", "q": "'Field-mice sought shelter in the roof of the cottage' suggests ______.", "options": ["the winter was very harsh and cold", "the mice liked the roof", "the cottage was empty", "it was summer"], "answer": 0, "explanation": "Animals shelter from severe cold.", "hints": ["Why shelter?"]}, {"type": "single", "q": "'The cherry tree bent low with the weight of snow' suggests ______.", "options": ["the tree could withstand harsh weather", "the tree was weak", "the tree was heavy", "the snow supported it"], "answer": 0, "explanation": "It bent, but did not break.", "hints": ["Tough."]}, {"type": "single", "q": "Comparing Rakesh's age (9) and the tree's age (4) symbolises ______.", "options": ["the tree's growth paralleling Rakesh's own development", "the tree standing as a dear one on Rakesh's birthday"], "answer": 0, "explanation": "Both grew up together.", "hints": ["Grow together."]}], "id": "ch04-02-qu2"}, {"type": "reveal", "prompt": "How did the early winter affect Grandfather's mood and storytelling?", "md": "The blocked road meant no newspaper, so he became grumpy and his stories had unhappy endings."}, {"type": "exercise", "title": "Long questions 1-7", "difficulty": "medium", "minutes": 18, "goal": "Answer: (1) Why did Rakesh's parents send him to Mussoorie? (2) Why did he let the praying mantis stay? (3) How is life in the Himalayan foothills described? (4) What might 'Is this what it feels to be God?' mean? (5) The grandfather-grandson relationship. (6) The connection between humans and nature. (7) Imagine Rakesh's feelings on seeing the seed become a tree.", "checklist": ["Evidence", "Own words"], "solution": "1) There was no school in their village and they wanted him to study.\n2) He saw it as the tree's first visitor and wanted the tree to feel welcome.\n3) Stony soil, dry cold winds, few fruit trees, forests of oak and deodar, monsoon mist and snowy winters.\n4) That creating and nurturing life from a small seed gives a feeling of creation and wonder.\n5) They are close: they share stories, news, and the work of the garden.\n6) Humans can nurture nature and in return nature gives joy, shade and fruit.\n7) Rakesh would feel proud, amazed and joyful, and more caring toward nature.", "solution_lang": "text", "hints": ["Quote short phrases."], "id": "ch04-02-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["Luck comes from putting a thing to use.", "The tree's toughness mirrors Rakesh's growth.", "Caring for a living thing brings pride and wonder."]}], "id": "ch04-02-cherry-reflect", "chapter": "ch04", "kind": "lesson", "minutes": 25}, "ch04-03-cherry-language": {"title": "The Cherry Tree: language practice", "summary": "Odd one out, taste words, antonyms, past tenses and punctuation.", "blocks": [{"type": "text", "md": "**In this lesson:** Odd one out, taste words, antonyms, past tenses and punctuation."}, {"type": "quiz", "title": "Odd word out (I)", "questions": [{"type": "single", "q": "plodded, galloped, scrambled, trudged", "options": ["galloped", "plodded", "scrambled", "trudged"], "answer": 0, "explanation": "The others are slow or hard walking; galloped is fast running.", "hints": ["Fast vs slow."]}, {"type": "single", "q": "tender, delicate, soft, smooth", "options": ["smooth", "tender", "delicate", "soft"], "answer": 0, "explanation": "The others mean gentle/fragile; smooth is about texture.", "hints": ["Fragile?"]}, {"type": "single", "q": "stared, peered, pecked, gazed", "options": ["pecked", "stared", "peered", "gazed"], "answer": 0, "explanation": "The others are ways of looking.", "hints": ["Looking."]}, {"type": "single", "q": "growing, blossoming, progressing, planting", "options": ["planting", "growing", "blossoming", "progressing"], "answer": 0, "explanation": "The others describe development; planting is an action by a person.", "hints": ["Plants develop by themselves."]}], "id": "ch04-03-qu1"}, {"type": "quiz", "title": "Taste words (II)", "questions": [{"type": "single", "q": "tamarind", "options": ["sour or tangy", "sweet", "bitter", "bland"], "answer": 0, "explanation": "Sour/tangy.", "hints": ["Tangy."]}, {"type": "single", "q": "jaggery", "options": ["sweet", "sour", "bitter", "salty"], "answer": 0, "explanation": "Sweet.", "hints": ["Sugar."]}, {"type": "single", "q": "neem leaves", "options": ["bitter", "sweet", "salty", "bland"], "answer": 0, "explanation": "Bitter.", "hints": ["Bitter gourd's cousin."]}, {"type": "single", "q": "paneer", "options": ["bland", "spicy", "bitter", "sour"], "answer": 0, "explanation": "Mild/tasteless on its own.", "hints": ["Mild."]}, {"type": "single", "q": "lemon", "options": ["sour", "sweet", "bland", "bitter"], "answer": 0, "explanation": "Sour.", "hints": ["Citrus."]}, {"type": "single", "q": "pickle", "options": ["spicy and tangy", "sweet", "bland", "bitter"], "answer": 0, "explanation": "Spicy.", "hints": ["Masala."]}, {"type": "single", "q": "a dish of vegetables", "options": ["it depends: bland, salty or spicy", "sweet only", "bitter only", "sour only"], "answer": 0, "explanation": "Depends on the cooking.", "hints": ["Depends."]}], "id": "ch04-03-qu2"}, {"type": "exercise", "title": "Sentences with taste words", "difficulty": "easy", "minutes": 8, "goal": "Make sentences with any five taste words.", "checklist": ["Five sentences", "Correct meaning"], "solution": "The tamarind chutney was tangy. Jaggery is sweet. Neem leaves taste bitter. The soup was bland. The pickle was spicy.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-03-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Antonyms (III)", "questions": [{"type": "fill", "q": "tender ↔ ______", "answer": "hard", "explanation": "tender vs hard.", "hints": ["Not soft."]}, {"type": "fill", "q": "sturdy ↔ ______", "answer": "shaky", "explanation": "sturdy vs shaky.", "hints": ["Weak."]}, {"type": "fill", "q": "narrow ↔ ______", "answer": "wide", "explanation": "wide.", "hints": ["Broad."]}, {"type": "fill", "q": "warmth ↔ ______", "answer": "coldness", "explanation": "coldness.", "hints": ["Cold."]}, {"type": "fill", "q": "feasting ↔ ______", "answer": "fasting", "explanation": "fasting.", "hints": ["Not eating."]}, {"type": "fill", "q": "grumpy ↔ ______", "answer": "cheerful", "explanation": "cheerful.", "hints": ["Happy."]}, {"type": "fill", "q": "sheltered ↔ ______", "answer": "unprotected", "explanation": "unprotected.", "hints": ["No shelter."]}, {"type": "fill", "q": "special ↔ ______", "answer": "ordinary", "explanation": "ordinary.", "hints": ["Common."]}], "id": "ch04-03-qu3"}, {"type": "quiz", "title": "Tenses (IV)", "questions": [{"type": "single", "q": "'Rakesh was on his way home when he bought the cherries.' 'bought' is ______.", "options": ["Simple Past", "Past Progressive", "Past Perfect"], "answer": 0, "explanation": "Simple past.", "hints": ["Finished action."]}, {"type": "single", "q": "'Rakesh was looking for Grandfather.' is ______.", "options": ["Past Progressive", "Simple Past", "Past Perfect"], "answer": 0, "explanation": "was + -ing.", "hints": ["Ongoing."]}, {"type": "single", "q": "'... as though it had performed a miracle.' 'had performed' is ______.", "options": ["Past Perfect", "Simple Past", "Past Progressive"], "answer": 0, "explanation": "had + past participle.", "hints": ["Earlier."]}, {"type": "fill", "q": "As we ______ (talk), I realised ... (past progressive)", "answer": "were talking", "explanation": "were talking.", "hints": ["Was/were + -ing."]}, {"type": "fill", "q": "I ______ (realise) how much wisdom they had imparted.", "answer": "realised", "explanation": "realised.", "hints": ["Simple past."]}, {"type": "fill", "q": "... wisdom they ______ (impart) to me.", "answer": "had imparted", "explanation": "had imparted.", "hints": ["Earlier action."]}, {"type": "fill", "q": "While I ______ (listen) to their stories...", "answer": "was listening", "explanation": "was listening.", "hints": ["Ongoing."]}, {"type": "fill", "q": "I ______ (remember) the times...", "answer": "remembered", "explanation": "remembered.", "hints": ["Simple past."]}, {"type": "fill", "q": "... the times we ______ (spend) together.", "answer": ["had spent", "spent"], "explanation": "had spent (earlier).", "hints": ["Earlier."]}, {"type": "fill", "q": "By the time I left, the sun ______ (set).", "answer": "had set", "explanation": "had set.", "hints": ["Before I left."]}, {"type": "fill", "q": "I ______ (feel) a deep sense of gratitude.", "answer": "felt", "explanation": "felt.", "hints": ["Simple past."]}, {"type": "fill", "q": "... the bond we ______ (nurture).", "answer": "had nurtured", "explanation": "had nurtured.", "hints": ["Earlier."]}], "id": "ch04-03-qu4"}, {"type": "exercise", "title": "Punctuate the paragraph", "difficulty": "medium", "minutes": 10, "goal": "Punctuate: every sunday roshni would visit her grandparents house on their farm come sit grandpa would say patting the bench on their porch roshni loved these moments where the world slowed down and stories flowed like magic grandma would bring tea her eyes twinkling with joy im excited to hear about your younger days the adventures the lessons and the memories roshni said eagerly grandpa smiled softly his wrinkled hands resting on the cane ah the old days when everything was simple and happiness was all we had roshni could feel the warmth of those memories he sat in silence bound not by words but by a timeless bond", "checklist": ["Capital letters for Sunday, Roshni, Grandpa, I'm", "Quotation marks for speech", "Apostrophes: grandparents', I'm", "Commas and full stops"], "solution": "Every Sunday, Roshni would visit her grandparents' house on their farm. \"Come, sit,\" Grandpa would say, patting the bench on their porch. Roshni loved these moments where the world slowed down and stories flowed like magic. Grandma would bring tea, her eyes twinkling with joy. \"I'm excited to hear about your younger days: the adventures, the lessons and the memories,\" Roshni said eagerly. Grandpa smiled softly, his wrinkled hands resting on the cane. \"Ah, the old days... when everything was simple and happiness was all we had.\" Roshni could feel the warmth of those memories. He sat in silence, bound not by words but by a timeless bond.", "solution_lang": "text", "hints": ["Start with the speech marks."], "id": "ch04-03-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Use past progressive for ongoing past actions and past perfect for earlier ones.", "Taste words: sweet, sour, tangy, bitter, spicy, salty, bland.", "Punctuation clarifies meaning."]}], "id": "ch04-03-cherry-language", "chapter": "ch04", "kind": "lesson", "minutes": 45}, "ch04-04-cherry-skills": {"title": "The Cherry Tree: listen, speak, write, explore", "summary": "Listen about tree heroes, practise syllables, speak on Van Mahotsav, write an article.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen about tree heroes, practise syllables, speak on Van Mahotsav, write an article."}, {"type": "read", "title": "Let us listen: a son and his mother", "label": "Listen", "md": "A son asks his mother to help with a PowerPoint project on the Chipko Movement. She says it was about hugging trees to stop them being cut. He says it was the first time common people came together to save trees. She says its success led to the Appiko Movement. He is surprised and says appiko means hugging in Kannada. She says people hugged trees and also regrew forest in the Western Ghats. He mentions Saalumarada Thimakka, a Padma Shri awardee who has planted over 8,000 trees since 1948. The mother is interested to hear more, and says that is one superwoman. She asks about the Forest Man of India. The son says it is Jadav Payeng of Assam, who turned about a thousand acres of barren land into a forest by planting nearly forty million trees over thirty years, creating a habitat for animals and migratory birds. He finds this fascinating, and she is glad he cares for the environment.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: four true statements", "questions": [{"type": "multi", "q": "Choose the TRUE statements.", "options": ["The mother encouraged her son to deliver a presentation on the Chipko Movement.", "The son was surprised to know about the Appiko Movement.", "The son agreed that the Chipko Movement was about people uniting to make an impact.", "The mother expressed a desire to share more details about Saalumarada Thimakka.", "The mother was curious to hear about Saalumarada Thimakka.", "The mother and son disagreed about Jadav Payeng.", "The son found the information on Jadav Payeng wonderful."], "answer": [1, 2, 4, 6], "explanation": "Statements 2, 3, 5 and 7 are true.", "hints": ["Who knew about Thimakka?"]}], "id": "ch04-04-qu1"}, {"type": "quiz", "title": "Syllables", "questions": [{"type": "single", "q": "mountains", "options": ["2", "1", "3", "4"], "answer": 0, "explanation": "moun-tains.", "hints": ["Clap."]}, {"type": "single", "q": "grandfather", "options": ["3", "2", "4", "5"], "answer": 0, "explanation": "grand-fa-ther.", "hints": ["Clap."]}, {"type": "single", "q": "tender", "options": ["2", "1", "3", "4"], "answer": 0, "explanation": "ten-der.", "hints": ["Clap."]}, {"type": "single", "q": "disturbed", "options": ["2", "3", "1", "4"], "answer": 0, "explanation": "dis-turbed.", "hints": ["Clap."]}, {"type": "single", "q": "caterpillar", "options": ["4", "3", "5", "2"], "answer": 0, "explanation": "cat-er-pil-lar.", "hints": ["Clap."]}, {"type": "single", "q": "Himalayan", "options": ["4", "3", "5", "2"], "answer": 0, "explanation": "hi-ma-lay-an.", "hints": ["Clap."]}, {"type": "single", "q": "performed", "options": ["2", "1", "3", "4"], "answer": 0, "explanation": "per-formed.", "hints": ["Clap."]}, {"type": "single", "q": "intention", "options": ["3", "2", "4", "1"], "answer": 0, "explanation": "in-ten-tion.", "hints": ["Clap."]}, {"type": "single", "q": "slope", "options": ["1", "2", "3", "4"], "answer": 0, "explanation": "slope.", "hints": ["One beat."]}, {"type": "single", "q": "newspaper", "options": ["3", "2", "4", "1"], "answer": 0, "explanation": "news-pa-per.", "hints": ["Clap."]}, {"type": "single", "q": "favourite", "options": ["3", "2", "4", "1"], "answer": 0, "explanation": "fa-vour-ite (some say 2).", "hints": ["Clap."]}], "id": "ch04-04-qu2"}, {"type": "exercise", "title": "Speak: Van Mahotsav Diwas", "difficulty": "easy", "minutes": 8, "goal": "Prepare and speak on Van Mahotsav Diwas: when, who, why, how and the message.", "checklist": ["Answered all five points", "Spoke clearly"], "solution": "Van Mahotsav, the festival of trees, is celebrated in the first week of July. Schools, forest departments and communities plant saplings. It is celebrated to spread awareness that trees are our lifeline. The message: plant trees and protect them.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-04-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Article: complete 'Trees - Our Lifeline'", "questions": [{"type": "fill", "q": "Without them, life as we know it ______.", "answer": "would stop existing", "explanation": "would stop existing.", "hints": ["Not exist."]}, {"type": "fill", "q": "Trees ______ and release oxygen.", "answer": "absorb carbon dioxide", "explanation": "absorb carbon dioxide.", "hints": ["Take in."]}, {"type": "fill", "q": "This process also ______ and keeps the environment clean.", "answer": "reduces pollution", "explanation": "reduces pollution.", "hints": ["Cleaner."]}, {"type": "fill", "q": "Trees also help in ______ and prevention of soil erosion.", "answer": "climate control", "explanation": "climate control.", "hints": ["Temperature."]}, {"type": "fill", "q": "______, the air would be polluted, and we would struggle to breathe. (If ...)", "answer": "If trees were not there", "explanation": "If trees were not there.", "hints": ["Conditional."]}, {"type": "fill", "q": "______ would be barren.", "answer": "Our planet", "explanation": "Our planet.", "hints": ["Earth."]}, {"type": "fill", "q": "______, trees are true friends. (conclusion)", "answer": "To conclude", "explanation": "To conclude.", "hints": ["Ending."]}, {"type": "fill", "q": "Protecting and planting trees ______ for everyone on Earth.", "answer": "ensures a better future", "explanation": "ensures a better future.", "hints": ["Future."]}], "id": "ch04-04-qu3"}, {"type": "exercise", "title": "Write an article for the school magazine", "difficulty": "medium", "minutes": 20, "goal": "Write an article of 150 words with a heading, byline and four paragraphs (introduction, facts and advantages, consequences, suggestions with a word of hope or a call for action) on a topic such as 'Trees - Our Lifeline'.", "checklist": ["Heading and byline", "Intro", "Facts/advantages", "Consequences", "Suggestions and ending"], "solution": "Trees - Our Lifeline\nBy Rohan, Class VIII\nTrees are essential to life... They give oxygen, food and shade... Without trees, the air would be polluted and the soil would erode... We should plant a sapling every birthday. Let us act now.", "solution_lang": "text", "hints": ["Use connectors: Moreover, Additionally, To conclude."], "id": "ch04-04-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore", "difficulty": "easy", "minutes": 8, "goal": "(1) The banyan is India's National Tree: the Great Banyan (Shibpur, Howrah), Dodda Aalada Mara (near Bengaluru), Thimmamma Marrimanu (Anantapur; Guinness record 1989). (2) Kailash Sankhala, 'The Tiger Man of India', first director of Project Tiger. (3) Wild ducks fly in a V-shape to catch uplifting air currents and save energy. Find out about one more Indian environmentalist.", "checklist": ["Named an environmentalist", "Gave one fact"], "solution": "Sundarlal Bahuguna led the Chipko Movement to save trees in the Himalayas.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-04-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Chipko and Appiko movements protected trees by hugging them.", "Syllables are beats in a word.", "An article has a heading, byline and four paragraphs."]}], "id": "ch04-04-cherry-skills", "chapter": "ch04", "kind": "lesson", "minutes": 55}, "ch04-05-hymn-poem": {"title": "Harvest Hymn: warm-up and the poem", "summary": "Learn archaic words and read Sarojini Naidu's Harvest Hymn.", "blocks": [{"type": "text", "md": "**In this lesson:** Learn archaic words and read Sarojini Naidu's Harvest Hymn."}, {"type": "exercise", "title": "Harvest festivals and hymns", "difficulty": "easy", "minutes": 8, "goal": "Pairs: (1) When is the harvest festival celebrated in your region and how? (2) A hymn is a song of praise: To whom do we offer a hymn? When and where do we sing it? Why?", "checklist": ["Named a festival", "Answered the three hymn questions"], "solution": "Pongal, Makar Sankranti and Bihu are harvest festivals. We offer hymns to God, in temples or at festivals, to give thanks.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-05-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Archaic words (II)", "questions": [{"type": "single", "q": "thou", "options": ["you (subject)", "you (object)", "yours", "your"], "answer": 0, "explanation": "thou = you (subject).", "hints": ["'Thou art my friend'."]}, {"type": "single", "q": "art", "options": ["are", "is", "were", "was"], "answer": 0, "explanation": "art = are.", "hints": ["Thou art."]}, {"type": "single", "q": "thee", "options": ["you (object)", "you (subject)", "yours", "your"], "answer": 0, "explanation": "thee = you (object).", "hints": ["I trust thee."]}, {"type": "single", "q": "thy", "options": ["your", "yours", "you", "are"], "answer": 0, "explanation": "thy = your.", "hints": ["Thy kindness."]}, {"type": "single", "q": "thine", "options": ["yours", "your", "you", "are"], "answer": 0, "explanation": "thine = yours.", "hints": ["Is thine."]}], "id": "ch04-05-qu1"}, {"type": "quiz", "title": "Words in context (III)", "questions": [{"type": "single", "q": "radiance", "options": ["glow, brilliance", "darkness", "sadness", "advice"], "answer": 0, "explanation": "Bright light.", "hints": ["Light."]}, {"type": "single", "q": "tribute", "options": ["respect", "gratitude", "both: an act showing respect and gratitude", "payment"], "answer": 2, "explanation": "Tribute shows respect and gratitude.", "hints": ["Both fit."]}, {"type": "single", "q": "cherished", "options": ["loved", "preserved", "forgotten", "paid"], "answer": 0, "explanation": "Loved.", "hints": ["Dear."]}, {"type": "single", "q": "counsel", "options": ["advice", "decision", "punishment", "reward"], "answer": 0, "explanation": "Advice.", "hints": ["Guidance."]}, {"type": "single", "q": "munificent", "options": ["generous", "rich", "poor", "shy"], "answer": 0, "explanation": "Generous.", "hints": ["Gives freely."]}], "id": "ch04-05-qu2"}, {"type": "read", "title": "Harvest Hymn by Sarojini Naidu (public domain)", "label": "Read", "md": "Men's Voices:\nLord of the lotus, lord of the harvest,\nBright and munificent lord of the morn!\nThine is the bounty that prospered our sowing,\nThine is the bounty that nurtured our corn.\nWe bring thee our songs and our garlands for tribute,\nThe gold of our fields and the gold of our fruit;\nO giver of mellowing radiance, we hail thee,\nWe praise thee, O Surya, with cymbal and flute.\n\nLord of the rainbow, lord of the harvest,\nGreat and beneficent lord of the main!\nThine is the mercy that cherished our furrows,\nThine is the mercy that fostered our grain.\nWe bring thee our thanks and our garlands for tribute,\nThe wealth of our valleys, new-garnered and ripe;\nO sender of rain and the dewfall, we hail thee,\nWe praise thee, Varuna, with cymbal and pipe.\n\nWomen's Voices:\nQueen of the gourd-flower, queen of the harvest,\nSweet and omnipotent mother, O Earth!\nThine is the plentiful bosom that feeds us,\nThine is the womb where our riches have birth.\nWe bring thee our love and our garlands for tribute,\nWith gifts of thy opulent giving we come;\nO source of our manifold gladness, we hail thee,\nWe praise thee, O Prithvi, with cymbal and drum.\n\nAll Voices:\nLord of the Universe, Lord of our being,\nFather eternal, ineffable Om!\nThou art the Seed and the Scythe of our harvests,\nThou art our Hands and our Heart and our Home.\nWe bring thee our lives and our labours for tribute,\nGrant us thy succour, thy counsel, thy care.\nO Life of all life and all blessing, we hail thee,\nWe praise thee, O Bramha, with cymbal and prayer.", "note": "Sarojini Naidu's poem is from the early 20th century and is in the public domain."}, {"type": "quiz", "title": "Main idea of each stanza (Let us discuss I)", "questions": [{"type": "single", "q": "The speakers recognise the lord's kindness and praise him for nourishing the field (mercy that cherished the furrows).", "options": ["Stanza 2", "Stanza 1", "Stanza 3", "Stanza 4"], "answer": 0, "explanation": "Varuna's mercy fostered the grain.", "hints": ["Rain."]}, {"type": "single", "q": "The speakers praise the generosity of the creator who ensures a rich harvest (bounty).", "options": ["Stanza 1", "Stanza 2", "Stanza 3", "Stanza 4"], "answer": 0, "explanation": "Surya's bounty prospered the sowing.", "hints": ["Sun."]}, {"type": "single", "q": "The speakers pay homage to the Earth and appreciate her role in supporting life.", "options": ["Stanza 3", "Stanza 1", "Stanza 2", "Stanza 4"], "answer": 0, "explanation": "Prithvi.", "hints": ["Women's voices."]}, {"type": "single", "q": "The speakers devote their lives and work, and seek support, wisdom and care.", "options": ["Stanza 4", "Stanza 1", "Stanza 2", "Stanza 3"], "answer": 0, "explanation": "All voices.", "hints": ["Lives and labours."]}], "id": "ch04-05-qu3"}, {"type": "quiz", "title": "Setting, tone and capital letters", "questions": [{"type": "single", "q": "The setting is a rural landscape during a ______ festival.", "options": ["harvest", "religious"], "answer": 0, "explanation": "Harvest.", "hints": ["Crops."]}, {"type": "single", "q": "The tone is respectful and celebratory because it praises ______.", "options": ["nature and the Lord", "the men and women"], "answer": 0, "explanation": "Thanks to nature and God.", "hints": ["Whom?"]}, {"type": "single", "q": "'Hands', 'Heart' and 'Home' are capitalised because ______.", "options": ["God resides in them", "they represent the hard work of farmers"], "answer": 0, "explanation": "Capitals mark the divine.", "hints": ["Reverence."]}], "id": "ch04-05-qu4"}, {"type": "summary", "points": ["Harvest Hymn thanks the Sun, Rain, Earth and the Creator.", "Archaic words: thou, thee, thy, thine, art.", "Voices: men, women and all voices make a chorus."]}], "terms": [{"term": "hymn", "def": "a song of praise"}, {"term": "archaic", "def": "old-fashioned and no longer in common use"}], "id": "ch04-05-hymn-poem", "chapter": "ch04", "kind": "lesson", "minutes": 25}, "ch04-06-hymn-reflect": {"title": "Harvest Hymn: devices and reflection", "summary": "Poetic devices, symbols, extracts and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Poetic devices, symbols, extracts and long questions."}, {"type": "quiz", "title": "Poetic devices (III-IV)", "questions": [{"type": "single", "q": "'Bright and munificent lord of the morn!' uses ______.", "options": ["alliteration (m sounds)", "simile", "metaphor", "personification"], "answer": 0, "explanation": "munificent ... morn.", "hints": ["Repeated sounds."]}, {"type": "single", "q": "'We bring thee our lives and our labours' uses ______.", "options": ["alliteration (l sounds)", "simile", "metaphor", "imagery"], "answer": 0, "explanation": "lives ... labours.", "hints": ["Repeated l."]}, {"type": "single", "q": "'Sweet and omnipotent mother' (the Earth) shows ______.", "options": ["personification", "imagery", "metaphor", "simile"], "answer": 0, "explanation": "The Earth is given human qualities.", "hints": ["A mother."]}, {"type": "single", "q": "'The wealth of our valleys, new-garnered and ripe' shows ______.", "options": ["imagery", "personification", "metaphor", "alliteration"], "answer": 0, "explanation": "A clear picture of the scene.", "hints": ["Senses."]}, {"type": "single", "q": "'Thou art the Seed and the Scythe' shows ______.", "options": ["metaphor", "imagery", "personification", "simile"], "answer": 0, "explanation": "God is the beginning and end of life.", "hints": ["No 'like'."]}], "id": "ch04-06-qu1"}, {"type": "exercise", "title": "Repetition", "difficulty": "easy", "minutes": 8, "goal": "Find more repetitions (like 'the gold of our fields and the gold of our fruit'). What is the poet's purpose?", "checklist": ["Found two examples", "Explained purpose"], "solution": "'Thine is the bounty... Thine is the bounty'; 'Thine is the mercy... Thine is the mercy'; 'queen of the gourd-flower, queen of the harvest'. Repetition adds rhythm, emphasis and the feel of a prayer.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch04-06-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Symbols (VI)", "questions": [{"type": "single", "q": "Prithvi (the Earth)", "options": ["fertile land, motherhood, nurturing", "light, energy, life", "mercy and nourishment"], "answer": 0, "explanation": "Mother Earth.", "hints": ["Mother."]}, {"type": "single", "q": "Surya (the Sun)", "options": ["light, energy, life", "mercy and nourishment", "fertile land"], "answer": 0, "explanation": "Warmth and prosperity.", "hints": ["Light."]}, {"type": "single", "q": "Varuna (Rain)", "options": ["mercy and nourishment, crucial for agriculture", "light", "motherhood"], "answer": 0, "explanation": "Rain.", "hints": ["Water."]}], "id": "ch04-06-qu2"}, {"type": "quiz", "title": "Extract 1: Surya", "questions": [{"type": "single", "q": "Bringing songs and garlands suggests ______.", "options": ["a deep sense of reverence and gratitude", "fear of the gods", "force", "only dependence"], "answer": 0, "explanation": "Thankful devotion.", "hints": ["Gratitude."]}, {"type": "fill", "q": "The 'gold' in 'gold of our fields' symbolises the ______ of the harvest.", "answer": ["wealth", "prosperity", "richness"], "explanation": "Golden crops are wealth.", "hints": ["Valuable."]}, {"type": "single", "q": "Cymbal and flute signify ______.", "options": ["joy and celebration", "meditation and worship"], "answer": 0, "explanation": "Festive music.", "hints": ["Celebration."]}], "id": "ch04-06-qu3"}, {"type": "reveal", "prompt": "How does 'giver of mellowing radiance' help us understand Surya's role?", "md": "Surya's gentle, warm light ripens the crops."}, {"type": "quiz", "title": "Extract 2: all voices", "questions": [{"type": "single", "q": "'Lord of our being': 'being' refers to ______.", "options": ["our entire existence", "our physical body", "spiritual practices", "possessions"], "answer": 0, "explanation": "Whole life.", "hints": ["Existence."]}, {"type": "truefalse", "q": "The 'Seed and the Scythe' symbolises the divine as both beginning (creation) and end (harvest) of the cycle.", "answer": true, "explanation": "Seed = start; scythe = harvest.", "hints": ["Start and end."]}, {"type": "single", "q": "The phrase meaning 'a timeless, everlasting presence' is ______.", "options": ["Father eternal", "ineffable Om", "Lord of the Universe", "Seed and Scythe"], "answer": 0, "explanation": "Eternal = timeless.", "hints": ["Never-ending."]}, {"type": "single", "q": "The phrase meaning 'beyond human description' is ______.", "options": ["ineffable Om", "Father eternal", "Hands and Heart", "Lord of our being"], "answer": 0, "explanation": "Ineffable.", "hints": ["Cannot be described."]}], "id": "ch04-06-qu4"}, {"type": "reveal", "prompt": "How do we know these lines are spoken as a chorus?", "md": "The heading 'All Voices' and the repeated 'we' and 'our' show that everyone speaks together."}, {"type": "exercise", "title": "Long questions 1-7", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) Why do farmers hail the God of rain? (2) What is the 'wealth of our valleys'? (3) One reason women call Earth a 'source of manifold gladness'. (4) Why do all offer their 'labours for tribute'? (5) Why men, women and all voices? (6) How does the poet create the joyous atmosphere? (7) Why is it a hymn?", "checklist": ["Evidence"], "solution": "1) Rain fostered their grain and cherished their furrows.\n2) The ripe, newly harvested crops in the valleys.\n3) The Earth gives food and many joys.\n4) Their work is their offering of thanks.\n5) It shows that everyone shares thanks, from different roles to a united chorus.\n6) Music (cymbal, flute, drum), garlands, gold fields and the harvest create joy.\n7) It praises and thanks the divine with devotion.", "solution_lang": "text", "hints": ["Quote short phrases."], "id": "ch04-06-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Alliteration, imagery, metaphor and personification enrich the hymn.", "Surya, Varuna and Prithvi symbolise light, mercy and the nurturing Earth.", "The poem is a chorus of thanks."]}], "id": "ch04-06-hymn-reflect", "chapter": "ch04", "kind": "lesson", "minutes": 35}, "ch04-07-hymn-language": {"title": "Harvest Hymn: word study and listening", "summary": "Farm tools, synonyms, archaic words and the paddy-cultivation listening.", "blocks": [{"type": "text", "md": "**In this lesson:** Farm tools, synonyms, archaic words and the paddy-cultivation listening."}, {"type": "quiz", "title": "Farming implements (I)", "questions": [{"type": "single", "q": "A tool with a long handle with metal teeth for collecting hay or leaves", "options": ["rake", "spade", "sickle", "plough"], "answer": 0, "explanation": "Rake: R _ K _.", "hints": ["Teeth."]}, {"type": "single", "q": "A small hand tool for digging and shallow furrows", "options": ["trowel", "scythe", "spade", "rake"], "answer": 0, "explanation": "Trowel: T R _ W _ L.", "hints": ["Small."]}, {"type": "single", "q": "A hand-held tool with a curved blade on a short handle used for harvesting", "options": ["sickle", "scythe", "spade", "rake"], "answer": 0, "explanation": "Sickle: S _ C K L _.", "hints": ["Short curved blade."]}, {"type": "single", "q": "A tool pulled by oxen to turn the soil", "options": ["plough", "rake", "sickle", "trowel"], "answer": 0, "explanation": "Plough: P L _ _ G H.", "hints": ["Oxen."]}, {"type": "single", "q": "A flat rectangular blade on a long wooden handle for digging", "options": ["spade", "rake", "scythe", "trowel"], "answer": 0, "explanation": "Spade: S P _ D _.", "hints": ["Digging."]}, {"type": "single", "q": "A long-curved blade on a long handle for cutting tall grass", "options": ["scythe", "sickle", "spade", "plough"], "answer": 0, "explanation": "Scythe: S C _ T H _.", "hints": ["Long."]}], "id": "ch04-07-qu1"}, {"type": "quiz", "title": "Synonyms (II)", "questions": [{"type": "single", "q": "'The king was beneficent to the poor because he took care of them.'", "options": ["kind", "generous", "help", "brightness"], "answer": 0, "explanation": "beneficent = kind.", "hints": ["Caring."]}, {"type": "single", "q": "'He was munificent towards the needy and donated a lot.'", "options": ["generous", "kind", "help", "indescribable"], "answer": 0, "explanation": "munificent = generous.", "hints": ["Donated."]}, {"type": "single", "q": "'His friends gave him succour by supporting him with money.'", "options": ["help", "kind", "brightness", "indescribable"], "answer": 0, "explanation": "succour = help.", "hints": ["Support."]}, {"type": "single", "q": "'The whole room was full of radiance.'", "options": ["brightness", "help", "kind", "generous"], "answer": 0, "explanation": "radiance = brightness.", "hints": ["Sun's rays."]}, {"type": "single", "q": "'Speechless with ineffable joy'", "options": ["indescribable", "kind", "help", "brightness"], "answer": 0, "explanation": "ineffable = indescribable.", "hints": ["Speechless."]}], "id": "ch04-07-qu2"}, {"type": "quiz", "title": "Archaic words (III)", "questions": [{"type": "single", "q": "morrow", "options": ["tomorrow", "today", "yesterday", "morning"], "answer": 0, "explanation": "Tomorrow.", "hints": ["Next day."]}, {"type": "single", "q": "hither", "options": ["here", "there", "away", "over"], "answer": 0, "explanation": "Here.", "hints": ["Come hither."]}, {"type": "single", "q": "quoth", "options": ["said", "asked", "wrote", "quoted"], "answer": 0, "explanation": "Said.", "hints": ["Quoth the raven."]}, {"type": "single", "q": "betwixt", "options": ["between", "beyond", "behind", "before"], "answer": 0, "explanation": "Between.", "hints": ["Betwixt."]}, {"type": "single", "q": "yonder", "options": ["over there", "here", "inside", "behind"], "answer": 0, "explanation": "Over there.", "hints": ["Banyan tree yonder."]}], "id": "ch04-07-qu3"}, {"type": "read", "title": "Let us listen: how rice is grown", "label": "Listen", "md": "Rice is a type of grass, and the part we eat is its seed. First the soil is ploughed. Then it is soaked with plenty of water, which is called puddling, the most important step in preparing the field. Seeds are sown in a nursery bed, and the field has to stay flooded because irrigation is crucial. It takes about four to five weeks for the seeds to grow into seedlings. Then comes transplanting, when seedlings are uprooted and planted in the flooded field. In about 120 days the plants are fully grown and are harvested by cutting. The seeds are separated from the plant by threshing. Then the grains are dried to reduce moisture so they can be stored or processed. Milling separates the rice from the outer covering. Finally it reaches the market and we make appam, pulao, khichdi and dal-bhat.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: sequence and choices", "questions": [{"type": "order", "q": "Order the steps of paddy cultivation.", "items": ["Ploughing of soil", "Puddling of land", "Irrigating the field", "Transplanting of seedlings", "Harvesting of paddy", "Threshing of grains", "Milling of rice"], "explan
