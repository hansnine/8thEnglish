ce", "explanation": "vice.", "hints": ["Bad habit."]}, {"type": "fill", "q": "soil -> ______ (heat something)", "answer": "boil", "explanation": "boil.", "hints": ["Water."]}, {"type": "fill", "q": "soil -> ______ (work very hard)", "answer": "toil", "explanation": "toil.", "hints": ["Hard work."]}, {"type": "fill", "q": "soil -> ______ (length of wire in a circle)", "answer": "coil", "explanation": "coil.", "hints": ["Spring."]}, {"type": "fill", "q": "soil -> ______ (sheets to wrap food)", "answer": "foil", "explanation": "foil.", "hints": ["Aluminium."]}], "id": "ch01-07-qu3"}, {"type": "read", "title": "Let us listen: the Rock Garden of Chandigarh", "label": "Listen", "md": "The Rock Garden is a large open-air exhibition that proves how creative people can be with waste materials. Nek Chand started it in 1957, which is why it is also called Nek Chand's Rock Garden. It was shown on an Indian postage stamp in 1983, and Nek Chand received the Padma Shri a year later.\n\nThe garden covers forty acres and is full of colourful sculptures and mosaics. It is divided into three phases. Each part has installations made from terracotta pots, light fixtures and even broken toilet pots, all turned into art. About five thousand statues line its borders. It truly celebrates the best from waste.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen and answer (1-3 words)", "questions": [{"type": "fill", "q": "Where was Nek Chand's Rock Garden featured?", "answer": ["Indian postage stamp", "postage stamp", "an Indian postage stamp"], "explanation": "It was featured on a stamp in 1983.", "hints": ["Think of mail."]}, {"type": "fill", "q": "What kind of sculptures does it have?", "answer": ["colourful sculptures", "colourful"], "explanation": "Colourful sculptures and mosaics.", "hints": ["Adjective + noun."]}, {"type": "fill", "q": "How is the garden divided?", "answer": ["three distinct phases", "three phases"], "explanation": "Three phases.", "hints": ["A number."]}, {"type": "fill", "q": "Name one thing transformed into art.", "answer": ["terracotta pots", "light fixtures", "broken toilet pots"], "explanation": "Any of the three.", "hints": ["Waste items."]}, {"type": "fill", "q": "About how many statues border it?", "answer": ["5,000", "5000", "around 5,000"], "explanation": "Around 5,000.", "hints": ["Thousands."]}], "id": "ch01-07-qu4"}, {"type": "summary", "points": ["Synonyms: strange = unusual, nice = pleasant, delicate = fragile, cried = exclaimed.", "Implement, tool, equipment, appliance and gadget are different kinds of instruments.", "Replace the first letter to make a new word: nice -> dice, rice, mice, vice."]}], "id": "ch01-07-concrete-language", "chapter": "ch01", "kind": "lesson", "minutes": 20}, "ch01-08-concrete-skills": {"title": "A Concrete Example: apologise, write a notice, explore", "summary": "Apologise informally and formally, write a notice and read a poem on foliage.", "blocks": [{"type": "text", "md": "**In this lesson:** Apologise informally and formally, write a notice and read a poem on foliage."}, {"type": "quiz", "title": "Choose the right level of language", "questions": [{"type": "single", "q": "To a brother whose sweets you ate:", "options": ["Sorry, I didn't mean to. I'll get you more.", "I sincerely regret the incident, sir.", "I owe you an apology for my conduct.", "Please accept my humblest apologies."], "answer": 0, "explanation": "Informal language for family and friends.", "hints": ["Is it a classmate or a principal?"]}, {"type": "single", "q": "To the Principal after being late three days:", "options": ["I'm extremely sorry for being late. I promise it won't happen again.", "Oops, sorry!", "Whatever, I was late.", "It's no big deal."], "answer": 0, "explanation": "Formal language for someone in authority.", "hints": ["Polite and respectful."]}], "id": "ch01-08-qu1"}, {"type": "exercise", "title": "Role-play apologies", "difficulty": "easy", "minutes": 8, "goal": "In pairs, apologise and respond for: (informal) eating your brother's sweets, breaking your sister's flower craft, spilling ink on your mother's documents, forgetting a friend's notebook; (formal) not bringing an assignment, being late for three days, not submitting your project.", "checklist": ["Informal: 'I'm sorry about...', 'Sorry, I didn't mean to...'", "Responses: 'That's alright', 'These things happen'", "Formal: 'I'm extremely sorry for...', 'I promise it won't happen again'", "Formal response: 'I accept your apology. Please ensure you...'"], "solution": "Informal: 'I'm really sorry I ate your sweets. I'll buy you more.' - 'That's alright, but please ask next time.'\nFormal: 'I'm extremely sorry I did not bring my assignment, ma'am. I promise it won't happen again.' - 'I accept your apology. Please ensure you submit it tomorrow.'", "solution_lang": "text", "hints": ["Use the phrase tables in the textbook."], "id": "ch01-08-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a notice", "difficulty": "medium", "minutes": 12, "goal": "You are a member of your school's Nature Club. Write a notice for students of Grades 6-8 about the inauguration of the Herb Garden. Use a box, formal language and third person.", "checklist": ["Organisation name and the word NOTICE", "Date, title and body", "Purpose, date, time, venue and whom to contact", "Name, signature and class at the end", "Written inside a box"], "solution": "GREEN LEAF NATURE CLUB\nNOTICE\n12 July 2026\nINAUGURATION OF THE HERB GARDEN\nThe Nature Club is pleased to announce that the Herb Garden will be inaugurated on 20 July 2026 at 10:00 a.m. near the school library. All students of Grades 6-8 are invited. Interested students should give their names to the Club Secretary before 18 July.\nAarav Sharma\nSecretary, Nature Club (Class 8)", "solution_lang": "text", "hints": ["Keep the notice under 50 words."], "id": "ch01-08-ex2", "mode": "selfcheck"}, {"type": "read", "title": "A Sea of Foliage by Toru Dutt (public domain)", "label": "Read", "md": "A sea of foliage girds our garden round,\nBut not a sea of dull unvaried green,\nSharp contrasts of all colours here are seen;\nThe light-green graceful tamarinds abound\nAmid the mango clumps of green profound,\nAnd palms arise, like pillars gray, between;\nAnd o'er the quiet pools the seemuls lean,\nRed—red, and startling like a trumpet's sound.\nBut nothing can be lovelier than the ranges\nOf bamboos to the eastward, when the moon\nLooks through their gaps, and the white lotus changes\nInto a cup of silver. One might swoon\nDrunken with beauty then, or gaze and gaze\nOn a primeval Eden, in amaze.", "note": "Toru Dutt died in 1877, so her poem is in the public domain."}, {"type": "exercise", "title": "Explore", "difficulty": "easy", "minutes": 8, "goal": "(1) Find out about popular gardens in your region and share them. (2) Make a herbarium: press fallen leaves and flowers between newspaper under books for a week, then make a card or wall hanging. (3) Visit Amrit Udyan's virtual tour (virtualtour.rashtrapatibhavan.gov.in).", "checklist": ["Named a garden and one feature", "Pressed leaves for a week", "Made an artwork"], "solution": "Example: Lalbagh Botanical Garden, Bengaluru, famous for its glasshouse and flower shows. A herbarium keeps dried, pressed plants mounted on paper for study.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-08-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Informal apologies for friends and family, formal ones for teachers.", "A notice has an organisation, date, title, body and signature, in a box.", "A herbarium is a collection of pressed plant samples."]}], "id": "ch01-08-concrete-skills", "chapter": "ch01", "kind": "lesson", "minutes": 30}, "ch01-09-wisdom-warmup": {"title": "Wisdom Paves the Way: knowledge, wisdom and the play", "summary": "Separate knowledge from wisdom, hear the play's story and check Scene I.", "blocks": [{"type": "text", "md": "**Knowledge** is knowing facts. **Wisdom** is using that knowledge with good judgement. The play you are about to hear shows four young men using close observation and reasoning."}, {"type": "exercise", "title": "Why do we ask elders for advice?", "difficulty": "easy", "minutes": 8, "goal": "Share with a partner why we seek advice from elders in the family.", "checklist": ["Gave two reasons", "Gave an example"], "solution": "Elders have lived through many situations, so they have experience and good judgement. For example, my grandmother advised me to forgive my friend after an argument and it saved our friendship.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-09-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Knowledge or wisdom?", "questions": [{"type": "single", "q": "Riya's understanding of plant care helped her grow a healthy vegetable garden.", "options": ["Knowledge", "Wisdom"], "answer": 0, "explanation": "This is the book's example: knowing facts about plants.", "hints": ["Knowing facts."]}, {"type": "single", "q": "Mr. Kumar values time with family over chasing wealth.", "options": ["Knowledge", "Wisdom"], "answer": 1, "explanation": "Choosing what really matters is judgement.", "hints": ["Priorities."]}, {"type": "single", "q": "Karuna's expertise in computer programming helped her develop a successful app.", "options": ["Knowledge", "Wisdom"], "answer": 0, "explanation": "Technical skill and facts.", "hints": ["Expertise."]}, {"type": "single", "q": "Rohan understood the value of time management and made a timetable for his assignments.", "options": ["Knowledge", "Wisdom"], "answer": 1, "explanation": "He used what he knew with good judgement. (Some classmates may argue 'knowledge'; discuss why.)", "hints": ["Applying with judgement."]}, {"type": "single", "q": "Ramesh chose to forgive his friend for a misunderstanding.", "options": ["Knowledge", "Wisdom"], "answer": 1, "explanation": "Choosing kindness is wise.", "hints": ["Judgement of the heart."]}, {"type": "single", "q": "Ms. Vaijayanthi delivered a lecture on Indian classical music at the cultural festival.", "options": ["Knowledge", "Wisdom"], "answer": 0, "explanation": "Sharing learned information.", "hints": ["Facts."]}], "id": "ch01-09-qu1"}, {"type": "reveal", "prompt": "Look at the picture on page 27: a damaged house, a cat on a tree, a monkey on the roof and four villagers. What might have happened?", "md": "Possible answer: the monkey damaged the thatched roof and broke things while the villagers watched and the cat hid in the tree."}, {"type": "read", "title": "Wisdom Paves the Way (short retelling)", "label": "Read", "md": "Scene I. Four young men, Ram Datt, Shiv Datt, Har Datt and Dev Datt, walk a dusty road to Ujjain after ten days of searching for work. They hope the young King of Ujjain will recognise their talents. On the way they see fresh camel tracks and study them carefully. Each secretly learns something about the camel, but they do not say what.\n\nA worried merchant runs up, panting, and asks if they have seen his lost camel. Ram Datt asks if it is lame in one leg, Shiv Datt asks if it is blind in the right eye, Har Datt asks if it has a short tail, and Dev Datt asks if it has a stomach ache. The merchant says yes to everything. But they tell him they have never seen the camel. He thinks they must have stolen it and drags them to the King.\n\nScene II. In court the merchant accuses the four. The King asks each to explain. Ram Datt saw only three clear footprints, so one leg was lame. Shiv Datt saw leaves eaten only on the left side of the road, so the right eye was blind. Har Datt saw blood drops from insect bites, so the tail was too short to swat pests. Dev Datt saw deep forefoot prints and faint hind ones, so the camel was in belly pain. The King praises their reasoning, scolds the merchant and makes the four his advisers. The court applauds.", "note": "This audio is a short retelling written for this app. Read the full play in your textbook and try acting it out."}, {"type": "quiz", "title": "Scene I check", "questions": [{"type": "single", "q": "Why did Dev Datt say 'we ought to be united in this hope'?", "options": ["All four wanted employment under the King and wanted to stay together.", "He was afraid of the merchant.", "He wanted to go home.", "He disliked the others."], "answer": 0, "explanation": "They share one hope and walk together.", "hints": ["Think of 'four of us'."]}, {"type": "single", "q": "Why did they notice the tracks? (Shiv Datt says the camel 'has passed this way')", "options": ["The tracks were fresh, so a camel had just passed.", "They wanted to follow it.", "They were lost.", "They saw the camel."], "answer": 0, "explanation": "Fresh tracks mean recent passing.", "hints": ["Fresh = recent."]}, {"type": "single", "q": "Why did Shiv Datt say the merchant looked 'pursued by trouble'?", "options": ["He was running, panting and looked distressed.", "He was singing.", "He walked slowly.", "He carried a camel."], "answer": 0, "explanation": "His hurry and worry showed something was wrong.", "hints": ["Describe his face."]}, {"type": "single", "q": "Why did the merchant say 'Surely you are a healer!'?", "options": ["They knew about the camel's stomach pain, which only a healer would know.", "They carried medicines.", "They wore white.", "They owned a clinic."], "answer": 0, "explanation": "He thought they must have examined the camel.", "hints": ["How else could they know?"]}, {"type": "single", "q": "Why did Dev Datt say they would wait under the banyan tree?", "options": ["They were innocent and had nothing to hide.", "They wanted to run away.", "They were tired.", "They planned to steal the camel."], "answer": 0, "explanation": "Innocent people do not run away.", "hints": ["Honest behaviour."]}], "id": "ch01-09-qu2"}, {"type": "summary", "points": ["Knowledge is knowing facts; wisdom is using them wisely.", "The four men reasoned from tracks, leaves and blood drops.", "The merchant accused them without proof."]}], "terms": [{"term": "wisdom", "def": "good judgement using knowledge"}, {"term": "deduce", "def": "to work something out by reasoning"}], "id": "ch01-09-wisdom-warmup", "chapter": "ch01", "kind": "lesson", "minutes": 20}, "ch01-10-wisdom-reflect": {"title": "Wisdom Paves the Way: Scene II and reflection", "summary": "Order Scene II, answer extract questions and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Order Scene II, answer extract questions and long questions."}, {"type": "quiz", "title": "Arrange the events of Scene II", "questions": [{"type": "order", "q": "Put Scene II in order.", "items": ["The King asks the merchant to clearly state his accusation.", "The merchant accuses the four men of knowing a lot about his missing camel.", "Ram Datt explains how he inferred from the tracks that the camel is lame.", "Shiv Datt reveals that the camel is blind in its right eye as it had chewed only the leaves on the left side.", "Har Datt clarifies how he knew that the camel has a short tail.", "Dev Datt explains his observation about the camel's pain and careful movement.", "The King praises the young men and dismisses the merchant's accusation.", "The King makes the four young men his advisers."], "explanation": "The order follows the speeches in the play.", "hints": ["The King speaks first."]}], "id": "ch01-10-qu1"}, {"type": "quiz", "title": "Extract 1", "questions": [{"type": "single", "q": "Which statement is FALSE? A. Dev Datt believes finding employment is easy. B. Ram Datt is confident the King would recognise their talents.", "options": ["A", "B"], "answer": 0, "explanation": "Dev Datt says they may have many more roads to wander before finding employment, so he does not think it is easy.", "hints": ["Re-read his first line."]}, {"type": "single", "q": "'That's why we press on towards Ujjain': 'press on' means ______.", "options": ["walking with heavy steps", "moving forward with determination", "slowing down for rest", "stopping briefly"], "answer": 1, "explanation": "Press on = continue despite difficulty.", "hints": ["Determination."]}, {"type": "single", "q": "Har Datt says 'We need to devise a strategy.' What does this show?", "options": ["He is cautious and thoughtful, preferring to plan ahead.", "He wants to give up.", "He rushes in.", "He relies on others."], "answer": 0, "explanation": "He prefers to plan before acting.", "hints": ["Planning."]}], "id": "ch01-10-qu2"}, {"type": "exercise", "title": "What does Ram Datt's confidence tell us?", "difficulty": "easy", "minutes": 8, "goal": "What does Ram Datt's confidence in gaining the King's recognition tell us about him?", "checklist": ["Names a trait (confident, optimistic)"], "solution": "It shows he is confident, optimistic and believes in his abilities.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-10-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Extract 2", "questions": [{"type": "single", "q": "Assertion (A): The Merchant left the court humbled and ashamed. Reason (R): The King commanded that the four wise men join his court.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "A false, R true"], "answer": 2, "explanation": "A is true. R is false: the King offered them the post ('What do you say to my offer?'); he did not command it.", "hints": ["Did the King order or offer?"]}, {"type": "single", "q": "'See beyond the obvious' means the men could ______.", "options": ["challenge beliefs", "interpret in traditional ways", "notice details others overlook", "predict the future"], "answer": 2, "explanation": "They noticed small details.", "hints": ["Details."]}, {"type": "fill", "q": "Ram Datt called the offer 'an honour we had not dared to dream of' because ______. (one short reason)", "answer": ["they came looking for any job", "they only hoped to get work", "they never expected to become advisers"], "explanation": "They hoped for simple employment, not to become royal advisers.", "hints": ["Compare hope and result."]}], "id": "ch01-10-qu3"}, {"type": "exercise", "title": "The King's values", "difficulty": "easy", "minutes": 8, "goal": "How does the King's offer reflect his values as a ruler?", "checklist": ["Mentions fairness/listening", "Mentions valuing intelligence"], "solution": "The King values intelligence and merit more than status, listens to both sides, corrects a wrong accusation and rewards talent.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-10-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Long questions 1-6", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) What does the dusty road tell us about the journey? (2) Why was the merchant suspicious? What does that show? (3) How do the observations turn the play around? (4) Why did the King believe the four? (5) Why are they suitable as advisers? (6) Why is the merchant ashamed?", "checklist": ["Used evidence from the play", "Gave reasons", "Wrote in your own words"], "solution": "1) The dusty road shows a long, tiring journey with hard days.\n2) They described the camel exactly yet claimed never to have seen it. This shows he jumped to conclusions.\n3) Before this, they look like thieves; after their explanations they are seen as wise.\n4) Their reasoning was logical and explained clearly with evidence.\n5) They are observant, can reason and speak truthfully.\n6) He accused honest men without proof and was publicly scolded.", "solution_lang": "text", "hints": ["Look at what each man observed."], "id": "ch01-10-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Scene II shows reasoning step by step.", "The King offered (did not command) the posts.", "Close observation and clear reasoning are signs of wisdom."]}], "id": "ch01-10-wisdom-reflect", "chapter": "ch01", "kind": "lesson", "minutes": 35}, "ch01-11-wisdom-language": {"title": "Wisdom Paves the Way: word study and modal verbs", "summary": "Noun forms, expressions, face and bear, modal verbs and the listening activity.", "blocks": [{"type": "text", "md": "**In this lesson:** Noun forms, expressions, face and bear, modal verbs and the listening activity."}, {"type": "quiz", "title": "Noun forms (I)", "questions": [{"type": "fill", "q": "Some word games need a lot of thought and ______. (deduce)", "answer": "deduction", "explanation": "deduce -> deduction.", "hints": ["-tion."]}, {"type": "fill", "q": "We need to make close ______ of animals. (observe)", "answer": ["observation", "observations"], "explanation": "observe -> observation.", "hints": ["-tion."]}, {"type": "fill", "q": "A detailed ______ of the documents shows errors. (scrutinise)", "answer": "scrutiny", "explanation": "scrutinise -> scrutiny.", "hints": ["Not -ation."]}, {"type": "fill", "q": "You should not make any false ______ against anyone. (accuse)", "answer": ["accusation", "accusations"], "explanation": "accuse -> accusation.", "hints": ["-ation."]}, {"type": "fill", "q": "She was given an award in ______ of her contribution. (recognise)", "answer": "recognition", "explanation": "recognise -> recognition.", "hints": ["-ition."]}], "id": "ch01-11-qu1"}, {"type": "quiz", "title": "Match the expressions (II)", "questions": [{"type": "single", "q": "with all our hearts", "options": ["complete sincerity", "surprised", "exact and accurate", "starts cheering together"], "answer": 0, "explanation": "Sincerely.", "hints": ["Heart."]}, {"type": "single", "q": "to be precise", "options": ["exact and accurate", "surprised", "meeting someone", "to pause"], "answer": 0, "explanation": "Exactly.", "hints": ["Precise."]}, {"type": "single", "q": "gain an audience with", "options": ["meeting or hearing someone", "complete sincerity", "to rest", "overall plan"], "answer": 0, "explanation": "Formal meeting with a ruler.", "hints": ["The King."]}, {"type": "single", "q": "catch his breath", "options": ["to pause or rest for some time", "surprised", "hidden information", "cheering"], "answer": 0, "explanation": "Stop to recover breath.", "hints": ["Panting."]}, {"type": "single", "q": "erupts in applause", "options": ["starts cheering together", "surprised", "exact", "complete sincerity"], "answer": 0, "explanation": "Court claps.", "hints": ["Applause = clapping."]}, {"type": "single", "q": "grand scheme of things", "options": ["overall plan of life in a larger context", "exact", "surprised", "to rest"], "answer": 0, "explanation": "Big picture.", "hints": ["Large view."]}, {"type": "single", "q": "taken aback", "options": ["surprised", "exact", "to pause", "cheering"], "answer": 0, "explanation": "Shocked.", "hints": ["Surprise."]}, {"type": "single", "q": "more than meets the eye", "options": ["hidden information that is not obvious", "surprised", "exact", "to pause"], "answer": 0, "explanation": "More hidden than visible.", "hints": ["Hidden."]}], "id": "ch01-11-qu2"}, {"type": "exercise", "title": "Use five expressions in sentences", "difficulty": "easy", "minutes": 8, "goal": "Make five sentences using five of the eight expressions.", "checklist": ["Each sentence uses one expression correctly", "Meaning fits"], "solution": "1) I thank you with all our hearts.\n2) To be precise, it took 12 minutes.\n3) The students erupted in applause.\n4) I was taken aback by the news.\n5) There is more than meets the eye in this mystery.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-11-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "face and bear (III)", "questions": [{"type": "single", "q": "She has a round, smiling face. (face)", "options": ["front part of the head", "to be positioned towards", "to deal with a difficult situation", "front or surface of a thing"], "answer": 0, "explanation": "Noun.", "hints": ["Part of the head."]}, {"type": "single", "q": "Ravi turned to face his father.", "options": ["front part of the head", "to be positioned towards", "to deal with a difficult situation", "surface"], "answer": 1, "explanation": "Verb: turned towards.", "hints": ["Turned."]}, {"type": "single", "q": "We should be ready to face life's challenges.", "options": ["to deal with a difficult situation", "to be positioned", "head", "surface"], "answer": 0, "explanation": "Deal with.", "hints": ["Challenges."]}, {"type": "single", "q": "The face of the clock was painted red and blue.", "options": ["front or surface of a thing", "to deal with", "head", "to be positioned"], "answer": 0, "explanation": "Surface.", "hints": ["Clock."]}, {"type": "single", "q": "I can't bear the sound of vehicles honking.", "options": ["tolerate", "accept", "large mammal", "produce"], "answer": 0, "explanation": "Tolerate.", "hints": ["Can't stand."]}, {"type": "single", "q": "Riya agreed to bear the responsibilities.", "options": ["accept", "tolerate", "mammal", "produce"], "answer": 0, "explanation": "Accept.", "hints": ["Take on."]}, {"type": "single", "q": "I spotted a bear on a wildlife safari.", "options": ["a large heavy mammal", "tolerate", "accept", "produce"], "answer": 0, "explanation": "Animal.", "hints": ["Safari."]}, {"type": "single", "q": "The trees took a long time to bear fruit.", "options": ["produce", "accept", "tolerate", "mammal"], "answer": 0, "explanation": "Produce.", "hints": ["Fruit."]}], "id": "ch01-11-qu3"}, {"type": "quiz", "title": "Modal verbs (IV)", "questions": [{"type": "single", "q": "'I will gladly pay your fee' - will shows ______.", "options": ["willingness", "command", "wish", "prediction"], "answer": 0, "explanation": "He is willing.", "hints": ["Gladly."]}, {"type": "single", "q": "'You must have stolen it' - must shows ______.", "options": ["logical conclusion", "necessity", "command", "possibility"], "answer": 0, "explanation": "He concludes.", "hints": ["Deduction."]}, {"type": "single", "q": "'You shall come with me to face the King!' - shall shows ______.", "options": ["command", "wish", "disbelief", "advice"], "answer": 0, "explanation": "An order.", "hints": ["Merchant orders."]}, {"type": "single", "q": "'How could you possibly know that?' - could shows ______.", "options": ["expression of disbelief", "wish", "advice", "necessity"], "answer": 0, "explanation": "Disbelief.", "hints": ["Surprised."]}, {"type": "single", "q": "'I am confident he would recognise our talents' - would shows ______.", "options": ["prediction", "wish", "command", "challenge"], "answer": 0, "explanation": "Prediction.", "hints": ["Future guess."]}, {"type": "single", "q": "'A camel with a long tail would have fended off these pests' - would have shows ______.", "options": ["imagined (hypothetical) possibility", "wish", "necessity", "advice"], "answer": 0, "explanation": "Imagined.", "hints": ["Hypothetical."]}, {"type": "single", "q": "'They may tell us more than meets the eye' - may shows ______.", "options": ["possibility", "wish", "command", "advice"], "answer": 0, "explanation": "Possible.", "hints": ["Maybe."]}, {"type": "single", "q": "'May your wisdom shine upon Ujjain' - May shows ______.", "options": ["wish or hope", "possibility", "command", "advice"], "answer": 0, "explanation": "Blessing.", "hints": ["Wish."]}, {"type": "single", "q": "'We ought to be united' - ought to shows ______.", "options": ["moral obligation or advice", "necessity", "wish", "challenge"], "answer": 0, "explanation": "Obligation.", "hints": ["Should."]}, {"type": "single", "q": "'We need to devise a strategy' - need to shows ______.", "options": ["necessity", "wish", "challenge", "command"], "answer": 0, "explanation": "Necessity.", "hints": ["Must have."]}, {"type": "single", "q": "'You dare to claim not to have seen it!' - dare to shows ______.", "options": ["challenge", "wish", "advice", "prediction"], "answer": 0, "explanation": "Challenge.", "hints": ["Defiant."]}], "id": "ch01-11-qu4"}, {"type": "quiz", "title": "Modals in a story (V)", "questions": [{"type": "fill", "q": "How ______ I become wise? (ability)", "answer": "can", "explanation": "can = ability.", "hints": ["Able to."]}, {"type": "fill", "q": "Wisdom ______ be earned through patience. (necessity)", "answer": "must", "explanation": "must.", "hints": ["Necessity."]}, {"type": "fill", "q": "You ______ listen more than you speak. (suggestion)", "answer": "should", "explanation": "should.", "hints": ["Advice."]}, {"type": "fill", "q": "It ______ take years. (weak possibility)", "answer": "might", "explanation": "might.", "hints": ["Weak."]}, {"type": "fill", "q": "You ______ learn from your mistakes too. (obligation)", "answer": "need to", "explanation": "need to.", "hints": ["Obligation."]}, {"type": "fill", "q": "Wisdom ______ come slowly. (possibility)", "answer": "may", "explanation": "may.", "hints": ["Possible."]}, {"type": "fill", "q": "The boy knew he ______ become wise. (ability)", "answer": "could", "explanation": "could.", "hints": ["Past ability."]}], "id": "ch01-11-qu5"}, {"type": "exercise", "title": "Rewrite with modal verbs (VI)", "difficulty": "easy", "minutes": 8, "goal": "Rewrite: (2) It is unnecessary to worry about things beyond your control. (3) It is not possible for a person to gain experience without taking risks. (4) It is essential to treat others with kindness. (5) It is not allowed to interrupt when someone is speaking.", "checklist": ["2: needn't / don't need to", "3: cannot", "4: must / have to", "5: must not / may not"], "solution": "2) You needn't worry about things beyond your control.\n3) A person cannot gain experience without taking risks.\n4) You must treat others with kindness, even when they disagree.\n5) You must not interrupt when someone else is speaking.", "solution_lang": "text", "hints": ["Use the highlighted word as a clue."], "id": "ch01-11-ex2", "mode": "selfcheck"}, {"type": "read", "title": "Let us listen: why we love witty characters", "label": "Listen", "md": "Speaker one says witty characters turn serious moments funny, never panic and answer cleverly, so they calm tense situations. Speaker two says they make stories exciting and show that humour and intelligence are as powerful as strength. Speaker three says they use humour instead of fighting, and prove that clear thinking can beat force, which teaches us to stay calm in tricky situations. Speaker four says witty characters add charm, keep the reader engaged and make learning fun, and that wit and wisdom go hand in hand.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Match statements to speakers", "questions": [{"type": "single", "q": "Speaker 1 says ______.", "options": ["Witty characters can deactivate tense situations with their cleverness.", "Witty characters prove that cleverness is as powerful as strength.", "Witty characters teach me that tricky situations can be managed calmly.", "Witty characters in a story keep the reader involved."], "answer": 0, "explanation": "Speaker 1 talks about calming tense moments.", "hints": ["Tense."]}, {"type": "single", "q": "Speaker 2 says ______.", "options": ["Witty characters prove that cleverness is as powerful as strength.", "Witty characters can deactivate tense situations.", "Witty characters teach me tricky situations can be managed calmly.", "Witty characters show ways to make learning enjoyable."], "answer": 0, "explanation": "Intelligence and humour are as powerful as strength.", "hints": ["Strength."]}, {"type": "single", "q": "Speaker 3 says ______.", "options": ["Witty characters teach me that tricky situations can be managed calmly.", "Witty characters prove cleverness is as powerful as strength.", "Witty characters keep the reader involved.", "Witty characters can deactivate tense situations."], "answer": 0, "explanation": "Stay calm in tricky situations.", "hints": ["Calm."]}, {"type": "single", "q": "Speaker 4 says ______.", "options": ["Witty characters in a story keep the reader involved.", "Witty characters add excitement by extraordinary deeds.", "Witty characters can deactivate tense situations.", "Witty characters prove cleverness is as powerful as strength."], "answer": 0, "explanation": "Intelligence keeps the reader engaged.", "hints": ["Reader."]}], "id": "ch01-11-qu6"}, {"type": "summary", "points": ["Noun forms: deduction, observation, scrutiny, accusation, recognition.", "Modals show ability, necessity, advice, possibility, wish and more.", "Listening: match what each speaker says with the statement."]}], "id": "ch01-11-wisdom-language", "chapter": "ch01", "kind": "lesson", "minutes": 50}, "ch01-12-wisdom-skills": {"title": "Wisdom Paves the Way: speak, write, explore", "summary": "Stress, intonation, a letter of complaint and staging the play.", "blocks": [{"type": "text", "md": "Stressing a word changes the meaning. In 'Look there, friends' stress on *Look* means look, not do something else; on *there* means that place; on *friends* means you are speaking to your friends."}, {"type": "quiz", "title": "Which word is stressed?", "questions": [{"type": "single", "q": "'I take my dog for a walk in the evening' (meaning: it is me, not someone else, who does it). Stress on ______.", "options": ["I", "take", "dog", "evening"], "answer": 0, "explanation": "Stress on I shows the speaker, not others.", "hints": ["Who."]}, {"type": "single", "q": "'I take my dog for a walk in the evening' (meaning: the dog, not another pet). Stress on ______.", "options": ["I", "my dog", "walk", "evening"], "answer": 1, "explanation": "Stress 'my dog'.", "hints": ["Which pet."]}, {"type": "single", "q": "'I take my dog for a walk in the evening' (meaning: in the evening, not in the morning). Stress on ______.", "options": ["I", "walk", "in the evening", "take"], "answer": 2, "explanation": "Stress the time.", "hints": ["When."]}], "id": "ch01-12-qu1"}, {"type": "exercise", "title": "Practise sentences with a falling tone", "difficulty": "easy", "minutes": 8, "goal": "Say aloud with a falling tone: 'Good day, kind sirs.' 'We regret to inform you that we do not know where it is.' 'You describe it perfectly!' 'You shall come with me to face the King!'", "checklist": ["My voice falls at the end", "I used feeling in exclamations"], "solution": "Statements and exclamations usually end with a falling tone: ... kind sirs ↘ ... where it is ↘ ... perfectly! ↘ ... the King! ↘", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-12-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Letter of complaint: order the paragraphs", "questions": [{"type": "order", "q": "Put the parts of a formal complaint letter in order.", "items": ["Sender's address and date", "Receiver's designation and address", "Subject line", "Salutation: Respected Sir/Madam", "Paragraph 1: purpose and the issue", "Paragraph 2: details and consequences", "Paragraph 3: suggestions and request for swift action", "Subscription: Yours faithfully and signature"], "explanation": "Formal letter layout.", "hints": ["Address first, signature last."]}], "id": "ch01-12-qu2"}, {"type": "exercise", "title": "Write the letter", "difficulty": "medium", "minutes": 20, "goal": "The kutcha road to your colony is full of potholes after heavy rain; accidents are possible and stagnant water breeds mosquitoes. Write a complaint to the Commissioner, Municipal Corporation or the Sarpanch.", "checklist": ["Formal format with subject line", "Paragraph 1 states purpose", "Paragraph 2 gives details/consequences", "Paragraph 3 requests action", "Uses phrases like 'I would like to bring to your attention...'"], "solution": "To The Commissioner, Municipal Corporation. Subject: Repair of the kutcha road in Rose Colony.\nRespected Sir, I would like to bring to your attention the very bad condition of the road leading to our colony. Heavy rain has created deep potholes. The problems we face are accidents and stagnant water that breeds mosquitoes. As a result, children and elders are at risk of injury and disease. Firstly, I would like to suggest repairing the road. Secondly, please drain the water. I request you to look into this matter and take action. I look forward to your prompt response.\nYours faithfully, Ravi Kumar", "solution_lang": "text", "hints": ["Keep it formal and polite."], "id": "ch01-12-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Stage the play: order the steps", "questions": [{"type": "order", "q": "Put the first steps of staging a play in order.", "items": ["Choose a play that suits your needs", "Choose director, stage manager, light and sound in-charge, props manager, costume designer and makeup artist", "Hold auditions and decide roles", "Read the script and plan stage movements", "Make a rehearsal schedule", "Work on set design and props", "Design or gather costumes", "Hold a dress rehearsal"], "explanation": "Plan, cast, rehearse, then dress rehearsal.", "hints": ["Planning first."]}], "id": "ch01-12-qu3"}, {"type": "exercise", "title": "Stage the play", "difficulty": "easy", "minutes": 8, "goal": "Present 'Wisdom Paves the Way' in class using the 13 steps for staging a play, with correct intonation and stress.", "checklist": ["Roles assigned", "Props and costumes ready", "Correct intonation and stress used"], "solution": "Assign the roles of the four men, the Merchant, the King and Sentries. Rehearse the camel conversation with surprise in your voice, and let the King's lines sound commanding.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-12-ex3", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore", "difficulty": "easy", "minutes": 8, "goal": "Read stories of Vikramaditya and Betal, Tenali Rama, Gopal the Jester and Panchatantra and share one.", "checklist": ["Chose one story", "Told the lesson"], "solution": "Example: a Panchatantra tale where a clever hare tricks a lion; the lesson is that wit can defeat strength.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch01-12-ex4", "mode": "selfcheck"}, {"type": "summary", "points": ["Stress on a different word changes the meaning.", "A complaint letter has formal layout and three paragraphs.", "Staging a play takes teamwork and rehearsal."]}], "id": "ch01-12-wisdom-skills", "chapter": "ch01", "kind": "lesson", "minutes": 50}, "ch01-99-test": {"title": "Test: Unit 1 · Wit and Wisdom", "summary": "Check what you have learnt in Unit 1.", "blocks": [{"type": "quiz", "title": "Unit 1 test", "questions": [{"type": "single", "q": "Why did the king quarrel with the queen?", "options": ["She yawned while he recited his poem and he took it as disrespect.", "She criticised his poem aloud.", "She refused to see him.", "She disliked Rama."], "answer": 0, "explanation": "A misunderstanding.", "hints": ["Yawn."]}, {"type": "single", "q": "How did Rama make the king realise his mistake?", "options": ["He joked about a sower who yawns and showed everyone yawns.", "He lectured him.", "He wrote to the queen.", "He gave him seeds."], "answer": 0, "explanation": "Humour.", "hints": ["Seeds."]}, {"type": "single", "q": "'If I had known this would happen, I would have chosen another day.' This is ______.", "options": ["a past regret that cannot be changed", "a real future possibility", "a present imaginary situation", "a command"], "answer": 0, "explanation": "Past perfect + would have.", "hints": ["Past."]}, {"type": "single", "q": "Which has a rising tone?", "options": ["Is this your cat?", "What is your name?", "Where do you live?", "Why are you here?"], "answer": 0, "explanation": "Yes/No.", "hints": ["Yes or no answer."]}, {"type": "single", "q": "The rhyme scheme of 'A Concrete Example' is ______.", "options": ["AABBCC", "ABABCC", "AABCAC", "ABBACC"], "answer": 0, "explanation": "Pairs rhyme.", "hints": ["Pairs."]}, {"type": "single", "q": "The ending of the poem is ironic because ______.", "options": ["the 'lovely flower' is under the speaker's feet", "Mrs. Jones is angry", "the poet likes stones", "the garden is large"], "answer": 0, "explanation": "Expectation vs reality.", "hints": ["Look at the last lines."]}, {"type": "single", "q": "'I can't bear the sound' - bear means ______.", "options": ["tolerate", "produce", "an animal", "accept"], "answer": 0, "explanation": "Tolerate.", "hints": ["Can't stand."]}, {"type": "single", "q": "Which pair is a closed compound?", "options": ["bookstore", "common sense", "quick-witted", "sky blue"], "answer": 0, "explanation": "Written as one word.", "hints": ["No space or hyphen."]}, {"type": "single", "q": "The King offered the four men ______.", "options": ["posts as advisers", "gold", "a camel", "freedom"], "answer": 0, "explanation": "He asked 'What do you say to my offer?'", "hints": ["Offer."]}, {"type": "multi", "q": "Which are examples of wisdom (not just knowledge)?", "options": ["Choosing to forgive a friend", "Giving a lecture on music", "Valuing family time over wealth", "Programming an app"], "answer": [0, 2], "explanation": "Wisdom is good judgement.", "hints": ["Judgement."]}, {"type": "fill", "q": "Fill in: Mrs. Jones puts little plants between the ______.", "answer": "stones", "explanation": "Key detail.", "hints": ["Rocks."]}, {"type": "single", "q": "'May your wisdom shine' - May expresses ______.", "options": ["a wish", "a command", "disbelief", "necessity"], "answer": 0, "explanation": "Blessing.", "hints": ["Hope."]}], "id": "ch01-99-qu1", "pass_score": 0.7, "mode": "test"}], "kind": "test", "id": "ch01-99-test", "chapter": "ch01", "minutes": 10}, "ch02-01-valour-story": {"title": "A Tale of Valour: warm-up and the story", "summary": "Think about the Republic Day Parade, hear the story of Major Somnath Sharma and put events in order.", "blocks": [{"type": "text", "md": "**In this lesson:** Think about the Republic Day Parade, hear the story of Major Somnath Sharma and put events in order."}, {"type": "exercise", "title": "Before we read", "difficulty": "easy", "minutes": 8, "goal": "Pairs: (1) What do you think about the Republic Day Parade? (2) What are its highlights? (3) Which bravery awards are given on this day and to whom? Groups of four: (1) What qualities should a soldier have? (2) What message would you give a soldier?", "checklist": ["Answered all questions", "Named at least two highlights/awards"], "solution": "The parade shows India's culture and military strength. Highlights: marching contingents, tableaux, the flypast. Gallantry awards such as the Param Vir Chakra, Maha Vir Chakra and Vir Chakra, and children's bravery awards, are announced. A soldier needs courage, discipline, loyalty and teamwork. Message: 'Thank you for keeping us safe.'", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-01-ex1", "mode": "selfcheck"}, {"type": "read", "title": "A Tale of Valour (short retelling)", "label": "Read", "md": "Major Somnath Sharma (1923-1947) was India's first recipient of the Param Vir Chakra. His story is remembered at the National War Memorial and in songs and books.\n\nIn October 1947 Pakistan launched Operation Gulmarg and sent about a thousand trained invaders into Kashmir to capture the Srinagar airport and the valley. Kashmir joined India on 26 October, and Indian troops were airlifted in because the road through Pathankot was poor.\n\nOn 31 October, D Company of the 4th Kumaon Regiment under Major Sharma was flown to Srinagar. His left hand was in plaster, but he insisted on going with his men. On 3 November his company of ninety soldiers patrolled the village of Badgam, which overlooks the airfield. It was eerily silent. Other companies were called back, and D Company was last.\n\nThe enemy attacked when they saw the small group. Major Sharma guessed that the first attack was a distraction, and a bigger one came from another side. About five hundred invaders faced his ninety men. He asked for air strikes and laid out ground panels to guide the aircraft. Though outnumbered nearly seven to one, he moved through the fire, directing guns and filling magazines. When ammunition ran low and headquarters told him to withdraw, he replied that he would not withdraw an inch but fight to the last man and the last round. Minutes later a mortar shell killed him in a trench.\n\nHis men held on for over six more hours. This gave time for reinforcements to arrive. More than three hundred of the enemy were lost. Srinagar was saved. He was only twenty-four, and became the first recipient of the Param Vir Chakra, awarded after his death.\n\nBorn in Dadh, Kangra, Himachal Pradesh, he came from a military family and loved the Mahabharata's stories from his grandfather. He studied at Sherwood College, trained at Sandhurst, joined the army in 1942 and served in Burma in World War II.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Put the events in order", "questions": [{"type": "order", "q": "Arrange these events in order.", "items": ["Major Somnath Sharma was born in 1923 in Kangra, Himachal Pradesh.", "Major Somnath Sharma underwent training at the Royal Military College, Sandhurst.", "Major Somnath Sharma was commissioned into the 19th Hyderabad Regiment in 1942.", "D Company, under his command, was flown into Srinagar.", "He requested air strikes to combat the enemy at Badgam.", "He was killed immediately after a mortar shell hit him.", "Even after losing him, the soldiers fought bravely to save Srinagar for India.", "He was the first recipient of the Param Vir Chakra."], "explanation": "Life events first, then the battle, then the award.", "hints": ["Start with his birth, end with the award."]}], "id": "ch02-01-qu1"}, {"type": "summary", "points": ["Major Somnath Sharma and 90 men held off about 500 invaders at Badgam on 3 November 1947.", "His last words showed total commitment: 'fight to the last man and the last round'.", "He was the first Param Vir Chakra awardee."]}], "terms": [{"term": "valour", "def": "great courage in battle"}, {"term": "posthumously", "def": "after death"}], "id": "ch02-01-valour-story", "chapter": "ch02", "kind": "lesson", "minutes": 10}, "ch02-02-valour-reflect": {"title": "A Tale of Valour: think and reflect", "summary": "Answer the extract questions and the long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Answer the extract questions and the long questions."}, {"type": "quiz", "title": "Extract 1: the battle", "questions": [{"type": "single", "q": "What can be inferred from 'the air was thick with the sound of gunfire'?", "options": ["The gunshots had stopped for a while.", "There was intense fighting on the battlefield.", "The invaders were retreating.", "The Indian soldiers had won."], "answer": 1, "explanation": "Thick with gunfire means constant firing.", "hints": ["Constant noise."]}, {"type": "fill", "q": "Despite his injuries, he continued to lead his men because ______. (short reason)", "answer": ["he wanted to inspire them", "he had to protect Srinagar", "he was committed to his men and country", "he wanted to motivate his men"], "explanation": "His duty and his men's morale mattered more than his own safety.", "hints": ["Think of his words about his men."]}, {"type": "single", "q": "(A) Major Somnath Sharma moved fearlessly through the battlefield though injured. (R) He believed his courage was important to motivate the soldiers.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "A false, R true"], "answer": 0, "explanation": "His courage motivated his men.", "hints": ["Why did he stay in front?"]}, {"type": "single", "q": "He filled magazines and encouraged his men despite ______.", "options": ["injuries", "worry"], "answer": 0, "explanation": "'Despite heavy casualties and his own injuries'.", "hints": ["Which was mentioned?"]}], "id": "ch02-02-qu1"}, {"type": "quiz", "title": "Extract 2: early life", "questions": [{"type": "single", "q": "What can be inferred about his early influences?", "options": ["Mostly his father's military achievements", "Only the Mahabharata tales", "His family and heritage inspired his bravery and duty", "He joined out of necessity"], "answer": 2, "explanation": "Both his military family and his grandfather's stories shaped him.", "hints": ["Not just one source."]}, {"type": "truefalse", "q": "Somnath Sharma belonged to a wealthy family.", "answer": false, "explanation": "The text says a family of rich military legacy, not wealth.", "hints": ["Legacy is not money."]}, {"type": "single", "q": "'Served the nation with distinction' tells us his father ______.", "options": ["performed his duties with exceptional dedication and excellence", "was highly respected for his contributions", "both of these"], "answer": 2, "explanation": "Both ideas fit.", "hints": ["Distinction = excellence."]}, {"type": "fill", "q": "Replace 'visually charming' (hill station) with a word from the extract:", "answer": "picturesque", "explanation": "picturesque = visually charming.", "hints": ["Starts with p."]}], "id": "ch02-02-qu2"}, {"type": "exercise", "title": "Q1-6 long questions", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) What is the significance of the repetition 'forever alive, forever alive'? (2) Why was his leadership critical? (3) What were his last words and what do they show? (4) What might have happened if D Company had not held their ground? (5) Why does his story still inspire? (6) How can courage, duty and self-sacrifice apply to daily life?", "checklist": ["Used evidence", "Gave reasons", "Own words"], "solution": "1) It stresses that his courage will never be forgotten.\n2) He kept the men fighting, guided air strikes and refilled magazines, which bought time.\n3) 'I shall not withdraw an inch but will fight to the last man and the last round': complete commitment to duty.\n4) The invaders might have captured Srinagar airport and the valley before reinforcements arrived.\n5) He gave his life for the nation at 24 and showed courage and leadership.\n6) Courage: speak up for what is right. Duty: finish my responsibilities. Self-sacrifice: help others even if it costs me comfort.", "solution_lang": "text", "hints": ["Link each answer to a line from the story."], "id": "ch02-02-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["Intense fighting, injuries and leadership show his bravery.", "His family heritage shaped his sense of duty.", "His sacrifice gave time for reinforcements."]}], "id": "ch02-02-valour-reflect", "chapter": "ch02", "kind": "lesson", "minutes": 20}, "ch02-03-valour-language": {"title": "A Tale of Valour: language practice", "summary": "Expressions, collective nouns, 'over' verbs, spelling pairs and subject-verb agreement.", "blocks": [{"type": "text", "md": "**In this lesson:** Expressions, collective nouns, 'over' verbs, spelling pairs and subject-verb agreement."}, {"type": "quiz", "title": "Match the expression with its situation", "questions": [{"type": "single", "q": "Fight to the last man", "options": ["Soldiers fought valiantly until each laid down his life", "A team scores a last-minute goal", "Soldiers hold position against a stronger enemy", "A spy disrupts the enemy's plan"], "answer": 0, "explanation": "Fighting until none is left.", "hints": ["Last man."]}, {"type": "single", "q": "Foil the plan", "options": ["A spy disrupts the enemy's efforts by intercepting communications", "A team scores a last-minute goal", "Soldiers hold position", "Soldiers fight to death"], "answer": 0, "explanation": "To foil = to spoil.", "hints": ["Spoil."]}, {"type": "single", "q": "Deliver a blow", "options": ["A last-minute goal shakes the opponent's confidence", "A spy intercepts", "Soldiers stay in position", "Soldiers die"], "answer": 0, "explanation": "A blow = a setback.", "hints": ["Setback."]}, {"type": "single", "q": "Hold their ground", "options": ["Soldiers stay and fight back though the enemy is stronger", "A spy intercepts", "A goal is scored", "Soldiers die"], "answer": 0, "explanation": "Refuse to retreat.", "hints": ["Stay put."]}, {"type": "fill", "q": "The detective managed to ______ by finding the hidden evidence.", "answer": "foil the plan", "explanation": "foil the plan.", "hints": ["Spoil."]}, {"type": "fill", "q": "The advertising campaign was meant to ______ to their competitors' sales.", "answer": "deliver a blow", "explanation": "deliver a blow.", "hints": ["Hurt."]}, {"type": "fill", "q": "The hikers chose to ______ despite the rain.", "answer": "hold their ground", "explanation": "hold their ground.", "hints": ["Refuse to turn back."]}, {"type": "fill", "q": "The soldiers vowed to defend their homeland and ______.", "answer": "fight to the last man", "explanation": "fight to the last man.", "hints": ["Till the end."]}], "id": "ch02-03-qu1"}, {"type": "quiz", "title": "Collective nouns of the armed forces", "questions": [{"type": "single", "q": "regiment", "options": ["a large body of troops ready for battle", "a permanent army unit divided into companies", "a group of 12-24 aircraft", "a group of ships"], "answer": 0, "explanation": "Textbook match: regiment = large body of troops.", "hints": ["Large body."]}, {"type": "single", "q": "squadron", "options": ["a small unit of 12-24 aircraft and crews", "a group of ships", "a large body of troops", "a permanent army unit"], "answer": 0, "explanation": "Aircraft.", "hints": ["Air force."]}, {"type": "single", "q": "fleet", "options": ["a group of ships sailing together", "a group of aircraft", "troops", "army unit"], "answer": 0, "explanation": "Ships.", "hints": ["Navy."]}, {"type": "single", "q": "battalion", "options": ["a permanent unit commanded by a lieutenant colonel/colonel, divided into companies", "ships", "aircraft", "large body of troops"], "answer": 0, "explanation": "Army unit.", "hints": ["Companies."]}, {"type": "fill", "q": "The commanding officer addressed the entire ______ of soldiers.", "answer": "regiment", "explanation": "regiment.", "hints": ["Large body."]}, {"type": "fill", "q": "The admiral ordered the entire ______ to set sail.", "answer": "fleet", "explanation": "fleet.", "hints": ["Ships."]}, {"type": "fill", "q": "The ______ of infantry advanced through the forest.", "answer": "battalion", "explanation": "battalion.", "hints": ["Army unit."]}, {"type": "fill", "q": "A ______ of fighter jets was sent.", "answer": "squadron", "explanation": "squadron.", "hints": ["Aircraft."]}], "id": "ch02-03-qu2"}, {"type": "quiz", "title": "over- verbs", "questions": [{"type": "fill", "q": "To take and seize control: ______ (overwhelm / overthrow / overrun)", "answer": "overthrow", "explanation": "overthrow a government.", "hints": ["Seize control."]}, {"type": "fill", "q": "To invade or occupy in large numbers: ______", "answer": "overrun", "explanation": "overrun.", "hints": ["Invade."]}, {"type": "fill", "q": "To flood or overpower emotionally: ______", "answer": "overwhelm", "explanation": "overwhelm.", "hints": ["Emotion."]}], "id": "ch02-03-qu3"}, {"type": "exercise", "title": "Five more 'over' verbs", "difficulty": "easy", "minutes": 8, "goal": "List at least five other verbs beginning with 'over' and use each in your own sentence.", "checklist": ["Five verbs", "Five correct sentences"], "solution": "overcome: She overcame her fear. overlook: Do not overlook small details. overtake: The bus overtook the truck. overeat: Do not overeat at night. overcook: He overcooked the rice.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-03-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Spelling pairs: c for nouns, s for verbs", "questions": [{"type": "fill", "q": "The teacher's ______ is helpful, and she continues to ______ students. (advice, advise)", "answer": "advice, advise", "explanation": "advice (noun), advise (verb).", "hints": ["Noun first."]}, {"type": "fill", "q": "Daily ______ helps; she is ready to ______ her harmonium. (practice, practise)", "answer": "practice, practise", "explanation": "practice (noun), practise (verb).", "hints": ["Noun first."]}, {"type": "fill", "q": "A strange ______ for experiments; plans to ______ new methods. (device, devise)", "answer": "device, devise", "explanation": "device (noun), devise (verb).", "hints": ["Noun first."]}, {"type": "fill", "q": "The village ______ met and decided to ______ villagers. (council, counsel)", "answer": "council, counsel", "explanation": "council (noun), counsel (verb).", "hints": ["Noun first."]}], "id": "ch02-03-qu4"}, {"type": "quiz", "title": "Subject-verb agreement", "questions": [{"type": "single", "q": "The bouquet of flowers ______ beautiful.", "options": ["is", "are"], "answer": 0, "explanation": "Subject: bouquet (singular).", "hints": ["Not 'flowers'."]}, {"type": "single", "q": "Neither the teacher nor the students ______ aware.", "options": ["was", "were"], "answer": 1, "explanation": "Verb agrees with the nearer subject: students.", "hints": ["Nearer subject."]}, {"type": "single", "q": "Each of the participants ______ submitted.", "options": ["has", "have"], "answer": 0, "explanation": "'Each' is singular.", "hints": ["Each = one."]}, {"type": "single", "q": "The data collected ______ significant trends.", "options": ["shows", "show"], "answer": 0, "explanation": "'Data' as a collective unit takes singular (show is also accepted in formal science).", "hints": ["Collective."]}, {"type": "single", "q": "One of the players ______ injured.", "options": ["was", "were"], "answer": 0, "explanation": "One = singular.", "hints": ["One."]}, {"type": "single", "q": "Either the children or their guardian ______ to attend.", "options": ["has", "have"], "answer": 0, "explanation": "Nearer subject: guardian.", "hints": ["Nearer."]}, {"type": "single", "q": "A pair of shoes ______ missing.", "options": ["is", "are"], "answer": 0, "explanation": "Pair = singular.", "hints": ["Pair."]}, {"type": "single", "q": "Neither of the statements ______ true.", "options": ["is", "are"], "answer": 0, "explanation": "Neither = singular.", "hints": ["Neither."]}, {"type": "single", "q": "The members of the jury ______ their verdict.", "options": ["has delivered", "have delivered"], "answer": 1, "explanation": "Members acting individually: plural.", "hints": ["Members."]}, {"type": "single", "q": "Mathematics ______ an interesting subject.", "options": ["is", "are"], "answer": 0, "explanation": "Subject names with -s are singular.", "hints": ["Subject."]}], "id": "ch02-03-qu5"}, {"type": "exercise", "title": "Correct the verbs", "difficulty": "easy", "minutes": 8, "goal": "Correct: 'Each soldier salute with pride while the commander and his assistants inspects the parade. The sound of marching feet echo through the air as a group of cadets prepare for their drill. Meanwhile, a convoy of military vehicles pass by, drawing cheers.'", "checklist": ["salutes", "inspect", "echoes", "prepares", "passes"], "solution": "Each soldier salutes with pride while the commander and his assistants inspect the parade. The sound of marching feet echoes through the air as a group of cadets prepares for their drill. Meanwhile, a convoy of military vehicles passes by, drawing cheers.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-03-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Know the expressions: foil the plan, hold their ground, deliver a blow.", "Nouns end -ce, verbs end -se: advice/advise, practice/practise.", "A verb agrees with its true subject."]}], "id": "ch02-03-valour-language", "chapter": "ch02", "kind": "lesson", "minutes": 45}, "ch02-04-valour-skills": {"title": "A Tale of Valour: listen, speak, write, explore", "summary": "Listen to a talk on the Param Vir Chakra, speak on serving the nation, write a letter of enquiry.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to a talk on the Param Vir Chakra, speak on serving the nation, write a letter of enquiry."}, {"type": "read", "title": "Let us listen: the Param Vir Chakra", "label": "Listen", "md": "The Param Vir Chakra is one of India's most prestigious awards. Its name means the Wheel of the Ultimate Brave. It is given for exemplary bravery in the presence of the enemy. It was instituted as a gallantry medal with effect from 15 August 1947 by Dr. Rajendra Prasad, the President of India. Mrs. Savitri Khanolkar designed it, taking inspiration from Sage Dadhichi, a Vedic rishi who gave up his body so that the gods could make the Vajra, or thunderbolt, from his spine. The medal is cast in bronze. In the centre is the State Emblem, surrounded by four replicas of Indra's Vajra with lotus flowers.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen and fill in", "questions": [{"type": "fill", "q": "The Param Vir Chakra signifies the 'Wheel of the Ultimate ______'.", "answer": "Brave", "explanation": "Wheel of the Ultimate Brave.", "hints": ["Opposite of coward."]}, {"type": "fill", "q": "It is awarded for exemplary bravery while fighting the ______.", "answer": "enemy", "explanation": "enemy.", "hints": ["Opponent."]}, {"type": "fill", "q": "Introduced as a Gallantry Medal in 1947 by the ______. (one title)", "answer": "President", "explanation": "Dr. Rajendra Prasad, the President of India.", "hints": ["Head of state."]}, {"type": "fill", "q": "Sage Dadhichi was a ______.", "answer": ["Vedic rishi", "rishi"], "explanation": "Vedic rishi.", "hints": ["A sage."]}, {"type": "fill", "q": "The emblem is surrounded by the Vajra and ______.", "answer": ["lotus flowers", "lotus"], "explanation": "Lotus flowers.", "hints": ["A water flower."]}], "id": "ch02-04-qu1"}, {"type": "exercise", "title": "Speak: serving the nation", "difficulty": "easy", "minutes": 8, "goal": "In groups of 4-5, talk about how you propose to serve your nation. Choose a theme: saving the environment, health and well-being, helping others, or righteous conduct. Use prompts like 'I believe one of the best ways to serve the nation is by...'.", "checklist": ["Used at least three prompts", "Gave a reason and an example"], "solution": "I believe one of the best ways to serve the nation is by saving water. A small change we can make is closing the tap while brushing, and it will have a big impact because millions of families do it. If everyone contributes, we can avoid shortages.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-04-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a letter of enquiry", "difficulty": "medium", "minutes": 15, "goal": "Your school wishes to visit a memorial in your state. Write to the in-charge asking about dates, duration of the tour, entry fees and guidelines for student groups. Follow the layout: sender's address, date, receiver's address, subject, 'Dear Sir', three paragraphs, 'Yours sincerely', name.", "checklist": ["Layout correct", "Para 1 states the purpose", "Para 2 asks details with 'Firstly... Secondly... Lastly...'", "Para 3 requests an early reply"], "solution": "Subject: Enquiry about a School Visit to a Memorial\nDear Sir,\nThis is to enquire about a school visit to the war memorial. Could you please provide details about visiting dates?\nFirstly, I request you to share the available dates. Secondly, I would appreciate it if you could explain the duration of the tour. I would also be grateful to get details on entry fees. Lastly, could you clarify any guidelines for student groups?\nAn early reply will be greatly appreciated, as it will help us plan. I look forward to your guidance and support.\nYours sincerely,\nPriya Nair", "solution_lang": "text", "hints": ["Be formal, no slang."], "id": "ch02-04-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Explore: gallantry awards", "questions": [{"type": "single", "q": "Which is India's highest military gallantry award?", "options": ["Param Vir Chakra", "Maha Vir Chakra", "Vir Chakra"], "answer": 0, "explanation": "Highest.", "hints": ["Param = supreme."]}, {"type": "single", "q": "Which PVC awardee is remembered as 'Shershah of Kargil'?", "options": ["Captain Vikram Batra", "Major Somnath Sharma"], "answer": 0, "explanation": "Captain Vikram Batra.", "hints": ["Kargil."]}, {"type": "single", "q": "Birsa Munda is known among the people of Jharkhand as ______.", "options": ["Dharti Aaba", "Vir Chakra", "Shershah", "Param Vir"], "answer": 0, "explanation": "Father of the Land.", "hints": ["Land."]}], "id": "ch02-04-qu2"}, {"type": "exercise", "title": "Explore: women in the Army and patriotic songs", "difficulty": "easy", "minutes": 8, "goal": "Find out the key roles of women in the Indian Army and list patriotic songs from your language/region.", "checklist": ["Named two roles", "Listed three songs"], "solution": "Women serve as officers in the Corps of Engineers, Signals, Medical and Military Police, and in combat support. Songs: Vande Mataram, Sare Jahan Se Achha, Mera Desh Hua Re Roshan.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-04-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["A letter of enquiry is formal and asks specific questions.", "The PVC is cast in bronze with the State Emblem and four Vajras.", "Captain Vikram Batra was the last PVC awardee in the book's list."]}], "id": "ch02-04-valour-skills", "chapter": "ch02", "kind": "lesson", "minutes": 40}, "ch02-05-mother-poem": {"title": "Somebody's Mother: warm-up and the poem", "summary": "Think about helping others, learn what 'ragged' means and read the poem by Mary Dow Brine.", "blocks": [{"type": "text", "md": "**In this lesson:** Think about helping others, learn what 'ragged' means and read the poem by Mary Dow Brine."}, {"type": "exercise", "title": "Recall a time you helped someone", "difficulty": "easy", "minutes": 8, "goal": "Write two words for (1) how you felt after helping and (2) how the person you helped might have felt. Share them.", "checklist": ["Two words each"], "solution": "I felt happy and proud. The person felt relieved and thankful.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-05-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Old person or student?", "questions": [{"type": "multi", "q": "Which words go with an ELDERLY person?", "options": ["strong", "worried", "trembling", "hastening", "firm", "bent", "merry", "grey", "slow", "guide", "helpful"], "answer": [1, 2, 5, 7, 8], "explanation": "Worried, trembling, bent, grey and slow describe the old woman. Strong, hastening, firm, merry, guide and helpful describe the schoolboys.", "hints": ["Think of the poem's two characters."]}, {"type": "single", "q": "'The woman was old and ragged and grey.' 'Ragged' here means ______.", "options": ["(of clothes) old and torn; shabby", "having an uneven edge", "not smooth or regular", "very tired"], "answer": 0, "explanation": "Her clothes are shabby.", "hints": ["Clothes."]}], "id": "ch02-05-qu1"}, {"type": "read", "title": "Somebody's Mother by Mary Dow Brine (public domain)", "label": "Read", "md": "The woman was old and ragged and grey\nAnd bent with the chill of the Winter's day.\nThe street was wet with a recent snow\nAnd the woman's feet were aged and slow.\nShe stood at the crossing and waited long,\nAlone, uncared for, amid the throng\nOf human beings who passed her by\nNor heeded the glance of her anxious eyes.\nDown the street, with laughter and shout,\nGlad in the freedom of \"school let out,\"\nCame the boys like a flock of sheep,\nHailing the snow piled white and deep.\nPast the woman so old and grey\nHastened the children on their way.\nNor offered a helping hand to her —\nSo meek, so timid, afraid to stir\nLest the carriage wheels or the horses' feet\nShould crowd her down in the slippery street.\nAt last came one of the merry troop,\nThe gayest laddie of all the group;\nHe paused beside her and whispered low,\n\"I'll help you cross, if you wish to go.\"\nHer aged hand on his strong young arm\nShe placed, and so, without hurt or harm,\nHe guided the trembling feet along,\nProud that his own were firm and strong.\nThen back again to his friends he went,\nHis young heart happy and well content.\n\"She's somebody's mother, boys, you know,\nFor all she's aged and poor and slow\",\n\"And I hope some fellow will lend a hand\nTo help my mother, you understand\",\n\"If ever she's poor and old and grey,\nWhen her own dear boy is far away.\"\nAnd \"somebody's mother\" bowed low her head\nIn her home that night, and the prayer she said\nWas \"God be kind to the noble boy,\nWho is somebody's son, and pride and joy!\"", "note": "Mary Dow Brine's poem is from the 19th century and is in the public domain."}, {"type": "quiz", "title": "Arrange the events", "questions": [{"type": "order", "q": "Put the events of the poem in order.", "items": ["The old woman stood alone at the crossing, hesitant to move.", "A group of schoolboys passed by, playing and laughing.", "The children hurried past the old woman without offering help.", "The boy offered to help the old woman cross the street.", "The woman placed her hand on the boy's arm, and he guided her safely across.", "The boy returned to his friends, feeling proud of what he had done.", "The boy thought about his own mother and hoped someone would help her one day.", "The woman prayed for the boy who helped her."], "explanation": "Story order.", "hints": ["She waits first."]}], "id": "ch02-05-qu2"}, {"type": "quiz", "title": "Theme, tone and form", "questions": [{"type": "single", "q": "The central theme is ______.", "options": ["kindness and empathy", "adventure and courage"], "answer": 0, "explanation": "Helping a stranger.", "hints": ["Helping."]}, {"type": "single", "q": "The tone is ______.", "options": ["humorous and playful", "sympathetic and hopeful"], "answer": 1, "explanation": "The poet feels for the old woman and ends hopefully.", "hints": ["Feeling."]}, {"type": "single", "q": "The poem is in couplets with ______ lines in each stanza.", "options": ["four", "two"], "answer": 0, "explanation": "Each stanza has four lines (two couplets).", "hints": ["Count."]}, {"type": "single", "q": "The rhythmic flow reflects both the ______.", "options": ["narrative and emotions", "story's pace and message"], "answer": 0, "explanation": "The steady flow carries the story and its feeling. (Your teacher may accept either; discuss.)", "hints": ["Story + feeling."]}, {"type": "single", "q": "The rhyme scheme is ______.", "options": ["AABB", "ABAB"], "answer": 0, "explanation": "ragged/grey rhyme with day: grey-day, snow-slow.", "hints": ["Pairs."]}], "id": "ch02-05-qu3"}, {"type": "summary", "points": ["The poem shows empathy: a boy helps an old woman others ignore.", "Rhyme scheme AABB in four-line stanzas.", "'Somebody's mother' is repeated to remind us she is loved by someone."]}], "terms": [{"term": "empathy", "def": "understanding another person's feelings"}, {"term": "throng", "def": "a crowd"}], "id": "ch02-05-mother-poem", "chapter": "ch02", "kind": "lesson", "minutes": 15}, "ch02-06-mother-reflect": {"title": "Somebody's Mother: devices and reflection", "summary": "Poetic devices, imagery, extract questions and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Poetic devices, imagery, extract questions and long questions."}, {"type": "quiz", "title": "Devices and imagery", "questions": [{"type": "single", "q": "Which line has a simile?", "options": ["Came the boys like a flock of sheep", "The street was wet", "Hastened the children", "So meek, so timid"], "answer": 0, "explanation": "'Like a flock of sheep'.", "hints": ["Look for 'like'."]}, {"type": "single", "q": "Which is an example of repetition?", "options": ["'Somebody's mother'", "'carriage wheels'", "'school let out'", "'white and deep'"], "answer": 0, "explanation": "It is repeated in the poem.", "hints": ["Same words again."]}, {"type": "single", "q": "A phrase showing a bustling street:", "options": ["with laughter and shout", "The woman was old", "bent with the chill", "afraid to stir"], "answer": 0, "explanation": "Noise and movement.", "hints": ["Noise."]}, {"type": "fill", "q": "'The street was wet with a recent snow' suggests cold and ______ weather.", "answer": "slippery", "explanation": "It increases her helplessness.", "hints": ["She fears slipping."]}, {"type": "fill", "q": "Complete the analogy: The old woman: vulnerable and neglected :: The young boy: ______ and ______.", "answer": ["kind and caring", "caring and helpful", "kind and helpful", "strong and caring"], "explanation": "He is strong and kind.", "hints": ["Opposite of neglect."]}], "id": "ch02-06-qu1"}, {"type": "exercise", "title": "Alliteration and the repeated phrase", "difficulty": "easy", "minutes": 8, "goal": "Find one example of alliteration and explain why the poet repeats 'somebody's mother'.", "checklist": ["Found alliteration", "Explained the effect"], "solution": "Alliteration: 'wet with' / 'pride and joy' / 'Hastened ... helping hand'. The poet repeats 'somebody's mother' to remind us that every old person is dear to someone, so she deserves respect.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-06-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Extract 1: the old woman", "questions": [{"type": "single", "q": "'Ragged and grey' refers to ______.", "options": ["her emotional state", "her old and worn-out appearance", "the weather", "the colour of the street"], "answer": 1, "explanation": "Appearance.", "hints": ["Looks."]}, {"type": "fill", "q": "The woman was 'bent' with the chill because she was ______. (one word)", "answer": ["old", "weak", "frail", "cold", "aged"], "explanation": "Age made her bend further in the cold.", "hints": ["Old and cold."]}, {"type": "single", "q": "'The street was wet with recent snow' is a ______.", "options": ["fact", "opinion"], "answer": 0, "explanation": "It can be checked.", "hints": ["Observable."]}, {"type": "single", "q": "'The woman was too weak to cross alone' is a ______.", "options": ["fact", "opinion"], "answer": 1, "explanation": "A judgement.", "hints": ["Not provable."]}], "id": "ch02-06-qu2"}, {"type": "exercise", "title": "Why 'aged and slow'?", "difficulty": "easy", "minutes": 8, "goal": "Why are her feet described as 'aged and slow'?", "checklist": ["Mentions age", "Mentions slow walking"], "solution": "Her feet are slow because she is old and weak, so crossing a slippery road is hard for her.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-06-ex2", "mode": "selfcheck"}, {"type": "quiz", "title": "Extract 2: the boy", "questions": [{"type": "single", "q": "The contrast between trembling feet and firm strong feet emphasises ______.", "options": ["the boy's strength and her frailty, which is why she needs help", "that the boy is rude", "that the woman is rich", "the road's length"], "answer": 0, "explanation": "Strength vs weakness.", "hints": ["Contrast."]}, {"type": "single", "q": "The boy was 'proud that his feet were strong'. So he was ______.", "options": ["arrogant about being strong", "grateful for his ability to help"], "answer": 1, "explanation": "He is thankful for his strength.", "hints": ["Not boastful."]}, {"type": "single", "q": "What is the boy most likely to tell his friends?", "options": ["I'm so glad I could help her.", "I'm worried about her safety.", "I'm surprised she forgot to thank me.", "I'm thankful for your support."], "answer": 0, "explanation": "He returns happy.", "hints": ["Happy."]}, {"type": "fill", "q": "Fix: 'The young boy's actions were driven by a logical decision.' They were driven by ______.", "answer": ["empathy", "compassion", "kindness"], "explanation": "He acted from feeling.", "hints": ["Heart, not logic."]}], "id": "ch02-06-qu3"}, {"type": "exercise", "title": "Long questions 1-6", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) What might be the woman's fears? (2) How does the poet show her helplessness? (3) Why does the boy help and what does it show? (4) How is he different from the others? (5) Justify the title. (6) What does the poem say about empathy in society?", "checklist": ["Evidence from the poem", "Reasons"], "solution": "1) Slipping on the snow, being hit by carriages, being ignored.\n2) 'Alone, uncared for', 'meek, so timid, afraid to stir'.\n3) He sees her as someone's mother; he is kind and empathetic.\n4) The others hurried past; he stopped and offered help.\n5) The boy thinks of her as 'somebody's mother', so the title sums up the message.\n6) Empathy and humanity make society caring; small acts matter.", "solution_lang": "text", "hints": ["Quote short phrases."], "id": "ch02-06-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["The poet uses simile, repetition and imagery to show the old woman's helplessness.", "The boy acts from empathy.", "The title reminds us everyone is somebody's family."]}], "id": "ch02-06-mother-reflect", "chapter": "ch02", "kind": "lesson", "minutes": 40}, "ch02-07-mother-language": {"title": "Somebody's Mother: word study", "summary": "Antonyms, word meanings, 'hand' idioms, analogies and the word 'lest'.", "blocks": [{"type": "text", "md": "**In this lesson:** Antonyms, word meanings, 'hand' idioms, analogies and the word 'lest'."}, {"type": "quiz", "title": "Antonyms", "questions": [{"type": "single", "q": "Opposite of 'firm' (as in firm feet)", "options": ["fragile", "strong", "hard", "kind"], "answer": 0, "explanation": "firm vs fragile.", "hints": ["Weak."]}, {"type": "single", "q": "Opposite of 'merry'", "options": ["sad", "happy", "proud", "loud"], "answer": 0, "explanation": "merry vs sad.", "hints": ["Joyful's opposite."]}, {"type": "single", "q": "Opposite of 'kind'", "options": ["cruel", "gentle", "meek", "brave"], "answer": 0, "explanation": "kind vs cruel.", "hints": ["Harsh."]}, {"type": "single", "q": "Opposite of 'anxious'", "options": ["peaceful", "worried", "afraid", "tired"], "answer": 0, "explanation": "anxious vs peaceful.", "hints": ["Calm."]}, {"type": "single", "q": "Opposite of 'bent'", "options": ["straight", "old", "slow", "meek"], "answer": 0, "explanation": "bent vs straight.", "hints": ["Upright."]}, {"type": "single", "q": "Opposite of 'meek'", "options": ["bold", "timid", "kind", "slow"], "answer": 0, "explanation": "meek vs bold.", "hints": ["Confident."]}], "id": "ch02-07-qu1"}, {"type": "quiz", "title": "Match the word with the underlined phrase", "questions": [{"type": "single", "q": "hastened", "options": ["The students worked quickly to complete the project", "The mother heard the baby move slightly", "All the boxes were kept in a heap", "They came forward to help us"], "answer": 0, "explanation": "hastened = hurried.", "hints": ["Hurry."]}, {"type": "single", "q": "heeded", "options": ["The stranded people were brought to safety because they paid attention to our advice", "worked quickly", "kept in a heap", "gave support to the poor"], "answer": 0, "explanation": "heeded = paid attention.", "hints": ["Listened."]}, {"type": "single", "q": "stir", "options": ["The mother heard the baby move slightly", "worked quickly", "gave support", "came forward"], "answer": 0, "explanation": "stir = move slightly.", "hints": ["Move."]}, {"type": "single", "q": "lend", "options": ["It is our duty to give support to the poor", "kept in a heap", "paid attention", "moved slightly"], "answer": 0, "explanat
