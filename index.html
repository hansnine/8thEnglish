ion": "lend (a hand) = give support.", "hints": ["Give."]}, {"type": "single", "q": "piled", "options": ["All the boxes were kept in a heap at one place", "worked quickly", "moved slightly", "came forward"], "answer": 0, "explanation": "piled = heaped.", "hints": ["Heap."]}, {"type": "single", "q": "offered", "options": ["They came forward to help us when we were in need", "worked quickly", "heap", "moved"], "answer": 0, "explanation": "offered = came forward.", "hints": ["Volunteer."]}], "id": "ch02-07-qu2"}, {"type": "quiz", "title": "Idioms with 'hand'", "questions": [{"type": "single", "q": "get out of hand", "options": ["become difficult to control", "do something new", "applaud", "work together"], "answer": 0, "explanation": "Out of control.", "hints": ["Control."]}, {"type": "single", "q": "try your hand at something", "options": ["do something new", "applaud", "be very busy", "work together"], "answer": 0, "explanation": "Try.", "hints": ["New."]}, {"type": "single", "q": "give somebody a free hand", "options": ["allow somebody to do something with full freedom", "applaud", "be busy", "new"], "answer": 0, "explanation": "Freedom.", "hints": ["Free."]}, {"type": "single", "q": "give somebody a big hand", "options": ["applaud somebody", "do something new", "work together", "be busy"], "answer": 0, "explanation": "Clap.", "hints": ["Applause."]}, {"type": "single", "q": "work hand in hand", "options": ["work together", "applaud", "busy", "new"], "answer": 0, "explanation": "Together.", "hints": ["Together."]}, {"type": "single", "q": "have your hands full", "options": ["be very busy", "work together", "applaud", "new"], "answer": 0, "explanation": "Busy.", "hints": ["Busy."]}], "id": "ch02-07-qu3"}, {"type": "quiz", "title": "Analogies", "questions": [{"type": "fill", "q": "______ : winter :: heat : summer", "answer": "cold", "explanation": "Cold goes with winter.", "hints": ["Opposite of heat."]}, {"type": "fill", "q": "hurt : ______ :: old : aged", "answer": "harm", "explanation": "Synonyms.", "hints": ["From the poem."]}, {"type": "fill", "q": "whispered : shouted :: humble : ______", "answer": "proud", "explanation": "Opposites.", "hints": ["Opposite of humble."]}, {"type": "fill", "q": "eyes : ______ :: legs : walk", "answer": ["see", "glance", "look"], "explanation": "Eyes see; legs walk.", "hints": ["Function."]}, {"type": "fill", "q": "having a lot of money : wealthy :: densely packed people : ______", "answer": "throng", "explanation": "From the poem: 'amid the throng'.", "hints": ["A crowd."]}], "id": "ch02-07-qu4"}, {"type": "quiz", "title": "The word 'lest'", "questions": [{"type": "single", "q": "'She showed all the documents lest we doubt her' means ______.", "options": ["just in case we doubted her", "because we trusted her", "so we would doubt her", "after we doubted"], "answer": 0, "explanation": "Lest = just in case (to prevent).", "hints": ["Prevent something bad."]}], "id": "ch02-07-qu5"}, {"type": "summary", "points": ["Opposites: firm-fragile, merry-sad, kind-cruel, anxious-peaceful.", "'Lend a hand' means help.", "'Lest' means 'just in case'."]}], "id": "ch02-07-mother-language", "chapter": "ch02", "kind": "lesson", "minutes": 20}, "ch02-08-mother-skills": {"title": "Somebody's Mother: listen, speak, write, explore", "summary": "Listen to a news broadcast, practise -ed endings, narrate a helping incident and write a diary entry.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to a news broadcast, practise -ed endings, narrate a helping incident and write a diary entry."}, {"type": "read", "title": "Let us listen: a special news broadcast", "label": "Listen", "md": "Here is a special broadcast about a young hero. On a fateful morning in Rajouri, Rohan Ramchandra Bahir, a 15-year-old student, saved a woman who had fallen into the Domri River while washing clothes. She was forty-three and struggling to stay afloat in the strong currents. Rohan leapt into the river without any hesitation, risking his own life. With great determination he reached her and pulled her to safety. Onlookers who saw it were in awe of his bravery. His courage was honoured at Vigyan Bhawan, where President Droupadi Murmu gave him the Pradhan Mantri Rashtriya Bal Puraskar 2023. He shows that age is no barrier when it comes to saving lives.", "note": "Script written for this app from the textbook activity (adapted from a news report)."}, {"type": "quiz", "title": "Listen: order the events", "questions": [{"type": "order", "q": "Order the events of the news story.", "items": ["The woman falls into the Domri River while washing clothes.", "The woman struggles to stay afloat in strong currents.", "Rohan leaps into the river.", "Rohan pulls her to safety.", "Onlookers are in awe of his bravery.", "Rohan is honoured at Vigyan Bhawan."], "explanation": "Fall, struggle, rescue, awe, award.", "hints": ["Start with the fall."]}], "id": "ch02-08-qu1"}, {"type": "quiz", "title": "Listen: fill in", "questions": [{"type": "fill", "q": "The woman was struggling due to the strong ______.", "answer": "currents", "explanation": "'strong currents'.", "hints": ["River flow."]}, {"type": "fill", "q": "Rohan leapt in without any ______.", "answer": "hesitation", "explanation": "'without a moment's hesitation'.", "hints": ["Pause."]}, {"type": "fill", "q": "His act was witnessed by ______.", "answer": "onlookers", "explanation": "'Onlookers'.", "hints": ["Watchers."]}, {"type": "fill", "q": "He was honoured for his incredible courage and ______.", "answer": "bravery", "explanation": "'courage and bravery'.", "hints": ["Synonym of courage."]}, {"type": "fill", "q": "Age is no ______ when it comes to saving lives.", "answer": "barrier", "explanation": "'age is no barrier'.", "hints": ["Blocks."]}], "id": "ch02-08-qu2"}, {"type": "quiz", "title": "Speak: sounds of -ed endings", "questions": [{"type": "multi", "q": "Which words end with the /id/ sound?", "options": ["ragged", "aged (as an adjective)", "waited", "heeded", "offered", "paused", "guided", "whispered"], "answer": [0, 1, 2, 3, 6], "explanation": "Adjectives like ragged/aged and verbs ending in t/d + ed (waited, heeded, guided) take /id/.", "hints": ["Does it end in t or d before -ed?"]}, {"type": "multi", "q": "Which end with the /d/ sound?", "options": ["offered", "paused", "whispered", "waited"], "answer": [0, 1, 2], "explanation": "After voiced sounds -ed is /d/.", "hints": ["No extra syllable."]}], "id": "ch02-08-qu3"}, {"type": "exercise", "title": "Narrate an incident", "difficulty": "easy", "minutes": 8, "goal": "In pairs, narrate an incident where you helped someone (at school, in the neighbourhood, at the market or playground). Use prompts like 'It all started when...', 'At that moment, I realised...', 'This experience taught me the value of...'.", "checklist": ["Beginning, middle and end", "Used the prompts", "Told your feelings"], "solution": "It all started when I saw an old man carrying heavy bags at the market. I offered to carry them. A wave of joy washed over me. This experience taught me the value of kindness.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-08-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a diary entry", "difficulty": "medium", "minutes": 15, "goal": "Write a diary entry about a day you helped someone in need: day, whom, situation, place/time, how you helped, their reaction, your feelings, and why you'd do it again.", "checklist": ["Date and 'Dear Diary'", "All the points covered", "First person"], "solution": "26 April 2026, Saturday, 8:00 p.m.\nDear Diary, Today was a special day. On my way home at 5 p.m. I saw a blind man struggling at a busy crossing... I held his hand and guided him. He smiled and said thank you. I felt happy and useful. I will do this again because a little help means a lot.", "solution_lang": "text", "hints": ["Write as if talking to a friend."], "id": "ch02-08-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore", "difficulty": "easy", "minutes": 8, "goal": "(1) Earth as 'mother' in Atharva Veda: 'Earth is my mother and I am her child'. (2) Find countries that say 'motherland' and 'fatherland'. (3) Read 'A Nation's Strength' by Ralph Waldo Emerson. (4) Make a gratitude card for your mother or grandmother with five thanks and two things you will do to help.", "checklist": ["Found two countries", "Made the card"], "solution": "Motherland: India, Russia, Brazil. Fatherland: Germany, Netherlands. The card: 'Thank you for cooking, listening, teaching, ... I will lay the table and keep my room tidy.'", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-08-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Adjective forms like ragged and aged end in /id/.", "A diary entry is personal and written in first person.", "Empathy means feeling with others."]}], "id": "ch02-08-mother-skills", "chapter": "ch02", "kind": "lesson", "minutes": 40}, "ch02-09-kurien-story": {"title": "Verghese Kurien - I Too Had a Dream: warm-up and the letter", "summary": "Order the means of communication and hear Dr. Kurien's letter to his grandson.", "blocks": [{"type": "text", "md": "**In this lesson:** Order the means of communication and hear Dr. Kurien's letter to his grandson."}, {"type": "quiz", "title": "Timeline of communication", "questions": [{"type": "order", "q": "Arrange from oldest to newest.", "items": ["carrier pigeons", "postcard", "telegraph", "telephone", "mobile phone", "email"], "explanation": "Pigeons, postcard, telegraph, telephone, mobile phone, email.", "hints": ["Which was invented first?"]}], "id": "ch02-09-qu1"}, {"type": "exercise", "title": "Discuss", "difficulty": "easy", "minutes": 8, "goal": "In pairs: (1) reasons for change in means of communication; (2) the one you prefer and why; (3) benefits of social media and precautions against its misuse.", "checklist": ["Gave reasons", "Mentioned two precautions"], "solution": "1) People want faster, cheaper and easier contact. 2) I prefer messaging because it's quick. 3) Benefits: staying in touch, learning. Precautions: do not share passwords, avoid strangers, do not believe rumours.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-09-ex1", "mode": "selfcheck"}, {"type": "read", "title": "To My Grandson (short retelling)", "label": "Read", "md": "Dr. Verghese Kurien writes from Anand in 2005 to his grandson Siddharth. He says that today people are addicted to instant communication, but a phone call gives only fleeting joy, while a letter can be treasured and re-read for years. He hopes Siddharth will one day read it and understand why he chose a life of service to farmers.\n\nHe began working soon after independence, when the noblest task was to build an India free from hunger and poverty. About fifty years earlier he agreed to work for a small cooperative of dairy farmers. It was not the career he had planned. He could have been a metallurgist, an army officer or a rich NRI, but deep down he knew he could contribute more in Anand, Gujarat. His wife also gave up comforts and supported him with strength.\n\nHe says his achievements came from the work of many people and from values from his parents and his mentor Tribhuvandas Patel. The most important is integrity: being honest to yourself makes it easy to be honest to others. Life is a privilege and must not be wasted; accept responsibility, use your talents and contribute to the common good. Failure is not failing to succeed but not giving your best. Anything can go wrong, but happiness has little to do with circumstances, and comparing ourselves with others' 'perfect' images makes us forget what we have.\n\nHe recalls the Padma Vibhushan ceremony in 1999, when little Siddharth asked to keep the medal. They answered that the medal was his too, but his challenge was to earn his own reward. He ends by saying: if we are brave enough to love, strong enough to rejoice in another's happiness and wise enough to know there is enough for all, we have lived to the fullest. He dedicates the letter to Siddharth and all children, hoping they will work for the larger good.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Fact or opinion?", "questions": [{"type": "single", "q": "'Speaking on the telephone only gives us an immediate but fleeting joy.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "It's a judgement.", "hints": ["Can it be proved?"]}, {"type": "single", "q": "'I started my working life soon after our country became independent.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "A checkable event.", "hints": ["Time."]}, {"type": "single", "q": "'Service to farmers was not the career I had envisioned for myself.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "A statement about his own plans.", "hints": ["His plans."]}, {"type": "single", "q": "'I knew I could make a more meaningful contribution by working here.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "A belief.", "hints": ["Belief."]}, {"type": "single", "q": "'Values that I saw in my mentor Tribhuvandas Patel.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "He saw them.", "hints": ["Seen."]}, {"type": "single", "q": "'Life is a privilege, and to waste it would be wrong.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "A moral judgement.", "hints": ["Wrong?"]}, {"type": "single", "q": "'I hope that you will discover that failure is not about not succeeding.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "A hope.", "hints": ["Hope."]}, {"type": "single", "q": "'The ceremony in which the President awarded me the Padma Vibhushan in 1999.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "A dated event (though 'magnificent' is an opinion word).", "hints": ["1999."]}], "id": "ch02-09-qu2"}, {"type": "summary", "points": ["A letter can be treasured and re-read; a call is fleeting.", "Dr. Kurien chose service over a lucrative career.", "Fact = provable; opinion = belief or judgement."]}], "terms": [{"term": "integrity", "def": "honesty and strong moral principles"}, {"term": "humility", "def": "the quality of being humble"}], "id": "ch02-09-kurien-story", "chapter": "ch02", "kind": "lesson", "minutes": 20}, "ch02-10-kurien-reflect": {"title": "Verghese Kurien: think and reflect", "summary": "Extract and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Extract and long questions."}, {"type": "quiz", "title": "Extract 1: letters and calls", "questions": [{"type": "single", "q": "'A fast-paced world' means a world where ______.", "options": ["communication happens quickly but lacks depth", "people have more time to write and reflect"], "answer": 0, "explanation": "Quick but shallow.", "hints": ["Fast."]}, {"type": "single", "q": "(A) Writing letters can be treasured and re-read. (R) Speaking on the telephone provides long-lasting joy.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "Both false"], "answer": 2, "explanation": "The phone gives fleeting joy, so R is false.", "hints": ["Fleeting."]}, {"type": "truefalse", "q": "The writer feels letter-writing is a class apart from other kinds of writing.", "answer": true, "explanation": "He values written letters highly.", "hints": ["Re-read."]}, {"type": "single", "q": "Best title for the extract:", "options": ["The Rise of Instant Communication", "The Fleeting Delight of Phone Calls", "The Lasting Joy of Written Words", "Living in a Fast-paced World"], "answer": 2, "explanation": "The extract prefers writing.", "hints": ["Main idea."]}], "id": "ch02-10-qu1"}, {"type": "quiz", "title": "Extract 2: the grandmother", "questions": [{"type": "single", "q": "Which traits did the grandmother have EXCEPT? ______", "options": ["encouraging", "understanding", "comforting", "thoughtful"], "answer": 2, "explanation": "Anand could not offer comforts; she gave them up. She was encouraging, understanding and thoughtful. (If your teacher counts differently, discuss.)", "hints": ["She lived without comforts."]}, {"type": "single", "q": "Praising his wife shows he ______.", "options": ["truly values her role", "quietly accepts her role"], "answer": 0, "explanation": "He openly honours her.", "hints": ["Praise."]}, {"type": "single", "q": "Which phrase means 'showed grace under pressure'?", "options": ["shouldered my responsibilities with poise", "everlasting strength", "simple comforts", "took for granted"], "answer": 0, "explanation": "Poise = calm confidence.", "hints": ["Poise."]}], "id": "ch02-10-qu2"}, {"type": "exercise", "title": "How did she share his dedication?", "difficulty": "easy", "minutes": 8, "goal": "How can we say the grandmother shared her husband's dedication to a greater cause?", "checklist": ["Mentions the lack of comforts", "Mentions her support"], "solution": "She knew life in Anand lacked simple comforts yet ardently supported his choice and stood by him, giving him strength.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-10-ex1", "mode": "selfcheck"}, {"type": "exercise", "title": "Long questions 1-6", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) Which event does he mention with the Padma Vibhushan? (2) How did joining the Anand cooperative change his life? (3) How does his decision show his values? (4) Why did he write to his grandson? (5) Your opinion: 'life is a privilege and it is wrong to waste it'. (6) What message on selfless service?", "checklist": ["Evidence", "Own opinion for 5"], "solution": "1) A ceremony in Delhi in 1999 where the President gave him the award and Siddharth held the medal.\n2) He gave up other careers for a life of service to farmers and found a more meaningful life.\n3) He chose duty over money and comfort, showing integrity and service.\n4) To pass on his values and the joy of writing, and inspire his grandson.\n5) I agree: life gives us a chance to help others, and wasting it means wasting that chance.\n6) Selfless service creates lasting good for society, for generations.", "solution_lang": "text", "hints": ["Use the letter's own words in short."], "id": "ch02-10-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Letters last; calls fade.", "Integrity means being honest to yourself.", "The grandmother's support strengthened him."]}], "id": "ch02-10-kurien-reflect", "chapter": "ch02", "kind": "lesson", "minutes": 30}, "ch02-11-kurien-language": {"title": "Verghese Kurien: language practice", "summary": "Synonyms, expressions, dashes, its/it's, prepositional phrases and sentence building.", "blocks": [{"type": "text", "md": "**In this lesson:** Synonyms, expressions, dashes, its/it's, prepositional phrases and sentence building."}, {"type": "quiz", "title": "Synonyms (I)", "questions": [{"type": "fill", "q": "A magnificent ceremony = a ______ ceremony (essential/swift/lifelong/momentary/useful/splendid)", "answer": "splendid", "explanation": "splendid.", "hints": ["Grand."]}, {"type": "fill", "q": "fleeting joy = ______ joy", "answer": "momentary", "explanation": "momentary.", "hints": ["Short."]}, {"type": "fill", "q": "instant communication = ______ communication", "answer": "swift", "explanation": "swift.", "hints": ["Fast."]}, {"type": "fill", "q": "core values = ______ values", "answer": "essential", "explanation": "essential.", "hints": ["Basic."]}, {"type": "fill", "q": "valuable reminder = ______ reminder", "answer": "useful", "explanation": "useful.", "hints": ["Helpful."]}, {"type": "fill", "q": "abiding pleasure = ______ pleasure", "answer": "lifelong", "explanation": "lifelong.", "hints": ["Lasting."]}], "id": "ch02-11-qu1"}, {"type": "quiz", "title": "Expressions (II)", "questions": [{"type": "single", "q": "in all humility", "options": ["being humble with no self-importance", "truthful", "confident"], "answer": 0, "explanation": "Humble.", "hints": ["Humble."]}, {"type": "single", "q": "hold their heads high", "options": ["be confident and have a positive feeling", "look in awe", "speak truthfully"], "answer": 0, "explanation": "Proud.", "hints": ["Pride."]}, {"type": "single", "q": "to be quite honest", "options": ["to speak in a truthful way", "to look in awe", "deep inside"], "answer": 0, "explanation": "Truthful.", "hints": ["Honest."]}, {"type": "single", "q": "to the best of your ability", "options": ["using all your skills and knowledge", "in the innermost self", "with respect"], "answer": 0, "explanation": "Best effort.", "hints": ["Effort."]}, {"type": "single", "q": "looked at in awe", "options": ["observed with great respect and wonder", "truthfully", "humbly"], "answer": 0, "explanation": "Wonder.", "hints": ["Awe."]}, {"type": "single", "q": "somewhere deep down", "options": ["in the innermost part of the self", "very honestly", "with pride"], "answer": 0, "explanation": "Inside.", "hints": ["Inside."]}], "id": "ch02-11-qu2"}, {"type": "exercise", "title": "Words from words (III) and antakshari (IV)", "difficulty": "easy", "minutes": 8, "goal": "(1) Make as many words as you can from: important, magnificent, satisfied, generation, achievement. (2) Play the synonym antakshari: each synonym begins with the last letter of the previous one.", "checklist": ["At least 5 words for each", "Antakshari chain continued"], "solution": "important: port, tin, ant, impart, rim. magnificent: fine, gent, mint, cent, magic. satisfied: sat, fed, site, fire. generation: nation, ratio, gene, tone. achievement: hive, chain, ache, mine. Chain: major -> ... (important ends with T) trouble -> evil ...", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-11-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Dashes (V): en dash or em dash?", "questions": [{"type": "single", "q": "The conference will be held from March 15__March 20.", "options": ["en dash (–)", "em dash (—)"], "answer": 0, "explanation": "A range.", "hints": ["Range."]}, {"type": "single", "q": "I have lived in Kanpur__Raipur for five years (a route/span).", "options": ["en dash (–)", "em dash (—)"], "answer": 0, "explanation": "A range.", "hints": ["Between."]}, {"type": "single", "q": "The artist__known for her vibrant paintings__will be showcasing her work.", "options": ["en dash (–)", "em dash (—)"], "answer": 1, "explanation": "Extra information.", "hints": ["Interrupt."]}, {"type": "single", "q": "The scores for the final match were 2__3.", "options": ["en dash (–)", "em dash (—)"], "answer": 0, "explanation": "Score.", "hints": ["Numbers."]}, {"type": "single", "q": "My favourite snacks__samosas, pakoras and jalebis__are from India.", "options": ["en dash (–)", "em dash (—)"], "answer": 1, "explanation": "Extra information.", "hints": ["Extra."]}, {"type": "single", "q": "The train journey from Belagavi__Bengaluru takes under ten hours.", "options": ["en dash (–)", "em dash (—)"], "answer": 0, "explanation": "Range of places.", "hints": ["Between."]}, {"type": "single", "q": "I just finished reading the book__it was amazing!", "options": ["en dash (–)", "em dash (—)"], "answer": 1, "explanation": "Change of thought.", "hints": ["Break."]}, {"type": "single", "q": "The event will take place on September 1__September 5.", "options": ["en dash (–)", "em dash (—)"], "answer": 0, "explanation": "Dates.", "hints": ["Range."]}], "id": "ch02-11-qu3"}, {"type": "quiz", "title": "its / it's, your / you're, their / they're", "questions": [{"type": "single", "q": "Please bring ______ assignment book.", "options": ["your", "you're"], "answer": 0, "explanation": "Possession.", "hints": ["Of you."]}, {"type": "single", "q": "The team celebrated ______ victory.", "options": ["their", "they're"], "answer": 0, "explanation": "Possession.", "hints": ["Belonging to them."]}, {"type": "single", "q": "______ important to stay hydrated.", "options": ["Its", "It's"], "answer": 1, "explanation": "It is.", "hints": ["It is."]}, {"type": "single", "q": "I can't believe ______ going to the festival.", "options": ["your", "you're"], "answer": 1, "explanation": "You are.", "hints": ["You are."]}, {"type": "single", "q": "The students said ______ excited.", "options": ["they're", "their"], "answer": 0, "explanation": "They are.", "hints": ["They are."]}, {"type": "single", "q": "The tree lost ______ leaves.", "options": ["its", "it's"], "answer": 0, "explanation": "Possession.", "hints": ["Belonging."]}], "id": "ch02-11-qu4"}, {"type": "exercise", "title": "Prepositional phrases (VII) and jumbled sentences (VIII)", "difficulty": "medium", "minutes": 10, "goal": "Complete: The children played happily in ...; Nisha placed the vase on ...; We discussed the project in ...; Preethi found the lost book under ...; The cat slept on ... Then rearrange: (1) barked / at the strangers / the dog / loudly / the house / walking by (2) wrote / my classmate / during the / a story / summer vacations (3) enjoyed / under the trees / they / by the lake / a picnic (4) in his / grandfather's room / hung / he / the painting (5) studied / with great determination / for / the / students / exam", "checklist": ["Each phrase begins with a preposition", "Rearranged sentences make sense"], "solution": "The children played happily in the garden. Nisha placed the vase on the table. We discussed the project in the classroom. Preethi found the book under the bed. The cat slept on the sofa.\n1) The dog barked loudly at the strangers walking by the house.\n2) My classmate wrote a story during the summer vacations.\n3) They enjoyed a picnic by the lake under the trees.\n4) He hung the painting in his grandfather's room.\n5) The students studied for the exam with great determination.", "solution_lang": "text", "hints": ["A preposition + noun = a phrase."], "id": "ch02-11-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Em dashes add information; en dashes show ranges.", "It's = it is; its = belongs to it.", "Prepositional phrases give time, place and manner."]}], "id": "ch02-11-kurien-language", "chapter": "ch02", "kind": "lesson", "minutes": 40}, "ch02-12-kurien-skills": {"title": "Verghese Kurien: listen, speak, write, explore", "summary": "Listen to Evelyn Glennie's story, practise stress, sounds and chunking, write a letter, explore the revolutions.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to Evelyn Glennie's story, practise stress, sounds and chunking, write a letter, explore the revolutions."}, {"type": "read", "title": "Let us listen: Evelyn Glennie", "label": "Listen", "md": "Evelyn Glennie lost her hearing gradually. By the age of eleven her school performance had fallen and her headmistress urged her parents to see a specialist. It was found that nerve damage had badly impaired her hearing. She said everything suddenly looked black, but she decided to lead a normal life and follow her love of music. When she saw a girl play the xylophone, she wanted to play too. Most teachers discouraged her, but the percussionist Ron Forbes saw her potential. He tuned two large drums to different notes and told her not to listen through her ears but to sense the sound another way. She felt the higher drum from the waist up and the lower one from the waist down. She learned to open her mind and body to sounds and vibrations, which tingled in her skin, cheekbones and hair. With determination and hard work she became the world's most sought-after multi-percussionist, with a mastery of about a thousand instruments.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: word meanings", "questions": [{"type": "single", "q": "percussionist", "options": ["a person who plays drums and similar instruments", "damaged or weakened", "slow and steady over time", "the ability to keep going"], "answer": 0, "explanation": "Drummer.", "hints": ["Drums."]}, {"type": "single", "q": "impaired", "options": ["damaged or weakened", "physical sensations caused by sound", "a drummer", "slow and steady"], "answer": 0, "explanation": "Weakened.", "hints": ["Hearing."]}, {"type": "single", "q": "vibrations", "options": ["physical sensations caused by sound", "weakened", "drummer", "keep going"], "answer": 0, "explanation": "Felt in the body.", "hints": ["Feel."]}, {"type": "single", "q": "determination", "options": ["the ability to keep going despite difficulties", "weakened", "a drummer", "slow and steady"], "answer": 0, "explanation": "Persistence.", "hints": ["Persist."]}, {"type": "single", "q": "gradual", "options": ["slow and steady over time", "weakened", "drummer", "sensations"], "answer": 0, "explanation": "Slowly.", "hints": ["Little by little."]}], "id": "ch02-12-qu1"}, {"type": "quiz", "title": "Listen: true or false", "questions": [{"type": "truefalse", "q": "Evelyn Glennie became deaf suddenly.", "answer": false, "explanation": "Her loss was gradual.", "hints": ["Gradual."]}, {"type": "truefalse", "q": "Her headmistress ignored the signs.", "answer": false, "explanation": "She urged her parents to see a specialist.", "hints": ["She noticed."]}, {"type": "truefalse", "q": "Ron Forbes was a percussionist who helped Evelyn.", "answer": true, "explanation": "Yes.", "hints": ["Mentor."]}, {"type": "truefalse", "q": "Evelyn used her skin and bones to sense music.", "answer": true, "explanation": "Skin, cheekbones and body.", "hints": ["Body."]}, {"type": "truefalse", "q": "She gave up on music after her diagnosis.", "answer": false, "explanation": "She continued.", "hints": ["Determined."]}], "id": "ch02-12-qu2"}, {"type": "exercise", "title": "Listen: short answers", "difficulty": "easy", "minutes": 8, "goal": "(1) How did Evelyn turn her disability into strength? (2) What role did Ron Forbes play? (3) What can we learn about treating people with different abilities?", "checklist": ["One or two lines each"], "solution": "1) By sensing music through vibrations and working hard. 2) He was her mentor who taught her to feel sound. 3) We should support and respect people, focus on their abilities and not discourage them.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-12-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Speak: stress and sounds", "questions": [{"type": "single", "q": "PREsent (noun) or preSENT (verb): 'That common good will ____ itself to you.'", "options": ["preSENT (verb)", "PREsent (noun)"], "answer": 0, "explanation": "Verbs stress the second syllable.", "hints": ["Verb."]}, {"type": "single", "q": "Noun 'project' is stressed as ______.", "options": ["PROject", "proJECT"], "answer": 0, "explanation": "Nouns usually stress the first syllable.", "hints": ["Noun."]}, {"type": "single", "q": "Verb 'contract' (to shrink) is stressed as ______.", "options": ["conTRACT", "CONtract"], "answer": 0, "explanation": "Verb: second syllable.", "hints": ["Verb."]}, {"type": "multi", "q": "Which of these have the 'zhuh' sound (like treasure)?", "options": ["measure", "leisure", "reassure", "enclosure", "exposure", "ensure", "seizure", "composure"], "answer": [0, 1, 3, 4, 6, 7], "explanation": "Measure, leisure, enclosure, exposure, seizure and composure have /zh/. Ensure, reassure, unsure and fissure have /sh/.", "hints": ["Treasure and pleasure are /zh/."]}], "id": "ch02-12-qu3"}, {"type": "exercise", "title": "Chunking and pausing", "difficulty": "easy", "minutes": 8, "goal": "Read the lines of 'Don't Quit' with short pauses (/) and long pauses (//), then chunk 'Life is queer with its twists and turns...' and read it aloud.", "checklist": ["Used / and //", "Read smoothly"], "solution": "When things go wrong,/ as they sometimes will,// when the road you're trudging/ seems all uphill,// ... Life is queer/ with its twists and turns.// As everyone of us/ sometimes learns.//", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch02-12-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Write a letter to your grandparents", "difficulty": "medium", "minutes": 12, "goal": "Write a letter thanking your grandparents for the valuable lessons they taught you and how their wisdom shaped your values.", "checklist": ["Informal opening", "Thanks for specific lessons", "How their actions inspire you to help society", "Closing"], "solution": "Dear Grandma and Grandpa, thank you for teaching me honesty and for sharing stories each evening. Your habit of helping neighbours inspires me to volunteer at our colony library. With love, Asha.", "solution_lang": "text", "hints": ["Mention one story or lesson."], "id": "ch02-12-ex3", "mode": "selfcheck"}, {"type": "quiz", "title": "Explore: the revolutions", "questions": [{"type": "single", "q": "The White Revolution (milk) is linked to ______.", "options": ["Dr. Verghese Kurien", "Dr. M.S. Swaminathan", "Dr. Hiralal Chaudhuri"], "answer": 0, "explanation": "Milkman of India.", "hints": ["Milk."]}, {"type": "single", "q": "The Green Revolution (wheat and rice) was initiated by ______.", "options": ["Dr. M.S. Swaminathan", "Dr. Verghese Kurien", "Dr. Hiralal Chaudhuri"], "answer": 0, "explanation": "Bharat Ratna 2024.", "hints": ["Crops."]}, {"type": "single", "q": "The Blue Revolution focused on ______.", "options": ["fisheries", "milk", "wheat", "oil"], "answer": 0, "explanation": "Fish.", "hints": ["Blue = water."]}], "id": "ch02-12-qu4"}, {"type": "summary", "points": ["Verbs stress the second syllable, nouns the first (preSENT/PREsent).", "Chunking with pauses helps listeners.", "White, Green and Blue Revolutions boosted milk, crops and fish."]}], "id": "ch02-12-kurien-skills", "chapter": "ch02", "kind": "lesson", "minutes": 45}, "ch02-99-test": {"title": "Test: Unit 2: Values and Dispositions", "summary": "Check what you have learnt in Unit 2.", "blocks": [{"type": "quiz", "title": "Unit 2 test", "questions": [{"type": "single", "q": "Major Somnath Sharma's company was at Badgam to ______.", "options": ["patrol and assess threats near the airfield", "celebrate", "capture Pakistan", "train"], "answer": 0, "explanation": "They patrolled the village.", "hints": ["Patrol."]}, {"type": "single", "q": "His last words showed ______.", "options": ["total commitment to duty", "fear", "anger", "surrender"], "answer": 0, "explanation": "Fight to the last man.", "hints": ["Duty."]}, {"type": "single", "q": "A verb agrees with its ______.", "options": ["subject", "object", "adverb", "preposition"], "answer": 0, "explanation": "Subject-verb agreement.", "hints": ["Subject."]}, {"type": "single", "q": "The correct sentence is ______.", "options": ["Neither of the statements is true.", "Neither of the statements are true."], "answer": 0, "explanation": "'Neither' is singular.", "hints": ["Singular."]}, {"type": "single", "q": "The old woman waited at the crossing because ______.", "options": ["she was afraid of the slippery street and passers-by ignored her", "she was lost", "she enjoyed it", "she was waiting for a bus"], "answer": 0, "explanation": "Fear and neglect.", "hints": ["Alone."]}, {"type": "single", "q": "The rhyme scheme of 'Somebody's Mother' is ______.", "options": ["AABB", "ABAB", "ABCB"], "answer": 0, "explanation": "Pairs.", "hints": ["Couplets."]}, {"type": "single", "q": "'Lend a hand' means ______.", "options": ["help", "borrow", "clap", "wave"], "answer": 0, "explanation": "Help.", "hints": ["Help."]}, {"type": "single", "q": "Dr. Kurien thinks the most important value is ______.", "options": ["integrity", "wealth", "speed", "fame"], "answer": 0, "explanation": "Integrity.", "hints": ["Honest to yourself."]}, {"type": "single", "q": "A range such as 'pages 50–75' uses an ______.", "options": ["en dash", "em dash", "comma", "colon"], "answer": 0, "explanation": "Range.", "hints": ["Range."]}, {"type": "single", "q": "'______ important' (it is) is written ______.", "options": ["It's", "Its"], "answer": 0, "explanation": "Contraction.", "hints": ["It is."]}, {"type": "single", "q": "Evelyn Glennie sensed music through ______.", "options": ["vibrations in her body", "hearing aids", "lip-reading", "sight"], "answer": 0, "explanation": "Vibrations.", "hints": ["Body."]}, {"type": "single", "q": "The verb 'present' is stressed on the ______ syllable.", "options": ["second", "first"], "answer": 0, "explanation": "Verb.", "hints": ["preSENT."]}], "id": "ch02-99-qu1", "pass_score": 0.7, "mode": "test"}], "kind": "test", "id": "ch02-99-test", "chapter": "ch02", "minutes": 10}, "ch03-01-fifth-story": {"title": "The Case of the Fifth Word: warm-up and the story", "summary": "Warm up with anagrams and the word 'case', hear the story and check facts and character.", "blocks": [{"type": "text", "md": "**In this lesson:** Warm up with anagrams and the word 'case', hear the story and check facts and character."}, {"type": "quiz", "title": "Anagram clues (before we read I)", "questions": [{"type": "fill", "q": "Anagram of 'Declare' (across 3): ______", "answer": ["reclaed", "Declare"], "explanation": "This is the textbook's crossword clue; work it out in class. Practise: 'Heart' = earth, 'Sword' = words, 'Evil' = vile/live, 'Alps' = lapse/pals.", "hints": ["Rearrange the letters."]}, {"type": "single", "q": "'Heart' rearranged makes ______.", "options": ["earth", "hater", "rathe", "hearth"], "answer": 0, "explanation": "heart -> earth (also 'hater').", "hints": ["Planet."]}, {"type": "single", "q": "'Sown' rearranged makes ______.", "options": ["snow", "owns", "wons", "nows"], "answer": 0, "explanation": "sown -> snow (also 'owns').", "hints": ["Winter."]}, {"type": "single", "q": "'Loves' rearranged makes ______.", "options": ["solve", "voles", "lovely", "ovals"], "answer": 0, "explanation": "loves -> solve (also 'voles').", "hints": ["A detective does it."]}, {"type": "single", "q": "'Tool' rearranged makes ______.", "options": ["loot", "lotto", "toll", "oolt"], "answer": 0, "explanation": "tool -> loot, which appears in the story.", "hints": ["Stolen goods."]}], "id": "ch03-01-qu1"}, {"type": "quiz", "title": "Meanings of 'case' (II)", "questions": [{"type": "single", "q": "'That was not the case as he sang melodiously later.'", "options": ["situation", "container", "writing format", "matter"], "answer": 0, "explanation": "case = situation.", "hints": ["What is true."]}, {"type": "single", "q": "'The lawyer was waiting for the case to be taken up in court.'", "options": ["matter (legal matter)", "container", "format", "situation"], "answer": 0, "explanation": "case = a legal matter.", "hints": ["Court."]}, {"type": "single", "q": "'My pencil case is a gift.'", "options": ["container", "situation", "matter", "format"], "answer": 0, "explanation": "case = container.", "hints": ["Holds pencils."]}, {"type": "single", "q": "'The subject of a formal letter is written in title case.'", "options": ["writing format", "container", "matter", "situation"], "answer": 0, "explanation": "Title case = capital letters style.", "hints": ["Format."]}], "id": "ch03-01-qu2"}, {"type": "read", "title": "The Case of the Fifth Word (short retelling)", "label": "Read", "md": "Encyclopedia Brown lives in Idaville. His father is the Chief of Police. When the chief meets a case he cannot solve, he goes home for dinner, and Encyclopedia solves it before dinner ends. The boy's real name is Leroy, but he reads so much and remembers every fact that everyone calls him Encyclopedia. He never tells anyone he helps his father because he does not want to seem different.\n\nOn Tuesday evening Chief Brown stares at his soup, which means a mystery. He says Tim Nolan died yesterday. Five years ago two masked men held up the Diamond Mart and took a million dollars of jewellery. The chief always believed Nolan and Daniel Davenport, whom he met in prison, did it, but there was no proof. Davenport vanished after the robbery. The clerk was not sure she had recognised Nolan, and the jewellery was never found. Officers searched Nolan's house this morning with a court order and found nothing.\n\nNolan had a bad heart and a stroke. As he was dying he put his will on the kitchen table. It leaves everything, including his palm-tree nursery, to Davenport. A sheet from a desk calendar was clipped to it with Davenport's address and four strange words: Nom Utes Sweden Hurts. Mrs. Brown, an English teacher, explains the words one by one but cannot decode them. Encyclopedia asks if there is a young fir tree in the nursery. There is one, on the south side. He says the code tells where the jewellery is hidden: under the fifth word.\n\nThe four words are days of the week without 'day': Nom is Monday, Utes is Tuesday, Sweden is Wednesday and Hurts is Thursday. The missing fifth word is Fir, which is Friday. The jewellery was found in a twenty-gallon jug of earth in which the young fir tree grew.", "note": "This audio reads a short retelling in simple words made for this app. Read the full original in your textbook as well."}, {"type": "quiz", "title": "Complete with the reason (Let us discuss)", "questions": [{"type": "single", "q": "Everyone called Leroy 'Encyclopedia' because ______.", "options": ["his head was filled with facts like an encyclopedia", "he was tall", "he was a policeman", "he lived in a library"], "answer": 0, "explanation": "He read more than anyone and never forgot a fact.", "hints": ["Facts A to Z."]}, {"type": "single", "q": "Chief Brown stared at his soup because ______.", "options": ["he had a mystery he couldn't solve", "he disliked it", "he was ill", "he was angry"], "answer": 0, "explanation": "That was his sign of a puzzling case.", "hints": ["Mystery."]}, {"type": "single", "q": "Encyclopedia sat quietly because ______.", "options": ["he knew his parents were discussing the case for his benefit", "he was bored", "he was sleepy", "he was afraid"], "answer": 0, "explanation": "He understood the discussion was meant for him.", "hints": ["For his benefit."]}, {"type": "single", "q": "Nolan put the will on the kitchen table because ______.", "options": ["he realised he was dying and wanted Davenport to find it", "he was cooking", "he was hiding it", "he wanted the police to find it"], "answer": 0, "explanation": "He wanted to leave everything, and the coded clue, to Davenport.", "hints": ["Dying."]}], "id": "ch03-01-qu3"}, {"type": "reveal", "prompt": "Would Chief Brown need Leroy's help to solve this case? Why or why not?", "md": "Yes. Neither the chief nor Mrs. Brown could decode the four words. Leroy asked one clever question and solved the code."}, {"type": "summary", "points": ["Encyclopedia Brown solves cases at the dinner table.", "The four words are days of the week without 'day'.", "The unwritten fifth word, Fir, is Friday; the loot was under the fir tree."]}], "terms": [{"term": "anagram", "def": "a word made by rearranging the letters of another"}, {"term": "loot", "def": "stolen goods"}], "id": "ch03-01-fifth-story", "chapter": "ch03", "kind": "lesson", "minutes": 15}, "ch03-02-fifth-reflect": {"title": "The Case of the Fifth Word: facts, traits and reflection", "summary": "Facts and opinions, character traits, extracts and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Facts and opinions, character traits, extracts and long questions."}, {"type": "quiz", "title": "Fact or opinion?", "questions": [{"type": "single", "q": "'Everyone thought that Chief Brown must be the smartest police chief in the country.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "A belief.", "hints": ["'Thought'."]}, {"type": "single", "q": "'An encyclopedia is a book filled with facts from A to Z.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "A definition.", "hints": ["Checkable."]}, {"type": "single", "q": "'Leroy's friends said he was like a library and computer rolled into one, and more user-friendly.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "A comparison made by friends.", "hints": ["Opinion."]}, {"type": "single", "q": "'Two masked men held up the Diamond Mart on Sixth Avenue.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "An event.", "hints": ["Event."]}, {"type": "single", "q": "'Nolan and Davenport had met while both were in prison in South Carolina.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "Checkable.", "hints": ["Fact."]}, {"type": "single", "q": "'Chief Brown's hunch was that they decided to hide the loot.'", "options": ["Fact", "Opinion"], "answer": 1, "explanation": "A hunch is a feeling.", "hints": ["Hunch."]}, {"type": "single", "q": "'Nolan wrote a four-word code to tell Davenport where the jewellery was hidden.'", "options": ["Fact", "Opinion"], "answer": 0, "explanation": "Confirmed at the end of the story.", "hints": ["Story fact."]}], "id": "ch03-02-qu1"}, {"type": "quiz", "title": "Match evidence with traits", "questions": [{"type": "single", "q": "'He read more books than anyone in Idaville, and he never forgot a fact.'", "options": ["knowledgeable", "humble", "keen listener", "cleverness"], "answer": 0, "explanation": "Knowledgeable.", "hints": ["Knows a lot."]}, {"type": "single", "q": "'Encyclopedia never spoke of the help he gave his father. He didn't want to seem different.'", "options": ["humble", "knowledgeable", "gentle", "keen listener"], "answer": 0, "explanation": "Humble.", "hints": ["Not boastful."]}, {"type": "single", "q": "'Encyclopedia sat quietly. He knew his parents were discussing the case for his benefit.'", "options": ["keen listener", "humble", "cleverness", "gentle"], "answer": 0, "explanation": "Keen listener.", "hints": ["Listens."]}, {"type": "single", "q": "'He needed to ask only one question to solve a case before dessert.'", "options": ["cleverness", "gentle", "knowledgeable", "keen listener"], "answer": 0, "explanation": "Cleverness. (The extra word is 'gentle'.)", "hints": ["Quick."]}], "id": "ch03-02-qu2"}, {"type": "quiz", "title": "Extract 1: Leroy's secret", "questions": [{"type": "fill", "q": "Chief Brown's dilemma is unique because nobody would believe that the best detective alive is an ______ grader.", "answer": "eighth", "explanation": "Nobody would believe an eighth grader is the best detective.", "hints": ["Grade."]}, {"type": "single", "q": "Why did Encyclopedia not speak of his help?", "options": ["He wants to blend in and not seem different from other boys.", "He is shy and lacks confidence.", "He fears jealousy.", "He is embarrassed."], "answer": 0, "explanation": "'He didn't want to seem different from other boys.'", "hints": ["Fit in."]}, {"type": "single", "q": "Which reason for his parents calling him Leroy is FALSE?", "options": ["They want him to be remembered as different from the others around.", "He is more than his abilities; he is their child.", "It reflects affection and treats him as an ordinary boy."], "answer": 0, "explanation": "They want him to be an ordinary boy, not 'different'.", "hints": ["Opposite of ordinary."]}, {"type": "single", "q": "'Stuck with the name' means ______.", "options": ["he could not get rid of the nickname", "he liked it", "he glued it", "he chose it"], "answer": 0, "explanation": "Unable to change it.", "hints": ["Stuck."]}], "id": "ch03-02-qu3"}, {"type": "quiz", "title": "Extract 2: the four words", "questions": [{"type": "single", "q": "Chief Brown shaking his head shows ______.", "options": ["he is confused and cannot make sense of the words", "he is confident", "he thinks the words are random", "he thinks they are unrelated"], "answer": 0, "explanation": "He cannot decode them.", "hints": ["Confused."]}, {"type": "truefalse", "q": "Mrs. Brown explained the actual meanings of the words rather than decoding the hidden message.", "answer": true, "explanation": "She said what each word means (nominative, a tribe, a country).", "hints": ["Dictionary vs code."]}, {"type": "single", "q": "The purpose of Encyclopedia's reminder 'Davenport disappeared right after the hold-up' was to ______.", "options": ["imply that the message was likely a clue about the stolen jewellery's hiding place", "refocus on the crime", "show he was bored"], "answer": 0, "explanation": "He wants them to think of the loot.", "hints": ["Where is the loot?"]}], "id": "ch03-02-qu4"}, {"type": "exercise", "title": "Long questions 1-7", "difficulty": "medium", "minutes": 18, "goal": "Answer: (1) Nolan and Davenport were close: evidence. (2) Why did Davenport disappear after the hold-up? What would he have done if Nolan had not died? (3) What does Mrs. Brown's interest tell us? (4) Why was Chief Brown proud? (5) Why were the chief's suspicions justified? (6) Role of the coded message. (7) A character sketch of Leroy.", "checklist": ["Evidence", "Reasons", "Opening line of sketch given"], "solution": "1) They met in prison, became friends and Davenport lived with Nolan a week before the robbery; Nolan left him everything.\n2) He hid to avoid arrest; he would later return for the loot when it was safe.\n3) She listens, remembers details and tries to decode the words, showing curiosity and intelligence.\n4) His son solves cases the police cannot, though he is only a child.\n5) Their friendship, the timing of Davenport's stay and disappearance, and the will all point to them.\n6) It leads to the loot; it is the puzzle that shows Leroy's cleverness.\n7) Encyclopedia was a knowledgeable eighth grader who never forgot a fact. He was clever, humble and a keen listener, solving cases with one question.", "solution_lang": "text", "hints": ["Use the traits table."], "id": "ch03-02-ex1", "mode": "selfcheck"}, {"type": "summary", "points": ["A fact can be proved; an opinion cannot.", "Leroy is knowledgeable, humble, a keen listener and clever.", "The code worked by dropping 'day' and rearranging letters."]}], "id": "ch03-02-fifth-reflect", "chapter": "ch03", "kind": "lesson", "minutes": 30}, "ch03-03-fifth-language": {"title": "The Case of the Fifth Word: language practice", "summary": "Phrasal verbs, homophones, relative words and reported questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Phrasal verbs, homophones, relative words and reported questions."}, {"type": "quiz", "title": "Phrasal verbs (I)", "questions": [{"type": "single", "q": "put on", "options": ["wear", "appeared", "solve", "calmed"], "answer": 0, "explanation": "wear (clothes).", "hints": ["Clothes."]}, {"type": "single", "q": "cooled down", "options": ["became normal or calmed", "appeared", "wear", "escaped"], "answer": 0, "explanation": "calmed.", "hints": ["Calm."]}, {"type": "single", "q": "turned up", "options": ["appeared, been discovered", "wear", "solve", "calmed"], "answer": 0, "explanation": "appeared.", "hints": ["Showed up."]}, {"type": "single", "q": "make of", "options": ["have an idea or understanding of something", "wear", "escaped", "appeared"], "answer": 0, "explanation": "understand.", "hints": ["Opinion."]}, {"type": "single", "q": "figure out", "options": ["solve a problem", "wear", "escaped", "calmed"], "answer": 0, "explanation": "solve.", "hints": ["Work out."]}, {"type": "single", "q": "got away with", "options": ["escaped without being punished", "solved", "wore", "appeared"], "answer": 0, "explanation": "escaped punishment.", "hints": ["Escaped."]}, {"type": "fill", "q": "Finally, some important evidence about the case has ______.", "answer": "turned up", "explanation": "turned up.", "hints": ["Appeared."]}, {"type": "fill", "q": "After I ______, I understood that I had made a big mistake.", "answer": "cooled down", "explanation": "cooled down.", "hints": ["Calmed."]}, {"type": "fill", "q": "I couldn't ______ why he was angry with me.", "answer": "figure out", "explanation": "figure out.", "hints": ["Work out."]}, {"type": "fill", "q": "He ______ his special coat and went to the party.", "answer": "put on", "explanation": "put on.", "hints": ["Wore."]}, {"type": "fill", "q": "Ravi forgets his homework but he ______ it as the teacher didn't ask.", "answer": "got away with", "explanation": "got away with.", "hints": ["Escaped."]}, {"type": "fill", "q": "I do not know what to ______ his behaviour.", "answer": "make of", "explanation": "make of.", "hints": ["Opinion."]}], "id": "ch03-03-qu1"}, {"type": "quiz", "title": "Homophones (II)", "questions": [{"type": "fill", "q": "After running 50 km last ______, I felt ______ for two days. (week/weak)", "answer": "week, weak", "explanation": "week (7 days), weak (not strong).", "hints": ["Two words."]}, {"type": "fill", "q": "The committee brought ______ local cases to the ______. (fore/four)", "answer": "four, fore", "explanation": "four cases to the fore (front).", "hints": ["Number first."]}, {"type": "fill", "q": "Too much force on the ______ caused the car to ______ down. (break/brake)", "answer": "brake, break", "explanation": "brake (pedal), break down (stop working).", "hints": ["Pedal first."]}, {"type": "fill", "q": "A beautiful ______ of music to bring ______ to thousands. (peace/piece)", "answer": "piece, peace", "explanation": "piece of music; bring peace.", "hints": ["Part first."]}, {"type": "fill", "q": "Busy ______ her hair, not caring about the ______ flowers. (dying/dyeing)", "answer": "dyeing, dying", "explanation": "dyeing = colouring; dying = about to die.", "hints": ["Colour first."]}], "id": "ch03-03-qu2"}, {"type": "quiz", "title": "Rebus puzzles (III)", "questions": [{"type": "single", "q": "SECRET written on top of another SECRET stands for ______.", "options": ["Top secret", "Double secret", "Big secret", "Hidden"], "answer": 0, "explanation": "Textbook example.", "hints": ["On top."]}, {"type": "single", "q": "'AGED AGED AGED' (three times) stands for ______.", "options": ["Aged three times", "Three ages", "Old, older, oldest", "Triple aged"], "answer": 0, "explanation": "A rebus: three times aged. Discuss your own readings in class.", "hints": ["Count."]}, {"type": "single", "q": "'M1LLION R O A D S' hints at ______.", "options": ["a million roads (a million, then roads in a row)", "a road", "mill", "1 road"], "answer": 0, "explanation": "A rebus of roads in a row.", "hints": ["Read it aloud."]}], "id": "ch03-03-qu3"}, {"type": "quiz", "title": "Spoonerisms (IV)", "questions": [{"type": "single", "q": "'knowing sits' is a spoonerism of ______.", "options": ["sewing kits", "nosing sits", "kitting so", "knows it"], "answer": 0, "explanation": "Swap the first sounds: knowing sits -> sewing kits? (swap k/n with s: 'sewing kits' makes sense).", "hints": ["Swap initial sounds."]}, {"type": "single", "q": "'plaster man' swaps to ______.", "options": ["master plan", "plan master", "plastic man", "map blaster"], "answer": 0, "explanation": "master plan.", "hints": ["Swap p and m."]}, {"type": "single", "q": "'blarm wanket' swaps to ______.", "options": ["warm blanket", "blue market", "blank warm", "wet barn"], "answer": 0, "explanation": "warm blanket.", "hints": ["Swap b and w."]}, {"type": "single", "q": "'tars and crucks' swaps to ______.", "options": ["cars and trucks", "stars and cuts", "tracks", "cart sand"], "answer": 0, "explanation": "cars and trucks.", "hints": ["Swap t and c."]}, {"type": "single", "q": "'shake a tower' swaps to ______.", "options": ["take a shower", "make a flower", "shower a take", "sake a hower"], "answer": 0, "explanation": "take a shower.", "hints": ["Swap sh and t."]}, {"type": "single", "q": "'bead a rook' swaps to ______.", "options": ["read a book", "bear a hook", "bed a look", "rock bead"], "answer": 0, "explanation": "read a book.", "hints": ["Swap b and r."]}, {"type": "single", "q": "'mardon me padam' swaps to ______.", "options": ["pardon me madam", "mad pardon", "made a pardon", "padam mar"], "answer": 0, "explanation": "pardon me madam.", "hints": ["Swap m and p."]}], "id": "ch03-03-qu4"}, {"type": "quiz", "title": "Linking words (V)", "questions": [{"type": "fill", "q": "Detective stories keep readers guessing ______ the real culprit is.", "answer": "who", "explanation": "who.", "hints": ["Person."]}, {"type": "fill", "q": "... settings ______ clues are hidden carefully.", "answer": "where", "explanation": "where.", "hints": ["Place."]}, {"type": "fill", "q": "______ the mystery seems tricky, a clever detective finds answers.", "answer": "Though", "explanation": "Though (contrast).", "hints": ["Contrast."]}, {"type": "fill", "q": "Readers wonder ______ criminals leave small clues.", "answer": "why", "explanation": "why.", "hints": ["Reason."]}, {"type": "fill", "q": "Decide ______ suspect is guilty.", "answer": "which", "explanation": "which.", "hints": ["Choice."]}, {"type": "fill", "q": "______ the truth is revealed, everything makes sense.", "answer": "When", "explanation": "When.", "hints": ["Time."]}, {"type": "fill", "q": "One may wonder ______ they could have solved it themselves.", "answer": "if", "explanation": "if.", "hints": ["Whether."]}, {"type": "fill", "q": "These stories are fun ______ they make readers think.", "answer": "because", "explanation": "because.", "hints": ["Reason."]}], "id": "ch03-03-qu5"}, {"type": "exercise", "title": "Combine the sentences (VI)", "difficulty": "easy", "minutes": 8, "goal": "Combine: (2) We went to a place. The incident occurred there. (where) (3) Teacher said she would retire soon. She is now nearly sixty. (who) (4) It was the day. Half the class was absent. (when)", "checklist": ["Used the joining word given", "One sentence each"], "solution": "2) We went to the place where the incident occurred.\n3) The teacher, who is now nearly sixty, said she would retire soon.\n4) It was the day when half the class was absent.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-03-ex1", "mode": "selfcheck"}, {"type": "text", "md": "**Reporting questions.** Change the reporting verb to asked/inquired, change the question into a statement, shift the tense back, drop the quotation marks and question mark, and use the wh-word (or if/whether for yes/no). Pronouns, time and place words change too: now->then, today->that day, tomorrow->the next day, yesterday->the day before, here->there."}, {"type": "quiz", "title": "Report these questions (VII-IX)", "questions": [{"type": "single", "q": "'What's suspicious about that?' Mrs. Brown asked.", "options": ["Mrs. Brown asked what was suspicious about that.", "Mrs. Brown asked what's suspicious about that?", "Mrs. Brown asked that what was suspicious.", "Mrs. Brown asked was it suspicious."], "answer": 0, "explanation": "wh-word + statement order + past tense.", "hints": ["No question mark."]}, {"type": "single", "q": "'Is there a young fir tree in the nursery?' Encyclopedia asked.", "options": ["Encyclopedia asked if there was a young fir tree in the nursery.", "Encyclopedia asked is there a young fir tree.", "Encyclopedia asked that there was a fir tree.", "Encyclopedia asked where the fir tree was."], "answer": 0, "explanation": "Yes/no -> if/whether.", "hints": ["Use if."]}, {"type": "single", "q": "Rohan: 'Why did you stop talking to me?'", "options": ["Rohan questioned why I had stopped talking to him.", "Rohan questioned why did I stop talking to him.", "Rohan questioned that why I stopped.", "Rohan questioned if I stop talking."], "answer": 0, "explanation": "Past -> past perfect; you -> I; me -> him.", "hints": ["Past perfect."]}, {"type": "single", "q": "My aunt: 'Did you enjoy the family gathering yesterday?'", "options": ["My aunt asked if I had enjoyed the family gathering the day before.", "My aunt asked did I enjoy it yesterday.", "My aunt asked whether I enjoy it.", "My aunt asked that I enjoyed it."], "answer": 0, "explanation": "yesterday -> the day before.", "hints": ["Time shift."]}, {"type": "single", "q": "Grandmother: 'When will you visit us again?'", "options": ["My grandmother inquired when I would visit them again.", "My grandmother inquired when will I visit us again.", "My grandmother inquired if I will visit.", "My grandmother inquired when I visited."], "answer": 0, "explanation": "will -> would; us -> them.", "hints": ["Would."]}, {"type": "single", "q": "Madavi to Ravi: 'Will you come with me to meet our old teacher tomorrow?'", "options": ["Madavi asked Ravi if he would go with her to meet their old teacher the next day.", "Madavi asked Ravi will he come.", "Madavi asked Ravi that he would go.", "Madavi asked Ravi when he would come."], "answer": 0, "explanation": "tomorrow -> the next day.", "hints": ["Pronouns."]}, {"type": "single", "q": "A friend: 'What gift are you planning to give your brother?'", "options": ["My friend inquired what gift I was planning to give my brother.", "My friend inquired what gift am I planning.", "My friend inquired if I planned a gift.", "My friend inquired that what gift."], "answer": 0, "explanation": "are -> was.", "hints": ["Progressive past."]}, {"type": "single", "q": "Veenu: 'Shall I carry these notebooks to the staffroom, Ma'am?'", "options": ["Veenu asked her teacher if she should carry those notebooks to the staffroom.", "Veenu asked her teacher shall she carry.", "Veenu asked her teacher that she would carry.", "Veenu asked her teacher where."], "answer": 0, "explanation": "shall -> should; these -> those.", "hints": ["this/these -> that/those."]}], "id": "ch03-03-qu6"}, {"type": "exercise", "title": "Aditi and Rahul", "difficulty": "easy", "minutes": 8, "goal": "Complete: Aditi asked Rahul (1) if he had seen anyone leave a package near the lift. (2) what time he had seen it happen. Aditi further inquired (3) if he had been able to see his face.", "checklist": ["if for yes/no", "what time for wh-question"], "solution": "1) if he had seen anyone leave a package near the lift.\n2) what time he had seen this happen.\n3) whether he had been able to see his face.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-03-ex2", "mode": "selfcheck"}, {"type": "summary", "points": ["Phrasal verbs: put on, cool down, turn up, make of, figure out, get away with.", "Reported questions use if/whether (yes/no) or the wh-word, with statement order.", "Tenses shift back and time words change."]}], "id": "ch03-03-fifth-language", "chapter": "ch03", "kind": "lesson", "minutes": 50}, "ch03-04-fifth-skills": {"title": "The Case of the Fifth Word: listen, speak, write, explore", "summary": "Listen to a podcast on observation, practise pronunciation, discuss, write a report and explore.", "blocks": [{"type": "text", "md": "**In this lesson:** Listen to a podcast on observation, practise pronunciation, discuss, write a report and explore."}, {"type": "read", "title": "Let us listen: improving observation skills", "label": "Listen", "md": "Being observant is not just seeing, it is truly noticing the details around us. Observation can make us more aware, help decisions and improve memory. First, slow down and take your time, because rushing leads to missed details. Second, engage all your senses: hearing, smelling, touching and even tasting. The more senses you use, the more information you absorb. Third, ask questions. Curious people tend to be better observers because they try to understand what they notice. Fourth, take notes or make sketches, which reinforce the details in your memory. Finally, practise mindfulness, which helps you stay present with your surroundings. Add these habits to your routine and you will soon notice things you never saw before.", "note": "Script written for this app from the textbook activity."}, {"type": "quiz", "title": "Listen: true or false", "questions": [{"type": "truefalse", "q": "Observation skills help improve your common sense.", "answer": false, "explanation": "The podcast says they make you more aware, help decisions and improve memory, not common sense.", "hints": ["Listen to the benefits."]}, {"type": "truefalse", "q": "Rushing through tasks helps you focus better.", "answer": false, "explanation": "Rushing leads to missed details.", "hints": ["Slow down."]}, {"type": "truefalse", "q": "Taking notes or making sketches helps with what you observe.", "answer": true, "explanation": "It reinforces details in memory.", "hints": ["Notes."]}, {"type": "truefalse", "q": "Incorporating these tips will soon lead to success.", "answer": false, "explanation": "The podcast says you will soon notice things you never noticed before.", "hints": ["Compare 'success' with 'noticing'."]}], "id": "ch03-04-qu1"}, {"type": "quiz", "title": "Listen: fill in", "questions": [{"type": "fill", "q": "Slow down and ______ to notice several aspects more clearly.", "answer": ["take your time"], "explanation": "take your time.", "hints": ["Not hurry."]}, {"type": "fill", "q": "The more senses you use, the more ______ you absorb.", "answer": "information", "explanation": "information.", "hints": ["Data."]}, {"type": "fill", "q": "People who are ______ tend to be better observers.", "answer": "curious", "explanation": "curious.", "hints": ["Ask questions."]}, {"type": "fill", "q": "Making notes reinforces the ______ in your memory.", "answer": "details", "explanation": "details.", "hints": ["Small facts."]}, {"type": "fill", "q": "Mindfulness helps you stay ______ with their surroundings.", "answer": "present", "explanation": "present.", "hints": ["In the moment."]}], "id": "ch03-04-qu2"}, {"type": "quiz", "title": "Speak: pronunciation", "questions": [{"type": "single", "q": "'jewellery' is pronounced ______.", "options": ["jool-ree", "joo-well-ery", "jew-ell-airy", "jool-ery"], "answer": 0, "explanation": "jool-ree.", "hints": ["Short."]}, {"type": "single", "q": "'clerk' is pronounced ______.", "options": ["claak", "clurk", "clark-er", "klek"], "answer": 0, "explanation": "claak (British).", "hints": ["Rhymes with 'park'."]}, {"type": "single", "q": "'dessert' is pronounced ______.", "options": ["dih-zuht", "dess-urt", "dee-sert", "dih-sert"], "answer": 0, "explanation": "dih-zuht: the stress is on the second syllable.", "hints": ["Sweet dish."]}, {"type": "single", "q": "'Wednesday' is pronounced ______.", "options": ["wenz-day", "wed-nes-day", "wen-day", "weds-day"], "answer": 0, "explanation": "wenz-day.", "hints": ["Silent d."]}], "id": "ch03-04-qu3"}, {"type": "exercise", "title": "Group discussion: The Interesting Aspects of a Mystery Story", "difficulty": "easy", "minutes": 8, "goal": "In groups of five or six hold a discussion with a moderator. Use phrases for turn-taking, agreeing and disagreeing.", "checklist": ["Moderator opens and sums up", "Used 'If I may say something...'", "Agreed and disagreed politely", "Everyone spoke"], "solution": "Moderator: Welcome. Let us discuss what makes a mystery interesting. Speaker 1: If I may say something, the clues keep us guessing. Speaker 2: I'm totally in agreement, and the twist at the end is great. Speaker 3: I'm afraid I don't agree; the detective's cleverness matters most.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-04-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Write: report format", "questions": [{"type": "multi", "q": "Which are features of a report such as the football tournament report?", "options": ["Title and byline", "Past tense", "Sequence markers like 'following', 'subsequently'", "Passive voice", "Dialogue between characters", "Paragraph 1 answers what, who, when, where"], "answer": [0, 1, 2, 3, 5], "explanation": "A report is factual, in past tense, in sequence, with a title and byline.", "hints": ["Facts about an event."]}], "id": "ch03-04-qu4"}, {"type": "exercise", "title": "Write a report: Inter-school Art Exhibition", "difficulty": "medium", "minutes": 18, "goal": "As a member of the Art and Craft Club, write a report on an Inter-school Art Exhibition organised by your school.", "checklist": ["Title and byline", "Para 1: what, who, when, where", "Paras 2-3: events in sequence, passive", "Para 4: prize giving and Chief Guest's remarks"], "solution": "Inter-school Art Exhibition by Meera, Class VIII\nAn Inter-school Art Exhibition was organised by our school on 10 and 11 January at the school hall. Eight schools participated. The exhibition was inaugurated by the Chief Guest, Mrs. Rao, an artist. Paintings, clay models and posters were displayed. Subsequently, the judges visited each stall. Finally, the first prize was won by St. Mary's School. Addressing students, the Chief Guest said, \"Keep creating.\" The exhibition was a great success.", "solution_lang": "text", "hints": ["Use 'was organised', 'were displayed'."], "id": "ch03-04-ex2", "mode": "selfcheck"}, {"type": "exercise", "title": "Explore", "difficulty": "easy", "minutes": 8, "goal": "(1) Optical illusions: look at the images and say what you see. (2) Play 'Name the Mystery Object' with three hints (20, 10, 5 points). (3) Find out how an encyclopedia differs from a dictionary. (4) Use a thesaurus for five words.", "checklist": ["Made three hints", "Explained encyclopedia vs dictionary", "Five synonym pairs"], "solution": "Hints for a blackboard: I display information for all to share; I am rectangular or square; I am mostly black or green. An encyclopedia gives detailed information on topics; a dictionary gives the meaning and spelling of words. Thesaurus: big - huge, large, vast; clever - bright, smart.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-04-ex3", "mode": "selfcheck"}, {"type": "summary", "points": ["Observe with all senses, ask questions and take notes.", "A report is factual, in past tense and sequence.", "Use polite phrases in group discussions."]}], "id": "ch03-04-fifth-skills", "chapter": "ch03", "kind": "lesson", "minutes": 45}, "ch03-05-brush-story": {"title": "The Magic Brush of Dreams: warm-up and the poem", "summary": "Talk about magic objects and kindness, learn word categories and hear the folk tale in verse.", "blocks": [{"type": "text", "md": "**In this lesson:** Talk about magic objects and kindness, learn word categories and hear the folk tale in verse."}, {"type": "exercise", "title": "Magic objects", "difficulty": "easy", "minutes": 8, "goal": "In pairs: (1) A magical object you would like and why. (2) What you would draw with a magic paintbrush and why. (3) Would you draw for someone else? Also discuss acts of kindness you have heard, read or experienced.", "checklist": ["Gave reasons", "Gave one kindness example"], "solution": "I would like a magic lamp to light schools in villages. With a magic brush I would draw books for children. Yes, I would draw for others because sharing doubles the joy.", "solution_lang": "text", "hints": ["Re-read the relevant part of the passage first."], "id": "ch03-05-ex1", "mode": "selfcheck"}, {"type": "quiz", "title": "Sort the words", "questions": [{"type": "multi", "q": "Which of these are THINGS?", "options": ["paintbrush", "joy", "fortress", "feast", "fear", "winding", "twig", "bows", "drawing", "cold"], "answer": [0, 2, 3, 6], "explanation": "Things: paintbrush, fortress, feast, twig. Actions: bows, drawing, winding. Emotions: joy, fear (cold is a feeling/sensation).", "hints": ["Can you touch it?"]}], "id": "ch03-05-qu1"}, {"type": "read", "title": "The Magic Brush of Dreams: what the poem says", "label": "Read", "md": "Gopi is sent to gather wild beans, rice and mangoes. Instead she sits under a banyan tree and draws pictures in the sand with a twig, and the wind sweeps them away. A man sitting on a stone whispers to her and gives her a magic brush. He tells her to keep it secret and to paint only for the poor, not the wealthy.\n\nGopi runs home, paints a bowl of khichdi and it becomes real. The villagers rush in to see. She paints a muffler for a farmer, a plough for another man, a shawl for a grandmother and a fan for a girl. The news spreads until the Zamindar hears of it. He orders her to paint a tall fortress and treasures. Gopi refuses, since she swore to help the needy. The angry Zamindar has her seized and locked in a cold mud cell, then demands the painting.\n\nThat night, while the Zamindar dreams of gold, Gopi paints a winding road and a strong horse. She escapes, gallops through the villages, and the villagers cheer. When the Zamindar's men chase her, she paints a wide, fast river that stops them. She threatens to paint a beast that will chase and eat them. The Zamindar flees. Gopi paints a feast of sweets and tea, a bright courtyard and a band, and the villagers celebrate.", "note": "This is a summary in plain words of the folk-tale poem; read the poem on pages 123-127 of your textbook."}, {"type": "quiz", "title": "Order the events", "questions": [{"type": "order", "q": "Arrange the events.", "items": ["Gopi is told to gather food but instead sits drawing pictures in the sand.", "A man gives a magic brush to Gopi to paint only for the poor.", "Gopi paints a bowl of khichdi, which becomes real and amazes the villagers.", "Gopi uses the magic brush to paint useful items for the villagers.", "The Zamindar orders Gopi to paint treasures for him.", "The Zamindar throws Gopi into prison.", "Gopi paints a road and a horse to escape.", "Gopi returns to the village with the Zamindar and his men chasing her.", "Gopi paints a wide river, stopping the Zamindar and his men.", "Gopi scares the Zamindar away and celebrates with the villagers."], "explanation": "Story order.", "hints": ["She meets the man before painting."]}], "id": "ch03-05-qu2"}, {"type": "quiz", "title": "Tone and form", "questions": [{"type": "single", "q": "At first the tone is ______.", "options": ["playful and innocent", "tension and suspense", "triumphant and celebratory"], "answer": 0, "explanation": "Gopi draws in the sand.", "hints": ["Child."]}, {"type": "single", "q": "When the Zamindar enters, the tone becomes ______.", "options": ["tension and suspense", "playful and innocent", "triumphant and celebratory"], "answer": 0, "explanation": "Danger enters.", "hints": ["Fear."]}, {"type": "single", "q": "In the final part, the tone is ______.", "options": ["triumphant and celebratory", "tension and suspense", "playful and innocent"], "answer": 0, "explanation": "Gopi wins and they celebrate.", "hints": ["Victory."]}, {"type": "single", "q": "The poem's simple rhyme scheme is ______.", "options": ["ABCB", "ABBA", "ABAB"], "answer": 0, "explanation": "Lines 2 and 4 rhyme.", "hints": ["Second and fourth."]}, {"type": "single", "q": "The poem belongs to the ______ genre.", "options": ["narrative or ballad", "descriptive", "free style"], "answer": 0, "explanation": "It tells a story in verse.", "hints": ["Story."]}, {"type": "single", "q": "What is the effect of repeating 'on you, and you and you'?", "options": ["It builds the threat and shows Gopi pointing at each of them", "It is a mistake", "It is boring", "It is a joke only"], "answer": 0, "explanation": "Repetition adds rhythm and menace.", "hints": ["Pointing."]}, {"type": "single", "q": "The magic paintbrush symbolises ______.", "options": ["the power of art and imagination to change the world", "greed", "barriers"], "answer": 0, "explanation": "Art changes lives.", "hints": ["Imagination."]}, {"type": "single", "q": "The grand fortress symbolises ______.", "options": ["greed and the desire for wealth", "art", "barriers"], "answer": 0, "explanation": "What the Zamindar wants.", "hints": ["Greed."]}, {"type": "single", "q": "The river and beast symbolise ______.", "options": ["barriers that protect Gopi from the Zamindar's anger", "greed", "imagination"], "answer": 0, "explanation": "They protect her.", "hints": ["Protection."]}, {"type": "truefalse", "q": "While Gopi uses the brush to help others, the Zamindar wants it for personal gain; this contrast drives the moral.", "answer": true, "explanation": "Selfless vs selfish.", "hints": ["Contrast."]}], "id": "ch03-05-qu3"}, {"type": "summary", "points": ["A folk tale in verse: Gopi uses the magic brush for the poor.", "The Zamindar stands for greed; Gopi for kindness and courage.", "Tone shifts from playful to tense to triumphant."]}], "terms": [{"term": "Zamindar", "def": "a landowner who ruled over a large area in colonial India"}, {"term": "ballad", "def": "a poem that tells a story"}], "id": "ch03-05-brush-story", "chapter": "ch03", "kind": "lesson", "minutes": 20}, "ch03-06-brush-reflect": {"title": "The Magic Brush of Dreams: think and reflect", "summary": "Extract questions and long questions.", "blocks": [{"type": "text", "md": "**In this lesson:** Extract questions and long questions."}, {"type": "quiz", "title": "Extract 1: the man and the brush", "questions": [{"type": "single", "q": "The man whispering and keeping the brush secret shows his ______ nature.", "options": ["careful and secretive", "magical and delightful"], "answer": 0, "explanation": "He does not want the village to know.", "hints": ["Hush."]}, {"type": "single", "q": "The most likely reason he says 'paint only for the poor' is that he ______.", "options": ["cares about helping people in need and wants to keep the brush from the greedy", "dislikes the rich", "is poor", "wants to be paid"], "answer": 0, "explanation": "He values fairness.", "hints": ["Why the poor?"]}, {"type": "single", "q": "Best title for the extract:", "options": ["The Magic Brush's Secret", "Gopi's Special Gift"], "answer": 0, "explanation": "The extract is about the secret.", "hints": ["Whispers."]}], "id": "ch03-06-qu1"}, {"type": "reveal", "prompt": "What is the significance of the man slipping the brush into Gopi's hand?", "md": "It shows trust and secrecy: he gives her a secret duty and no one else sees it."}, {"type": "quiz", "title": "Extract 2: the Zamindar", "questions": [{"type": "single", "q": "The news spreads 'through forests, fields and plains' because of the brush's ______.", "options": ["wonderful, helpful power", "colour", "price", "size"], "answer": 0, "explanation": "People talk about its miracles.", "hints": ["Magic."]}, {"type": "single", "q": "Things painted are called 'magic gains' because ______.", "options": ["they appear magically and benefit the poor", "they are stolen", "they are costly", "they are old"], "answer": 0, "explanation": "Gains = benefits.", "hints": ["Benefit."]}, {"type": "single", "q": "Which statement is FALSE? A. The brush draws the attention of the Zamindar. B. The Zamindar requests Gopi to paint a grand fortress and jewels.", "options": ["B (he orders, not requests)", "A"], "answer": 0, "explanation": "He 'orders' her; it is a command.", "hints": ["Order vs request."]}, {"type": "single", "q": "The demand for a fortress and jewels reveals that he is ______.", "options": ["greedy and power-hungry", "kind", "generous", "shy"], "answer": 0, "explanation": "He wants wealth and rule.", "hints": ["Wealth."]}], "id": "ch03-06-qu2"}, {"type": "exercise", "title": "Long questions 1-7", "difficulty": "medium", "minutes": 15, "goal": "Answer: (1) Why was Gopi right to refuse the Zamindar? (2) Justify her threat of a beast; how would you deal with it? (3) Why celebrate with the villagers? (4) Compare Gopi's and the Zamindar's use of the brush. (5) What does her refusal show about her? (6) Justify the title. (7) How would you use the brush today?", "checklist": ["Evidence", "Own opinion for 2 and 7"], "solution": "1) She had sworn to help the needy; painting for the greedy would break her promise.\n2) She used it only to protect herself and was not violent. I would also try to talk to him or ask for help.\n3) It shows the victory of kindness and that her art is for everyone.\n4) Gopi uses it for the poor; the Zamindar for gold and power.\n5) She is brave, hones
